name: PR448 late canvas partials
on:
  push:
    branches: [codex/r448-late-browser-20261123]
    paths: [.github/workflows/r448-late-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: canvas, first: P352, second: P205, third: P2052, fourth: P359}
          - {group: timber-and-workspace, first: P116, second: P1161}
          - {group: boundary-and-grid, first: P335, second: P128-P1284, third: P353-P420}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEOMETRY_CHROME: /usr/bin/google-chrome
      GEOMETRY_CHROME_FLAGS: --no-sandbox
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'aa5ccfda67ecf55a33975ffb35cee1fead2119d4'
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm run build
      - uses: ./.github/actions/install-cjk-fonts
        timeout-minutes: 8
      - name: Install diagnostic observer outside product checkout
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/r448-partials.py"
          echo 'cd112c4c81c550507e1a1efeaef5e0c8cc05b1526c4f9ca1c1b3cacc99283abe  '"$RUNNER_TEMP/r448-partials.py" | sha256sum -c -
          test "$(git rev-parse HEAD)" = aa5ccfda67ecf55a33975ffb35cee1fead2119d4
      - name: Run ${{ matrix.first }}
        if: ${{ !cancelled() && matrix.first != '' }}
        id: run_first
        continue-on-error: true
        env:
          PARTIAL: ${{ matrix.first }}
        run: |
          set -euo pipefail
          ulimit -s 16384
          python3 -Bu "$RUNNER_TEMP/r448-partials.py" "$PARTIAL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && matrix.first != '' }}
        with:
          name: r448-late-${{ matrix.first }}
          path: ${{ runner.temp }}/r448-late/${{ matrix.first }}
          if-no-files-found: error
      - name: Run ${{ matrix.second }}
        if: ${{ !cancelled() && matrix.second != '' }}
        id: run_second
        continue-on-error: true
        env:
          PARTIAL: ${{ matrix.second }}
        run: |
          set -euo pipefail
          ulimit -s 16384
          python3 -Bu "$RUNNER_TEMP/r448-partials.py" "$PARTIAL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && matrix.second != '' }}
        with:
          name: r448-late-${{ matrix.second }}
          path: ${{ runner.temp }}/r448-late/${{ matrix.second }}
          if-no-files-found: error
      - name: Run ${{ matrix.third }}
        if: ${{ !cancelled() && matrix.third != '' }}
        id: run_third
        continue-on-error: true
        env:
          PARTIAL: ${{ matrix.third }}
        run: |
          set -euo pipefail
          ulimit -s 16384
          python3 -Bu "$RUNNER_TEMP/r448-partials.py" "$PARTIAL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && matrix.third != '' }}
        with:
          name: r448-late-${{ matrix.third }}
          path: ${{ runner.temp }}/r448-late/${{ matrix.third }}
          if-no-files-found: error
      - name: Run ${{ matrix.fourth }}
        if: ${{ !cancelled() && matrix.fourth != '' }}
        id: run_fourth
        continue-on-error: true
        env:
          PARTIAL: ${{ matrix.fourth }}
        run: |
          set -euo pipefail
          ulimit -s 16384
          python3 -Bu "$RUNNER_TEMP/r448-partials.py" "$PARTIAL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && matrix.fourth != '' }}
        with:
          name: r448-late-${{ matrix.fourth }}
          path: ${{ runner.temp }}/r448-late/${{ matrix.fourth }}
          if-no-files-found: error
      - name: Assert strict partial outcomes
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: ${{ format('{0},{1},{2},{3}', steps.run_first.outcome, steps.run_second.outcome, steps.run_third.outcome, steps.run_fourth.outcome) }}
        run: |
          echo "$OUTCOMES"
          [[ "$OUTCOMES" != *failure* ]]

