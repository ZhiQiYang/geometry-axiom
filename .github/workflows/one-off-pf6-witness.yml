name: PF-6 普通合流紀錄
on:
  push:
    branches: [codex/r02-pf6-witness-20261121]
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ec86dbcc05153696bbc19d12df8da2306d2e64f5
          fetch-depth: 0
          persist-credentials: false
      - name: 核對兩個父提交，以 Git 一般合流取得雙方原文
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ec86dbcc05153696bbc19d12df8da2306d2e64f5
          main=3ef07683b76837fd08f8737ac5f515a3e46d6b6b
          test "$(git rev-parse refs/remotes/origin/main)" = "$main"
          test "$(git merge-base HEAD "$main")" = 1b1c66749786c238042e3ba1c3917b1ad33b31bc
          git config user.name Codex
          git config user.email codex@users.noreply.github.com
          out="$RUNNER_TEMP/pf6-merge"
          mkdir -p "$out"
          set +e
          git merge --no-commit --no-ff "$main" >"$out/merge.log" 2>&1
          status=$?
          set -e
          cat "$out/merge.log"
          echo "$status" | tee "$out/exit-code.txt"
          test "$status" = 1
          git diff --name-only --diff-filter=U | tee "$out/paths.txt"
          git ls-files --unmerged > "$out/index.txt"
          expected=(geometry-core/domain-decoupling/product-architecture.json geometry-web/engineering_bridge.inc geometry-web/web_bridge.c tests/test_geo314_commit_paths.py)
          printf '%s\n' "${expected[@]}" | diff -u - "$out/paths.txt"
          git diff --cc > "$out/conflicts.diff"
          grep -Fq '!g_preview.pf6_batch' geometry-web/engineering_bridge.inc
          grep -Fq 'strcmp(g_preview.command,"framing-template-transaction")' geometry-web/engineering_bridge.inc
          git merge --abort
          test "$(git rev-parse HEAD)" = ec86dbcc05153696bbc19d12df8da2306d2e64f5
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pf6-merge-conflicts
          path: ${{ runner.temp }}/pf6-merge
          if-no-files-found: error
