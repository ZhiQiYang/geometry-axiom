name: PR448 cold legacy registry A B
on:
  push:
    branches: [codex/r448-validation-20261123]
    paths: [.github/workflows/r448-registry-cold-ab.yml]
permissions:
  contents: read
jobs:
  cold:
    name: cold registry (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        arm: [original, scoped-offline]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 95c1454e41540aaa82d3194b6f69a96ce833719c
          fetch-depth: 2
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Original 22-case child with the original 60-second total budget
        env:
          ARM: ${{ matrix.arm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -s 16384
          echo "" | base64 -d > "$RUNNER_TEMP/probe.py"
          echo "2b9fec79b020386315e5d3faf2dcc8d354d3e5aff4e22eb93ff5d206341a93f6  $RUNNER_TEMP/probe.py" | sha256sum -c
          python3 -B "$RUNNER_TEMP/probe.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r448-cold-registry-${{ matrix.arm }}
          path: |
            ${{ runner.temp }}/cold-registry/*.json
            ${{ runner.temp }}/cold-registry/gate.log
          if-no-files-found: error
