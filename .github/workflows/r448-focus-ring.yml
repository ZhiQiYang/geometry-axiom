name: PR448 face keyboard focus paint diagnostic
on:
  push:
    branches: [codex/r448-focus-probe-20261123]
    paths: [.github/workflows/r448-focus-ring.yml]
permissions:
  contents: read
jobs:
  original-p1231:
    strategy:
      fail-fast: false
      matrix:
        phase: [baseline, mutant, restored]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEOMETRY_CHROME: /usr/bin/google-chrome
      GEOMETRY_CHROME_FLAGS: --no-sandbox
      GEOMETRY_TEST_URL: http://127.0.0.1:18839/
      GEOMETRY_CANVAS_MODULE_ONLY: '1'
      GEOMETRY_CANVAS_MODULE: P1231
      PYTHONDONTWRITEBYTECODE: '1'
      R448_FOCUS_PHASE: ${{ matrix.phase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '7cfba103d3dc199c2903c97ac42c44c8a607d38c'
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm run build
      - uses: ./.github/actions/install-cjk-fonts
        timeout-minutes: 8
      - name: Prepare exact CSS before starting the product and audit native Tab focus
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 16384
          export TMPDIR="$RUNNER_TEMP"
          export GEOMETRY_FEEDBACK_DIR="$TMPDIR/r448-feedback"
          out="$RUNNER_TEMP/r448-focus"
          export R448_FOCUS_OUT="$out/focus"
          mkdir -p "$out" "$GEOMETRY_FEEDBACK_DIR"
          observer="$RUNNER_TEMP/focus-ring-preload.cjs"
          echo '' | base64 -d > "$observer"
          echo '6f64d15e07931660af3e65078be90008375884eb24b41b948f2fe9ba68ab4b85  '"$observer" | sha256sum -c -
          test "$(git rev-parse HEAD)" = 7cfba103d3dc199c2903c97ac42c44c8a607d38c
          "$GEOMETRY_CHROME" --version > "$out/chrome-version.txt"
          node "$observer" prepare
          python3 -Bu geometry-web/start_local.py --port 18839 > "$out/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            kill -0 "$server"
            if python3 -B geometry-web/runtime_version.py --probe 18839 > "$out/runtime.json" 2> "$out/probe.stderr"; then break; fi
            sleep 1
          done
          python3 -B geometry-web/runtime_version.py --probe 18839
          curl --fail --silent "${GEOMETRY_TEST_URL}workspace-height.css" -o "$out/served.css"
          cmp geometry-web/workspace-height.css "$out/served.css"
          rc=0
          node --require "$observer" geometry-web/cdp_test.js > "$out/stdout.log" 2> "$out/stderr.log" || rc=$?
          echo "$rc" > "$out/exit-code"
          cat "$R448_FOCUS_OUT/captures.json"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r448-focus-ring-${{ matrix.phase }}
          path: ${{ runner.temp }}/r448-focus
          if-no-files-found: error

