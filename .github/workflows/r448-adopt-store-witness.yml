name: R16 採入不可變 CI 收據
on:
  push:
    branches: [codex/r448-adopt-store-20261125]
    paths: [.github/r448-store-request.json]
permissions:
  contents: read
  actions: read
jobs:
  adopt:
    name: 核對來源並產生只含 .github/evidence 的候選
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: witness
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/r448-store-request.json
            /.github/scripts/r448_store_witness.py
      - name: 讀取固定採入請求
        id: request
        run: |
          set -euo pipefail
          file=witness/.github/r448-store-request.json
          head=$(jq -er '.source | select(test("^[0-9a-f]{40}$"))' "$file")
          target=$(jq -er '.target | select(test("^[0-9a-f]{40}$"))' "$file")
          run=$(jq -er '.run | select(type == "string" and test("^[1-9][0-9]*$"))' "$file")
          printf 'head=%s\ntarget=%s\nrun=%s\n' "$head" "$target" "$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.request.outputs.target }}
          path: product
          persist-credentials: false
      - name: 核對官方 ZIP、原始裁判與固定歷史檔，建立候選 Git bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ME_SOURCE: ${{ steps.request.outputs.head }}
          ADOPT_TARGET: ${{ steps.request.outputs.target }}
          ME_RUN_ID: ${{ steps.request.outputs.run }}
        working-directory: product
        run: python3 -B ../witness/.github/scripts/r448_store_witness.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r448-store-candidate-${{ steps.request.outputs.target }}
          path: ${{ runner.temp }}/r448-store-receipt/
          if-no-files-found: error
          retention-days: 14
