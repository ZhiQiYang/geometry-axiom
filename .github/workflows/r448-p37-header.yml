name: PR448 P37 mobile header measurement
on:
  push:
    branches: [codex/r448-validation-20261123]
    paths: [.github/workflows/r448-p37-header.yml]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 37458f4e6847f11d867e3052b69812a4a8b30b7f
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm run build
      - uses: ./.github/actions/install-cjk-fonts
      - name: Measure the original P37 expression on an isolated Linux Chrome
        shell: bash
        env:
          R448_P37_EXPECT: pass
          R448_GLYPH_EXPECT: full
        run: |
          set -euo pipefail
          ulimit -s 16384
          export TMPDIR="$RUNNER_TEMP" GEOMETRY_FEEDBACK_DIR="$RUNNER_TEMP/p37-feedback" PYTHONDONTWRITEBYTECODE=1
          export R448_P37_OUT="$RUNNER_TEMP/p37-out"
          mkdir -p "$R448_P37_OUT" "$GEOMETRY_FEEDBACK_DIR"
          test "$(git rev-parse HEAD)" = 37458f4e6847f11d867e3052b69812a4a8b30b7f
          git rev-parse HEAD > "$R448_P37_OUT/source"
          git rev-parse 'HEAD^{tree}' > "$R448_P37_OUT/tree"
          google-chrome --version > "$R448_P37_OUT/chrome-version.txt"
          echo '' | base64 -d > "$RUNNER_TEMP/p37.cjs"
          echo '54a5b1370fb511de69697e4f89dc158bbc0486e9f9c1dcb676e8758a247b4d84  '"$RUNNER_TEMP/p37.cjs" | sha256sum -c -
          python3 -Bu geometry-web/start_local.py --port 18839 > "$R448_P37_OUT/server.log" 2>&1 &
          server=$!
          google-chrome --headless=new --disable-gpu --no-sandbox --no-first-run --no-default-browser-check --remote-debugging-port=9236 --user-data-dir="$RUNNER_TEMP/p37-chrome" about:blank > "$R448_P37_OUT/chrome.log" 2>&1 &
          chrome=$!
          trap 'kill "$server" "$chrome" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            kill -0 "$server" "$chrome"
            if python3 -B geometry-web/runtime_version.py --probe 18839 > "$R448_P37_OUT/runtime-probe.json" 2> "$R448_P37_OUT/probe.stderr" && curl -fsS localhost:9236/json/version >/dev/null; then break; fi
            sleep 1
          done
          python3 -B geometry-web/runtime_version.py --probe 18839 >/dev/null
          curl -fsS localhost:18839/runtime > "$R448_P37_OUT/runtime.json"
          node "$RUNNER_TEMP/p37.cjs"
          git diff --exit-code -- .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r448-p37-header-37458f4e6847f11d867e3052b69812a4a8b30b7f
          path: ${{ runner.temp }}/p37-out
          if-no-files-found: error
          retention-days: 7
