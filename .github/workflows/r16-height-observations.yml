name: R16 三尺寸獨立量測與原架構檢查
on:
  push:
    branches: [codex/r16-u123h-witness-20261121]
    paths: [.github/workflows/r16-height-observations.yml, .github/scripts/r16-layout-survey.cjs]
permissions:
  contents: read
env:
  SOURCE_SHA: 38a86e71c03815b595fdb135d9d7cd62b9ba0500
  EXPECTED_TREE: e51336901efb0adf58b7b48daebd83f560845e9b
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  survey:
    name: Chrome 直接量測六工作區與既有控制
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEOMETRY_TEST_URL: http://127.0.0.1:18839/
      GEOMETRY_FEEDBACK_DIR: /tmp/r16-observe-feedback
      GEOMETRY_CHROME: /usr/bin/google-chrome
      R16_OBSERVATIONS: ${{ runner.temp }}/r16-direct
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 38a86e71c03815b595fdb135d9d7cd62b9ba0500
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: 取本輪觀測腳本與核對兩個來源
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/r16-layout-survey.cjs" > "$RUNNER_TEMP/observer.cjs"
          node --check "$RUNNER_TEMP/observer.cjs"
          mkdir -p "$R16_OBSERVATIONS" "$GEOMETRY_FEEDBACK_DIR"
          sha256sum "$RUNNER_TEMP/observer.cjs" geometry-web/workspace_height_test.js > "$R16_OBSERVATIONS/sources.sha256"
          git show -s --format='%H %T %P' HEAD > "$R16_OBSERVATIONS/source.txt"
          "$GEOMETRY_CHROME" --version | tee "$R16_OBSERVATIONS/chrome.txt"
      - run: npm run build
      - uses: ./.github/actions/install-cjk-fonts
        timeout-minutes: 8
      - name: 以原 section 探針獨立量測三種大小，保留每一筆失敗
        shell: bash
        run: |
          set -euo pipefail
          ulimit -s 16384
          python3 -u geometry-web/start_local.py --port 18839 > "$R16_OBSERVATIONS/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            kill -0 "$server"
            if python3 geometry-web/runtime_version.py --probe 18839 > /dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 geometry-web/runtime_version.py --probe 18839 | tee "$R16_OBSERVATIONS/runtime.json"
          timeout 900s node "$RUNNER_TEMP/observer.cjs"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-direct-observations-38a86e71c03815b595fdb135d9d7cd62b9ba0500
          path: ${{ runner.temp }}/r16-direct/
          if-no-files-found: error
          retention-days: 14
  architecture:
    name: 原架構三命令
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 38a86e71c03815b595fdb135d9d7cd62b9ba0500
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          python3 -B .github/scripts/architecture_evidence.py --out "$RUNNER_TEMP/r16-arch"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-architecture-38a86e71c03815b595fdb135d9d7cd62b9ba0500
          path: ${{ runner.temp }}/r16-arch/
          if-no-files-found: error
          retention-days: 14
  registry:
    name: 原登錄守門撤回與兩支共享 Node 測試
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 38a86e71c03815b595fdb135d9d7cd62b9ba0500
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: 核對基底及來源
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git fetch --no-tags --depth=1 --filter=blob:none origin 1b1c66749786c238042e3ba1c3917b1ad33b31bc
          mkdir -p "$RUNNER_TEMP/r16-registry"
      - name: 診斷工具原自測與三組撤回
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r16-registry"
          node tests/diagnostics/r16_canvas_golden.cjs --self-test | tee "$out/self-test.log"
          node tests/diagnostics/r16_canvas_golden.cjs --prove-guards "$out/proof" | tee "$out/guard-withdrawals.log"
      - name: 執行共享登錄測試
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/test_canvas_shards.js tests/test_identity_canvas_merge.js 2>&1 | tee "$RUNNER_TEMP/r16-registry/guard-tests.tap"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r16-registry-38a86e71c03815b595fdb135d9d7cd62b9ba0500
          path: ${{ runner.temp }}/r16-registry/
          if-no-files-found: error
          retention-days: 14
