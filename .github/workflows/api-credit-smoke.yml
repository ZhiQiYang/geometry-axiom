name: API credit smoke (temporary)

# 暫時性探針：確認 repo secret ANTHROPIC_API_KEY 在 GitHub runner 上
# (A) 直接呼叫 Messages API、(B) 透過 Claude Code CLI 兩條路各自能不能扣到 API 額度。
# 只送固定的一句話，不讀 repo、不 checkout、不帶任何 GitHub token。
# 合併前必須刪除本檔（#451 的終審範圍不含它）。

on:
  push:
    branches:
      - claude/api-adversarial-review-workflow
    paths:
      - .github/workflows/api-credit-smoke.yml

permissions: {}

concurrency:
  group: api-credit-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: API credit smoke
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_VERSION: "2.1.330"
      CLAUDE_CODE_TARBALL_SHA512: "9Gn+V7DtJ8M1nztP9CeDVl9g3RtrepI7rOFTyPRRnZe8D6zebIHKmC7OvBauucuAP0X0k85SDN/LPVZyjsGezQ=="
    steps:
      - name: (A) Direct Messages API call
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then echo "A: secret 是空的"; exit 0; fi
          code=$(curl -sS -o "$RUNNER_TEMP/a.json" -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "anthropic-version: 2026-10-21" \
            -d '{"model":"claude-opus-5-5","max_tokens":2000,"output_config":{"effort":"low"},"messages":[{"role":"user","content":"只回一個字：好"}]}') || code="curl-failed"
          echo "A: http=$code"
          jq -c '{type, model, stop_reason, text: ([.content[]? | select(.type=="text") | .text] | join("")), usage: (.usage | {input_tokens, output_tokens}?), error: (.error | {type, message}?)}' "$RUNNER_TEMP/a.json" || true

      - name: Install pinned Claude Code CLI (no API key in this step)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/claude-cli"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/cli.tgz" "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
          actual="$(openssl dgst -sha512 -binary "$dir/cli.tgz" | base64 -w0)"
          if [ "$actual" != "$CLAUDE_CODE_TARBALL_SHA512" ]; then
            echo "::error::Claude Code tarball sha512 不符" >&2; exit 1
          fi
          tar -xzf "$dir/cli.tgz" -C "$dir"
          "$dir/package/claude" --version

      - name: (B) Claude Code CLI with the same flags as the review workflow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          home="$RUNNER_TEMP/claude-home"
          mkdir -p "$home" "$RUNNER_TEMP/empty"
          cd "$RUNNER_TEMP/empty"
          status=0
          printf '只回一個字：好\n' | HOME="$home" DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
          "$RUNNER_TEMP/claude-cli/package/claude" -p \
            --bare --restricted --strict-mcp-config --disable-slash-commands --no-session-persistence \
            --tools "Read,Grep,Glob" \
            --allowedTools "Read,Grep,Glob" \
            --permission-mode dontAsk \
            --model claude-opus-5-5 --effort low \
            --max-turns 1 --max-budget-usd 1 \
            --output-format json \
            > "$RUNNER_TEMP/b.json" 2> "$RUNNER_TEMP/b.err" || status=$?
          echo "B: exit=$status"
          jq -c '{is_error, subtype, terminal_reason, num_turns, total_cost_usd, result: (.result | tostring | .[0:200])}' "$RUNNER_TEMP/b.json" || true
          head -c 1500 "$RUNNER_TEMP/b.err" || true
