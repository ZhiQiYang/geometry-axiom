name: OpenAI adversarial review

# 用 repo secret OPENAI_API_KEY（ChatGPT 訂閱附的 OpenAI API 點數），對指定 PR 跑 main 上
# .github/prompts/adversarial-review.md 的 A–F 唯讀對抗審查，結果以【OpenAI 對抗審查】留言在該 PR。
# 用途：記錄類 PR 的終審（使用者 2026-11-26 核可分級終審）。
# 結構沿用 api-adversarial-review.yml；模型迴圈改為 main 上的 .github/scripts/openai_agent.py --mode review
# （官方 openai Python SDK 直接呼叫 Responses API；工具只有 read_file 與 search，沒有 shell；不用 Codex）。
#
# 只能手動觸發（擁有者本人）：
#   gh workflow run openai-adversarial-review.yml --repo ZhiQiYang/geometry-axiom --ref main -f pr_number=<號> \
#     [-f max_budget_usd=10] [-f model=gpt-6.2-astra]

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要審查的 PR 號（head 必須在本 repo，base 必須是 main）
        required: true
        type: string
      max_budget_usd:
        description: 本次審查的 API 花費上限（美元，上限 30；依 usage 與文件價格表估算）
        required: false
        default: "10"
        type: string
      model:
        description: 模型 id（白名單；價格表在 .github/scripts/openai_agent.py）
        required: false
        default: gpt-6.2-astra
        type: choice
        options:
          - gpt-6.2-astra
          - gpt-6.2-sol

# workflow 層級不給任何權限；只在 job 上給最小權限。
permissions: {}

concurrency:
  group: openai-adversarial-review-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: 'OpenAI adversarial review of PR #${{ inputs.pr_number }}'
    # 只准 repo 擁有者本人、從 main 上的這份 workflow 觸發。
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      # 官方 openai Python SDK 的釘選版本；依賴全部釘版並驗 sha256（與 openai-worker.yml 相同的清單）。
      OPENAI_SDK_VERSION: "3.56.0"
      REVIEW_MODEL: ${{ inputs.model }}
      REVIEW_EFFORT: high
      REVIEW_MAX_TURNS: "120"
      # 模型迴圈自己的總時限（秒）：比審查 step 的 40 分鐘短，留時間收尾並寫出結果 JSON。
      REVIEW_TIME_LIMIT_SEC: "2100"
    steps:
      - name: Validate inputs and resolve PR (fork heads are rejected)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::pr_number 必須是正整數" >&2; exit 1
          fi
          case "$REVIEW_MODEL" in gpt-6.2-astra|gpt-6.2-sol) ;; *) echo "::error::model 不在白名單內" >&2; exit 1 ;; esac
          if ! [[ "$MAX_BUDGET_USD" =~ ^[0-9]{1,2}(\.[0-9]{1,2})?$ ]] \
             || ! python3 -c 'import sys; v=float(sys.argv[1]); sys.exit(0 if 0 < v <= 30 else 1)' "$MAX_BUDGET_USD"; then
            echo "::error::max_budget_usd 必須是 0 到 30 之間的數字" >&2; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-meta.json"
          python3 - "$RUNNER_TEMP/pr-meta.json" <<'PY'
          import json, os, re, sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name") or ""
          if head_repo.lower() != repo:
              sys.exit(f"::error::PR head 來自 {head_repo or '已刪除的 repo'}，不是本 repo；拒絕審查 fork PR")
          if (pr.get("base") or {}).get("ref") != "main":
              sys.exit("::error::只審 base 為 main 的 PR")
          head_sha = pr["head"]["sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              sys.exit("::error::head SHA 格式不符")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"head_sha={head_sha}\n")
              out.write(f"short_sha={head_sha[:7]}\n")
          print(f"PR #{pr['number']} head {head_sha} (state={pr['state']})")
          PY
          echo "max_budget_usd=$MAX_BUDGET_USD" >> "$GITHUB_OUTPUT"

      - name: Check out trusted main (prompt and reference tree)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Check out PR head as data (never executed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Collect read-only git and GitHub data (no API key in this step)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          data="$GITHUB_WORKSPACE/review-data"
          mkdir -p "$data/commits"
          # 符號連結可能指向工作區外（例如 /proc/self/environ），一律換成純文字佔位檔，只留目標字串當資料。
          : > "$data/symlinks.txt"
          while IFS= read -r -d '' link; do
            target=$(readlink -- "$link")
            printf '%s -> %s\n' "${link#"$GITHUB_WORKSPACE"/}" "$target" >> "$data/symlinks.txt"
            rm -f -- "$link"
            printf '[symlink placeholder] target: %s\n' "$target" > "$link"
          done < <(find "$GITHUB_WORKSPACE/pr" "$GITHUB_WORKSPACE/main" -type l -print0)

          G=(git -C "$GITHUB_WORKSPACE/pr" -c core.hooksPath=/dev/null -c diff.external= -c core.pager=cat)
          test "$("${G[@]}" rev-parse HEAD)" = "$HEAD_SHA"
          # 差異基底固定用 main 目錄簽出的同一個 commit（github.sha），讓「main 目錄」與 diff 基底一致。
          base="$GITHUB_SHA"
          "${G[@]}" cat-file -e "$base^{commit}"
          mb="$("${G[@]}" merge-base "$base" HEAD)"
          printf 'main=%s\nmerge_base=%s\nhead=%s\norigin_main_at_fetch=%s\n' "$base" "$mb" "$HEAD_SHA" "$("${G[@]}" rev-parse origin/main)" > "$data/refs.txt"
          "${G[@]}" diff --no-ext-diff --no-textconv "$base...HEAD" > "$data/diff.patch"
          "${G[@]}" diff --no-ext-diff --no-textconv --stat=200 "$base...HEAD" > "$data/diff-stat.txt"
          "${G[@]}" diff --no-ext-diff --no-textconv --name-status "$base...HEAD" > "$data/diff-name-status.txt"
          "${G[@]}" log --no-color --format='commit %H%nAuthor: %an%nDate:   %aI%n%n%B' "$base..HEAD" > "$data/log.txt"
          # 合併 commit 用 --remerge-diff：只列出與自動合併結果不同的部分（衝突解法或手改），乾淨合併為空。
          # 三親以上（octopus）的合併，git 會寫「Skipping remerge-diff for octopus merges」且沒有任何差異；
          # 這種 commit 另在同一檔尾端附上對各父節點的差異（git diff <父> <commit>），讓審查者仍看得到歸屬。
          for c in $("${G[@]}" rev-list "$base..HEAD"); do
            out="$data/commits/$c.txt"
            "${G[@]}" show --no-ext-diff --no-textconv --no-color --remerge-diff --stat --patch "$c" > "$out"
            read -r -a parents <<< "$("${G[@]}" rev-list --parents -n 1 "$c" | cut -d' ' -f2-)"
            if [ "${#parents[@]}" -gt 2 ]; then
              n=0
              for p in "${parents[@]}"; do
                n=$((n + 1))
                printf '\n=== octopus 合併（%d 個父節點）：對第 %d 個父節點 %s 的差異（git diff %s %s）===\n' "${#parents[@]}" "$n" "$p" "$p" "$c" >> "$out"
                "${G[@]}" diff --no-ext-diff --no-textconv --no-color --stat=200 --patch "$p" "$c" >> "$out"
              done
            fi
          done

          api() { gh api --paginate "$1" --jq '.[]' | jq -s "$2"; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq '{number, title, state, draft, user: .user.login, body, base: .base.ref, head: .head.ref, head_sha: .head.sha, labels: [.labels[].name], created_at, updated_at, html_url}' > "$data/pr.json.tmp"
          api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" '[.[] | {sha, author: .commit.author.name, date: .commit.author.date, message: .commit.message}]' > "$data/commits.json"
          jq --slurpfile commits "$data/commits.json" '. + {commits: $commits[0]}' "$data/pr.json.tmp" > "$data/pr.json"
          rm -f "$data/pr.json.tmp" "$data/commits.json"
          api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" '[.[] | {user: .user.login, created_at, updated_at, body, html_url}] | sort_by(.created_at)' > "$data/issue-comments.json"
          api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" '[.[] | {user: .user.login, state, submitted_at, commit_id, body, html_url}]' > "$data/reviews.json"
          api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments?per_page=100" '[.[] | {user: .user.login, created_at, path, line, original_line, commit_id, in_reply_to_id, body, html_url}] | sort_by(.created_at)' > "$data/review-comments.json"
          wc -c "$data"/*.patch "$data"/*.json "$data"/*.txt

      - name: Install pinned openai SDK into a venv (hash-verified, no API key in this step)
        run: |
          set -euo pipefail
          # 與 openai-worker.yml 相同：依賴全部釘版、驗 sha256、只收 wheel；CPython 3.12／manylinux x86_64。
          if ! /usr/bin/python3.12 -c 'import ensurepip' 2> /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends python3-venv
          fi
          req="$RUNNER_TEMP/openai-requirements.txt"
          cat > "$req" <<'REQ'
          annotated-types==0.8.0 --hash=sha256:f072f4d804ea359e4eaf198b1af7a8b0943881a87f31bb764f8bf219bb9419e0
          anyio==4.16.0 --hash=sha256:c66ae634e0b8228396b801741beb3294326d4b6102f7bba4041c0dfb58c29026
          h11==0.16.0 --hash=sha256:63cf8bbe7522de3bf65932fda1d9c2772064ffb3dae62d55932da54b31cb6c86
          httpcore2==2.16.2 --hash=sha256:16051ae2a42f776007543f32de9349a317b23d2cbb4e1456b4bac0e88b87419a
          httpx2==2.16.2 --hash=sha256:f05c13aade4c45dbf1c9060647a1058f0acad62398fad96e741269edb33d46f5
          idna==3.20 --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
          jiter==0.19.0 --hash=sha256:0956b5f58b804221dfb929c120e6d4032138fed20c1cc0ef683a2d1326255e46
          openai==3.56.0 --hash=sha256:24043ea80048ed1cd6c263c4fc4192406d05c418e87e89310eecbf55a9021c32
          pydantic==2.14.4 --hash=sha256:653a2ad9f6d8858529c77c72717d0ea991d6c6837fe683246b2f4b2bbfc3fadc
          pydantic-core==2.50.5 --hash=sha256:470bbc2495367f60d3ca849a8039e4c164701d10637e7743f4427d92651bdb6d
          sniffio==1.3.1 --hash=sha256:2f6da418d1f1e0fddd844478f41680e794e6051915791a034ff65e5f100525a2
          truststore==0.10.5 --hash=sha256:9aaaedaefaf06d8b206278cf8b5012bc897f485a874503501e12d776df78951c
          typing-extensions==4.16.0 --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          typing-inspection==0.4.5 --hash=sha256:bc210535442b39e1bf2805e0c7a17dfd6a4ace760c84c7f7d16245d23a6b1c39
          REQ
          sed -i 's/^ *//' "$req"
          grep -qx "openai==${OPENAI_SDK_VERSION} --hash=sha256:[0-9a-f]\{64\}" "$req"
          venv="$RUNNER_TEMP/openai-venv"
          rm -rf "$venv"
          /usr/bin/python3.12 -m venv "$venv"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" PIP_DISABLE_PIP_VERSION_CHECK=1 "$venv/bin/pip" install -q \
            --no-deps --require-hashes --only-binary :all: --no-cache-dir -r "$req"
          env -i PATH=/usr/bin:/bin "$venv/bin/pip" check
          got="$("$venv/bin/python" -I -c 'import openai; print(openai.__version__)')"
          test "$got" = "$OPENAI_SDK_VERSION" || { echo "::error::openai SDK 版本不符：$got" >&2; exit 1; }
          echo "openai SDK $got"

      - name: Build prompt from trusted main copy
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          MAX_BUDGET_USD: ${{ steps.pr.outputs.max_budget_usd }}
        run: |
          set -euo pipefail
          {
            cat "$GITHUB_WORKSPACE/main/.github/prompts/adversarial-review.md"
            printf '\n## 本次執行參數（由 workflow 產生）\n\n'
            printf -- '- 受審 PR：#%s\n' "$PR_NUMBER"
            printf -- '- head SHA：%s\n' "$HEAD_SHA"
            printf -- '- 工作目錄：%s\n' "$GITHUB_WORKSPACE"
            printf -- '- PR 目錄（head 檔案樹，受審資料）：%s/pr\n' "$GITHUB_WORKSPACE"
            printf -- '- main 目錄（可信版本）：%s/main\n' "$GITHUB_WORKSPACE"
            printf -- '- 資料目錄：%s/review-data（refs.txt 記錄 main、merge-base、head 的完整 SHA）\n' "$GITHUB_WORKSPACE"
            printf -- '- 本次由 OpenAI 模型（%s）經 Responses API 執行。工具只有兩個：read_file（對應上文的 Read）與 search（對應上文的 Grep；pattern 為空字串時列出符合 glob 的檔名，對應 Glob）。上文「三個工具」的限制照樣適用：沒有 shell、不能執行程式、不能上網、不能寫檔、不能留言。\n' "$REVIEW_MODEL"
            printf -- '- workflow 自動加上的標頭是「【OpenAI 對抗審查】PR #%s head <短 SHA>」（取代上文所寫的【API 對抗審查】），你同樣不要自己寫標頭。\n' "$PR_NUMBER"
            printf -- '- 本次有最大輪數 %s、花費上限（估算）US$%s、總時限 %s 分鐘；接近上限時 workflow 會通知你停止，屆時只能輸出最終報告，未讀完的部分列入「未驗項」。\n' "$REVIEW_MAX_TURNS" "$MAX_BUDGET_USD" "$((REVIEW_TIME_LIMIT_SEC / 60))"
          } > "$RUNNER_TEMP/review-prompt.md"

      - name: Preflight the tool list without the API key
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # 不帶金鑰、不連網：取得模型迴圈實際提供的工具清單（模型迴圈程式取 main 目錄＝github.sha 的版本）。
          out="$(env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 "$RUNNER_TEMP/openai-venv/bin/python" -I \
            "$GITHUB_WORKSPACE/main/.github/scripts/openai_agent.py" --mode review --workdir "$GITHUB_WORKSPACE" \
            --model "$REVIEW_MODEL" --list-tools)"
          echo "$out"
          echo "$out" | jq -e '.mode == "review" and .tools == ["read_file","search"]' > /dev/null \
            || { echo "::error::模型迴圈的工具清單不是恰好 read_file/search，中止" >&2; exit 1; }

      - name: Run read-only review (the only step that receives the API key)
        timeout-minutes: 40
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_BUDGET_USD: ${{ steps.pr.outputs.max_budget_usd }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # 留言步驟靠這兩個標記分辨「模型迴圈沒啟動」與「已啟動（可能已呼叫 API）但沒有結果」。
          rm -f "$RUNNER_TEMP/review-result.json" "$RUNNER_TEMP/review-cli-exit"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/review-cli-started"
          status=0
          # 允許清單式環境（env -i）：模型迴圈行程裡沒有任何 GITHUB_*／ACTIONS_* 與 token，只有這一把 API 金鑰。
          # 模型沒有 shell；read_file／search 只限工作目錄（main、pr、review-data）之內。
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            "$RUNNER_TEMP/openai-venv/bin/python" -I "$GITHUB_WORKSPACE/main/.github/scripts/openai_agent.py" \
            --mode review --workdir "$GITHUB_WORKSPACE" --model "$REVIEW_MODEL" --effort "$REVIEW_EFFORT" \
            --max-turns "$REVIEW_MAX_TURNS" --max-budget-usd "$MAX_BUDGET_USD" --time-limit-sec "$REVIEW_TIME_LIMIT_SEC" \
            < "$RUNNER_TEMP/review-prompt.md" > "$RUNNER_TEMP/review-result.json" || status=$?
          echo "$status" > "$RUNNER_TEMP/review-cli-exit"
          echo "agent exit status: $status"
          jq '{is_error, end_reason, started, num_turns, api_calls, total_cost_usd, cost_is_estimate, error}' \
            "$RUNNER_TEMP/review-result.json" || true

      - name: Post the review as one PR comment (no API key in this step)
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          rc=0
          python3 - "$RUNNER_TEMP" "$current" > "$RUNNER_TEMP/review-comment.md" <<'PY' || rc=$?
          import json, os, re, sys
          tmp, current = sys.argv[1], sys.argv[2]
          env = os.environ
          # 三件事分開記錄：模型迴圈是否啟動、結束碼、是否有可解析的結果。
          started = os.path.exists(os.path.join(tmp, "review-cli-started"))
          try:
              exit_code = open(os.path.join(tmp, "review-cli-exit"), encoding="utf-8").read().strip() or None
          except OSError:
              exit_code = None
          result_path = os.path.join(tmp, "review-result.json")
          res, parse_note = None, ""
          try:
              raw = open(result_path, encoding="utf-8").read()
          except OSError:
              parse_note = "輸出檔不存在"
          else:
              if not raw.strip():
                  parse_note = "輸出檔是空的"
              else:
                  try:
                      res = json.loads(raw)
                  except ValueError:
                      parse_note = f"輸出檔無法解析為 JSON（{len(raw.encode('utf-8'))} bytes，可能只寫了一半）"
                  else:
                      if not isinstance(res, dict):
                          res, parse_note = None, "輸出檔不是 JSON 物件"
          parsed = res is not None
          res = res or {}
          text = res.get("result").strip() if isinstance(res.get("result"), str) else ""
          # 成功必須同時滿足：模型迴圈已啟動、結束碼 0、結果可解析、is_error 為 false、結束原因 completed、有審查內文。
          ok = (started and exit_code == "0" and parsed and res.get("is_error") is False
                and res.get("end_reason") == "completed" and bool(text))
          # 看起來像憑證的字串一律拒貼（含 OpenAI 金鑰格式 sk-…）。
          if re.search(r"sk-ant-[A-Za-z0-9_-]{8,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}", text):
              print("::error::審查輸出含疑似憑證字串，拒絕貼出", file=sys.stderr)
              sys.exit(3)
          # 不讓模型輸出 @ 到任何人：@ 後面接英數字一律插入零寬空白（U+200B），不看前一個字元，
          # 因為 Python 的 \w 含中日韓文字，「中文字＋@帳號」若用前字排除會漏掉。
          text = re.sub(r"@(?=[A-Za-z0-9])", "@\u200b", text)
          cost = res.get("total_cost_usd") if parsed else None
          if not started:
              cost_text = "無（模型迴圈未啟動）"
          elif parsed and res.get("started") is False:
              cost_text = "US$0（沒有送出任何 API 請求）"
          elif isinstance(cost, (int, float)) and not isinstance(cost, bool):
              cost_text = f"約 US${cost:.4f}（估算：依每輪 usage 與文件價格表計，偏高、非帳單金額）"
          else:
              cost_text = "未知（模型迴圈已啟動，可能已產生費用；請到 OpenAI 用量頁核對）"
          if exit_code is not None:
              exit_text = exit_code
          else:
              exit_text = "未記錄（審查 step 可能逾時或被中斷）" if started else "無（模型迴圈未啟動）"
          end_reason = res.get("end_reason") if parsed else None
          status_line = (f"- 模型迴圈啟動：{'是' if started else '否'}；結束碼：{exit_text}；"
                         f"可解析結果：{'是' if parsed else '否（' + parse_note + '）'}；結束原因：`{end_reason}`")
          err = res.get("error") if isinstance(res.get("error"), dict) else None
          lines = [f"【OpenAI 對抗審查】PR #{env['PR_NUMBER']} head {env['SHORT_SHA']}", ""]
          if current != env["HEAD_SHA"]:
              lines += [f"> ⚠️ 審查期間 PR head 已變為 `{current[:7]}`；本審查只對 `{env['HEAD_SHA']}`。", ""]
          if ok:
              lines.append(text[:60000] + ("\n\n…（輸出過長，已截斷）" if len(text) > 60000 else ""))
          elif not started:
              lines.append("### 結論\n審查**沒有執行**：帶金鑰的審查 step 沒有啟動模型迴圈"
                           "（模型啟動前的步驟失敗或被略過，例如工具清單預檢、資料收集或 SDK 安裝），"
                           "所以本次沒有用金鑰呼叫 API。失敗的 step 與原因請看下方 run 連結。")
              lines.append("\n" + status_line)
          elif not parsed:
              lines.append("### 結論\n審查**未完成**：模型迴圈已啟動，但沒有產生可解析的結果，以下沒有可用的審查結果。"
                           "啟動後可能已呼叫 API，**花費未知、可能已產生費用**；實際用量請到 OpenAI 用量頁核對。")
              lines.append("\n" + status_line)
          else:
              if end_reason == "credit_balance_exhausted":
                  lines.append("### 結論\n審查**未完成**：**OpenAI API 點數已用完**（HTTP 429，錯誤碼 credit_balance_exhausted），以下沒有可用的審查結果。")
              else:
                  lines.append("### 結論\n審查**未完成**，以下沒有可用的審查結果。")
              lines.append("\n" + status_line)
              lines.append(f"- is_error：`{res.get('is_error')}`；API 請求數：{res.get('api_calls')}")
              if err:
                  bits = [f"{k} `{err.get(k)}`" for k in ("status", "code", "type", "request_id") if err.get(k) is not None]
                  msg = re.sub(r"@(?=[A-Za-z0-9])", "@\u200b", str(err.get("message") or "")[:300].replace("\n", " "))
                  lines.append("- API 錯誤：" + "；".join(bits) + (f"；訊息：{msg}" if msg else ""))
              if text:
                  lines.append("\n<details><summary>模型在收尾時輸出的部分報告（未完成，不作為審查結論）</summary>\n\n"
                               + text[:30000] + "\n\n</details>")
          lines += [
              "",
              "---",
              "這是**唯讀審查**：審查過程只讀檔與搜尋，**未執行任何測試、build 或 PR 內的程式**；"
              "需要執行才能確認的事項見上方「未驗項」。",
              "為了不提及任何帳號，留言中「@」後接英數字時都插了零寬字元（U+200B），程式碼片段也一樣；"
              "複製程式碼片段（例如 action 版本釘選）前要先移除。",
              f"模型 `{env['REVIEW_MODEL']}`（reasoning effort {env['REVIEW_EFFORT']}；OpenAI Responses API，"
              f"openai Python SDK {env['OPENAI_SDK_VERSION']}，未使用 Codex）／"
              f"輪數 {res.get('num_turns') if res.get('num_turns') is not None else '未知'}／花費 {cost_text}／"
              f"[run]({env['RUN_URL']})／head `{env['HEAD_SHA']}`",
          ]
          print("\n".join(lines))
          sys.exit(0 if ok else 2)
          PY
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::留言內容產生失敗或被安全檢查擋下（rc=$rc），不留言" >&2; exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$RUNNER_TEMP/review-comment.md" --jq .html_url
          exit $rc
