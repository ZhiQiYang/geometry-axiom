name: PR338 B1 original-payload recovery audit

on:
  pull_request:
    paths:
      - .github/workflows/pr338-b1-recovery-audit.yml
      - evidence/pr338-b1-recovery-20261102/**

permissions:
  contents: read
  actions: read

jobs:
  recovery-audit:
    if: github.event.pull_request.number == 338
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /evidence/pr338-b1-recovery-20261102/
            /evidence/geo337-train-20261024/review-unblock-20261029/B1_STATUS.json
            /evidence/geo337-train-20261024/full-R8-five-stage-raw/ORIGINAL_R8_FIVE_STAGE_RAW.tar.gz
            /evidence/geo337-train-20261024/full-R8-five-stage-raw/EXCLUDED_ELF_PAYLOADS.json
            /evidence/geo337-train-20261024/prepared-during-F8/memo-copy-v2/tools/
            /evidence/pr338-b2-closure-20261029/
      - name: Read original archives and all available Actions artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 evidence/pr338-b1-recovery-20261102/recovery_audit.py --out "$RUNNER_TEMP/pr338-b1-recovery"
      - name: Preserve audit, downloaded archives, exact hashes and raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr338-b1-recovery-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr338-b1-recovery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
