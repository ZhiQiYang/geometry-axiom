name: PR448 audit existing original dock archive
on:
  push:
    branches: [codex/r448-dock-only-20261123]
    paths: [.github/workflows/r448-dock-archive-audit.yml]
permissions:
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify existing artifact bytes and its three original browser logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api repos/ZhiQiYang/geometry-axiom/actions/artifacts/14835695826/zip > original.zip
          echo '188b40e521bbee76053f7c0adce8841ec36f2122511235762d00449f050fddb6  original.zip' | sha256sum -c -
          echo '' | base64 -d > audit.py
          echo '86f13d8f27acb9aa3d27643e77429230c22fc09d61ffcb5b0be2695f5917bb1b  audit.py' | sha256sum -c -
          python3 -B audit.py original.zip | tee dock-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-dock-archive-audit
          path: ${{ runner.temp }}/dock-audit.json
          if-no-files-found: error
          retention-days: 14
