name: Geometry integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: geometry-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # R378: retain all measured runs; six native shards, still 35 minutes each.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build and run assigned non-browser suites
        run: |
          ulimit -s 16384
          python3 tests/run_all.py --build --shard '${{ matrix.shard }}/6' --report '${{ runner.temp }}/native-shard-${{ matrix.shard }}/shard-${{ matrix.shard }}.json'
      - name: Preserve original shard receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/native-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original suite logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-logs-${{ matrix.shard }}
          path: /tmp/geometry-tests/run_all-logs/
          if-no-files-found: error
          retention-days: 14

  native-complete:
    name: native complete coverage
    runs-on: ubuntu-latest
    needs: native
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/
      - name: Prove real coverage test kills a removed suite
        run: python3 -B tests/native_sharding_mutation_check.py --output '${{ runner.temp }}/native-sharding-proof'
      - name: Prove archive capability guards with the original mutation judge
        run: python3 geometry-core/card-reference/run_archive_mutations.py --output '${{ runner.temp }}/archive-mutations'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-shard-*
          path: ${{ runner.temp }}/native-shards
          merge-multiple: true
      - name: Verify complete disjoint actual execution
        run: python3 -B tests/native_shard_receipts.py --input '${{ runner.temp }}/native-shards' --parts 6 --output '${{ runner.temp }}/native-complete.json'
      - name: Preserve coverage and mutation proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-complete-coverage
          path: |
            ${{ runner.temp }}/native-sharding-proof/
            ${{ runner.temp }}/native-complete.json
            ${{ runner.temp }}/archive-mutations/
          if-no-files-found: error
          retention-days: 14


  browser:
    name: browser (${{ matrix.suite }}${{ matrix.shard && format(' {0}/2', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # 2026-11-03 canvas比照P-186 native：完整序列依geometry-web/canvas_shards.json拆成兩個連續區段的並行job；
          # 每片仍35分鐘，不放寬時限。兩片排在最前，max-parallel 2下同時開跑。
          - suite: canvas
            shard: 1
            timeout: 35
          - suite: canvas
            shard: 2
            timeout: 35
          - suite: assembly
            timeout: 15
          - suite: documents
            timeout: 10
          - suite: grid
            timeout: 15
          - suite: r14-panel
            timeout: 15
          - suite: space
            timeout: 15
          - suite: timber
            timeout: 20
    env:
      GEOMETRY_TEST_URL: http://127.0.0.1:18839/
      GEOMETRY_FEEDBACK_DIR: /tmp/geometry-integration-feedback
      GEOMETRY_CHROME: /usr/bin/google-chrome
      GEOMETRY_CHROME_FLAGS: --no-sandbox
      GEOMETRY_BROWSER_SUITE: ${{ matrix.suite }}
      GEOMETRY_CANVAS_SHARD: ${{ matrix.shard }}
      PYTHONDONTWRITEBYTECODE: '1'
      GEOMETRY_GRID_SYSTEM_SCREENSHOT_DIR: /tmp/geometry-grid-screens
      GEOMETRY_R14_SCREENSHOT_DIR: /tmp/geometry-r14-screens
      GEOMETRY_DOCUMENT_SCREENSHOT_DIR: /tmp/geometry-document-screens
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: matrix.suite != 'documents'
        with:
          persist-credentials: false
      - name: Checkout document job primary sources
        if: matrix.suite == 'documents'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/
      - name: Build current native executables
        run: npm run build
      - name: Restore cached CJK font package
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/cjk-font-debs
          key: fonts-noto-cjk-noble-1:20230817+repack1-3
      - name: Install Chinese fonts for visual verification
        timeout-minutes: 8
        # Cache hit: install the saved .deb without contacting the mirror.
        # Cache miss: keep the existing apt download, then store fonts-noto-cjk*.deb.
        # CJK remains mandatory; do not raise job timeouts.
        run: |
          set -euo pipefail
          cache_dir="${{ runner.temp }}/cjk-font-debs"
          mkdir -p "$cache_dir"
          shopt -s nullglob
          debs=("$cache_dir"/fonts-noto-cjk*.deb)
          echo "CJK_CACHE_DIR=$cache_dir"
          echo "CJK_DEB_COUNT=${#debs[@]}"
          if [ "${#debs[@]}" -gt 0 ]; then
            ls -la "${debs[@]}"
            for deb in "${debs[@]}"; do
              echo "CJK_DEB=$(basename "$deb") bytes=$(wc -c <"$deb")"
            done
            echo "CJK_INSTALL_BRANCH=cached-deb"
            # Install only the local archives; dependency/configuration errors must fail.
            # Keep the mirror guard, without an apt repair/fallback on a cache hit.
            log="$(mktemp)"
            sudo dpkg -i "${debs[@]}" 2>&1 | tee "$log"
            if grep -E "https?://azure\.archive\.ubuntu\.com|Need to get .* of archives" "$log"; then
              echo "CJK_CACHE_HIT_STILL_MIRRORED=1" >&2
              echo "cache-hit path contacted apt mirror; see log above" >&2
              exit 1
            fi
            echo "CJK_CACHE_HIT_STILL_MIRRORED=0"
          else
            echo "CJK_INSTALL_BRANCH=apt-miss"
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-noto-cjk
            cp /var/cache/apt/archives/fonts-noto-cjk*.deb "$cache_dir/"
            ls -la "$cache_dir"/fonts-noto-cjk*.deb || true
          fi
          dpkg -s fonts-noto-cjk
          # Collect stdout before grep -q so a closed pipe cannot mimic missing fonts.
          cjk_fonts="$(fc-list :lang=zh)"
          if ! grep -q . <<< "$cjk_fonts"; then
            echo "fc-list :lang=zh found no fonts" >&2
            exit 1
          fi
      - name: Run actual browser regression group
        shell: bash
        run: |
          ulimit -s 16384
          test -x "$GEOMETRY_CHROME"
          # WSL canvas wait trace
          # Clear inherited flags for all other jobs.
          unset GEOMETRY_WAIT_TRACE
          unset GEOMETRY_WAIT_TRACE_RUN_ID
          case "$GEOMETRY_BROWSER_SUITE:$(uname -r)" in
            canvas:*[Mm]icrosoft*) export GEOMETRY_WAIT_TRACE=1 ;;
          esac
          if [ "${GEOMETRY_WAIT_TRACE-}" = 1 ]; then
            export GEOMETRY_WAIT_TRACE_RUN_ID="$(python3 geometry-web/prepare_wait_trace.py)"
          fi
          if [ -n "${GITHUB_ENV-}" ]; then
            printf 'GEOMETRY_WAIT_TRACE=%s\n' "${GEOMETRY_WAIT_TRACE-}" >> "$GITHUB_ENV"
          fi
          python3 -u geometry-web/start_local.py --port 18839 > /tmp/geometry-integration-server.log 2>&1 &
          server=$!
          cleanup() {
            original_status=$?
            set +e
            kill "$server" 2>/dev/null || true
            wait "$server" 2>/dev/null || true
            if [ "$GEOMETRY_BROWSER_SUITE" = canvas ]; then
              python3 geometry-web/archive_wait_trace.py /tmp/geometry-wait-trace-artifact
              archive_status=$?
              if [ "$original_status" -eq 0 ] && [ "$archive_status" -ne 0 ]; then original_status=$archive_status; fi
            fi
            exit "$original_status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/geometry-integration-server.log
              exit 1
            fi
            if python3 geometry-web/runtime_version.py --probe 18839 > /dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 geometry-web/runtime_version.py --probe 18839
          # Independent matrix jobs expose each result promptly. They use
          # separate runners/servers and do not cancel siblings on failure.
          # Each canvas shard runs one contiguous block of the full sequence,
          # compares its own sections strictly with golden, and keeps its raw
          # output, real exit status and source-bound assertion journal for
          # the complete-coverage job.
          set +e
          case "$GEOMETRY_BROWSER_SUITE" in
            assembly) GEOMETRY_CDP_PORT=9367 GEOMETRY_ASSEMBLY_ONLY=1 node geometry-web/cdp_test.js ;;
            grid) GEOMETRY_CDP_PORT=9334 GEOMETRY_GRID_SYSTEM_ONLY=1 node geometry-web/cdp_test.js ;;
            r14-panel)
              receipt="$RUNNER_TEMP/r14-panel"
              mkdir -p "$receipt"
              GEOMETRY_CDP_PORT=9352 GEOMETRY_R14_PANEL_ONLY=1 node geometry-web/cdp_test.js 2>&1 | tee "$receipt/cdp.log"
              browser_status=${PIPESTATUS[0]}
              python3 -B .github/scripts/check_r14_browser_receipt.py --log "$receipt/cdp.log" --exit-code "$browser_status" --commit "$(git rev-parse HEAD)" --out "$receipt/verified.json" ;;
            canvas)
              receipt="$RUNNER_TEMP/canvas-shard-$GEOMETRY_CANVAS_SHARD"
              # Every fresh shard prepares the screenshot parent before its harness starts.
              node -e 'require("node:fs").mkdirSync(require("node:path").join(require("node:os").tmpdir(),"geometry-tests"),{recursive:true})' &&
                EXPECTED_EXECUTION_SHA='${{ github.sha }}' PR_HEAD_SHA='${{ github.event.pull_request.head.sha || github.sha }}' python3 -B .github/scripts/canvas_evidence.py run --shard "$GEOMETRY_CANVAS_SHARD/2" --out "$receipt"
              ;;
            space) GEOMETRY_CDP_PORT=9347 node geometry-web/space_model_test.js ;;
            timber) GEOMETRY_CDP_PORT=9348 GEOMETRY_TIMBER_ONLY=1 node geometry-web/space_model_test.js ;;
            documents) GEOMETRY_CDP_PORT=9366 node geometry-web/documents_browser_test.js ;;
            *) echo "Unknown browser suite"; exit 2 ;;
          esac
          status=$?
          cat /tmp/geometry-integration-server.log
          exit "$status"
      - name: Preserve canvas shard raw and source receipts
        if: always() && matrix.suite == 'canvas'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canvas-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/canvas-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve canvas wait trace
        if: always() && matrix.suite == 'canvas'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canvas-wait-trace-${{ matrix.shard }}
          path: /tmp/geometry-wait-trace-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve R14 browser receipt and screenshots
        if: always() && matrix.suite == 'r14-panel'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r14-panel-browser
          path: |
            ${{ runner.temp }}/r14-panel/
            /tmp/geometry-r14-screens/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve assembly authoring screenshots
        if: always() && matrix.suite == 'assembly'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assembly-review-screens
          path: /tmp/geometry-tests/assembly-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve grid trial screenshots
        if: always() && (matrix.suite == 'grid' || matrix.suite == 'canvas')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grid-trial-screens-${{ matrix.suite }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: /tmp/geometry-grid-screens/grid-trial-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve document reader screenshots
        if: always() && matrix.suite == 'documents'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-reader-screens
          path: /tmp/geometry-document-screens/*.png
          if-no-files-found: ignore
          retention-days: 7

  browser-canvas-complete:
    name: browser (canvas) complete coverage
    runs-on: ubuntu-latest
    needs: browser
    if: always()
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove the verifier rejects missing, extra, duplicated, incomplete and drifted shards
        run: node --test --test-reporter=spec tests/test_canvas_shards.js
      - name: Require every original browser group and canvas shard to succeed
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: canvas-shard-*
          path: ${{ runner.temp }}/canvas-shards
      - name: Verify source-bound raw journals and complete disjoint canvas sections against golden
        env:
          EXPECTED_EXECUTION_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B .github/scripts/canvas_evidence.py verify --artifacts "$RUNNER_TEMP/canvas-shards" --out "$RUNNER_TEMP/canvas-complete"
      - name: Preserve canvas coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canvas-complete-coverage
          path: ${{ runner.temp }}/canvas-complete/
          if-no-files-found: error
          retention-days: 14
