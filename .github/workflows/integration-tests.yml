name: Geometry integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geometry-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and run non-browser suites
        run: |
          ulimit -s 16384
          npm run build
          # The Windows GDI harness is unavailable on Linux; the runner reports it.
          python3 tests/run_all.py --build
          node tests/test_document_format.js

  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: documents
            timeout: 10
          - suite: grid
            timeout: 15
          - suite: canvas
            timeout: 35
          - suite: space
            timeout: 15
          - suite: timber
            timeout: 20
    env:
      GEOMETRY_TEST_URL: http://127.0.0.1:18839/
      GEOMETRY_FEEDBACK_DIR: /tmp/geometry-integration-feedback
      GEOMETRY_CHROME: /usr/bin/google-chrome
      GEOMETRY_CHROME_FLAGS: --no-sandbox
      GEOMETRY_BROWSER_SUITE: ${{ matrix.suite }}
      GEOMETRY_GRID_SYSTEM_SCREENSHOT_DIR: /tmp/geometry-grid-screens
      GEOMETRY_DOCUMENT_SCREENSHOT_DIR: /tmp/geometry-document-screens
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build current native executables
        run: npm run build
      - name: Install Chinese fonts for visual verification
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run actual browser regression group
        shell: bash
        run: |
          ulimit -s 16384
          test -x "$GEOMETRY_CHROME"
          export GEOMETRY_BRIDGE="$PWD/.build/web_bridge"
          export GEOMETRY_MODEL_BASE="$PWD/.build/model_base"
          python3 -u geometry-web/serve.py 18839 > /tmp/geometry-integration-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$GEOMETRY_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$GEOMETRY_TEST_URL" > /dev/null
          # Independent matrix jobs expose each result promptly. They use
          # separate runners/servers and do not cancel siblings on failure.
          # The full canvas run retains its strict golden comparison.
          set +e
          case "$GEOMETRY_BROWSER_SUITE" in
            grid) GEOMETRY_CDP_PORT=9334 GEOMETRY_GRID_SYSTEM_ONLY=1 node geometry-web/cdp_test.js ;;
            canvas) node geometry-web/cdp_test.js ;;
            space) GEOMETRY_CDP_PORT=9347 node geometry-web/space_model_test.js ;;
            timber) GEOMETRY_CDP_PORT=9348 GEOMETRY_TIMBER_ONLY=1 node geometry-web/space_model_test.js ;;
            documents) GEOMETRY_CDP_PORT=9366 node geometry-web/documents_browser_test.js ;;
            *) echo "Unknown browser suite"; exit 2 ;;
          esac
          status=$?
          cat /tmp/geometry-integration-server.log
          exit "$status"
      - name: Preserve grid trial screenshots
        if: always() && (matrix.suite == 'grid' || matrix.suite == 'canvas')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grid-trial-screens-${{ matrix.suite }}
          path: /tmp/geometry-grid-screens/grid-trial-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve document reader screenshots
        if: always() && matrix.suite == 'documents'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-reader-screens
          path: /tmp/geometry-document-screens/*.png
          if-no-files-found: ignore
          retention-days: 7
