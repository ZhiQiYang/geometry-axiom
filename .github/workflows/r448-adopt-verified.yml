name: PR448 verified cost and architecture bundle
on:
  push:
    branches: [codex/r448-verify-artifacts-20261123]
    paths: [.github/workflows/r448-adopt-verified.yml]
permissions:
  actions: read
  contents: read
jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '24edcb5801b5969095379381aadba0ac6153de39'
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify three immutable originals, freshness, and imported Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
          LANG: C.UTF-8
        run: |
          set -euo pipefail
          ulimit -s 16384
          test "$(git rev-parse HEAD)" = '24edcb5801b5969095379381aadba0ac6153de39'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          script="$RUNNER_TEMP/verify_adopt.py"
          echo '' | base64 -d > "$script"
          echo '43862d9612e868f1a89799db7791e485e86f70236df553a423f40f232e85060a  '"$script" | sha256sum -c -
          python3 -B "$script" '24edcb5801b5969095379381aadba0ac6153de39' '45203086230' '45203086552' "$RUNNER_TEMP/r448-verified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r448-verified-artifacts-24edcb5801b5969095379381aadba0ac6153de39
          path: |
            ${{ runner.temp }}/r448-verified/adopted.json
            ${{ runner.temp }}/r448-verified/evidence-only.bundle
          if-no-files-found: error
          retention-days: 7

