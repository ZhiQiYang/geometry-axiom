name: R448 P1162 derived witness
on:
  push:
    branches: [codex/r448-p1162-derived-witness-20261125]
permissions:
  contents: read
  actions: read
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET: '5d336bd65841bf249b39c61be83921ff715d0920'
      COST_ARTIFACT: '14986010926'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '5d336bd65841bf249b39c61be83921ff715d0920'
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: import from immutable input
        shell: python
        run: |
          import hashlib, json, os, subprocess, shutil
          from pathlib import Path
          
          out = Path(os.environ["RUNNER_TEMP"]) / "r448-result"
          out.mkdir()
          row_path = Path("geometry-web/cdp_sections.d/P1162.json")
          artifact_id = os.environ["COST_ARTIFACT"]
          receipt_dir = Path("geometry-web/canvas-registry/costs/P1162") / artifact_id
          assert artifact_id.isdigit() and not receipt_dir.exists()
          def git(*args):
              return subprocess.check_output(("git", *args))
          assert git("rev-parse","HEAD").decode().strip() == os.environ["TARGET"]
          staged = json.loads(row_path.read_bytes())
          assert staged["assertions"] == 0 and staged["cost"] is None and staged["provenance"] == {"kind":"candidate"}
          metadata = json.loads(subprocess.check_output(["gh","api","repos/ZhiQiYang/geometry-axiom/actions/artifacts/"+artifact_id]))
          assert metadata["workflow_run"]["head_sha"] == os.environ["TARGET"]
          archive = out.parent / "P1162-official.zip"
          with archive.open("wb") as stream:
              subprocess.run(["gh","api","repos/ZhiQiYang/geometry-axiom/actions/artifacts/"+artifact_id+"/zip"], stdout=stream,check=True)
          assert archive.stat().st_size == metadata["size_in_bytes"] and "sha256:"+hashlib.sha256(archive.read_bytes()).hexdigest() == metadata["digest"]
          import zipfile
          with zipfile.ZipFile(archive) as bundle:
              logs = [p for p in bundle.namelist() if p.rsplit("/",1)[-1]=="stdout.log"]
              assert len(logs) == 1
              stdout = bundle.read(logs[0]).decode().splitlines()
              checkpoints = [json.loads(line.split(" ",1)[1]) for line in stdout if line.startswith("P1162_CASE_RESULT ")]
              aggregate = [json.loads(line.split(" ",1)[1]) for line in stdout if line.startswith("P1162_RESULT ")]
              assert len(aggregate)==1 and aggregate[0]["completed"] and not aggregate[0]["failed"], aggregate
              expected = aggregate[0]["expectedCases"]
              assert len(checkpoints)==len(set(expected))==len(expected)==16
              assert [r["id"] for r in checkpoints] == expected == aggregate[0]["passed"]
              assert all(r["status"]=="pass" and r["assertions"]["failed"]==0 for r in checkpoints)
              print(json.dumps({"cases":[[r["id"],r["assertions"]["passed"]] for r in checkpoints],"total":len(checkpoints)},sort_keys=True))
          subprocess.run(["node","geometry-web/canvas_registry.js","import-cost","--id","P1162","--artifact-id",artifact_id,"--artifact",str(archive)], check=True)
          current = json.loads(row_path.read_bytes())
          old = json.loads(git("show", "5825e69f1e04a37248ad9944d14360c6e9e80ecd:"+row_path.as_posix()))
          assert current["assertions"] == old["assertions"] == 504, current
          assert current["provenance"]["headSha"] == os.environ["TARGET"] and current["provenance"]["executionSha"] == os.environ["TARGET"]
          assert current["provenance"]["runId"] == str(metadata["workflow_run"]["id"])
          assert {k:v for k,v in current.items() if k not in {"cost","provenance"}} == {k:v for k,v in old.items() if k not in {"cost","provenance"}}
          golden = subprocess.check_output(["node","geometry-web/canvas_registry.js","golden"])
          assert hashlib.sha256(golden).hexdigest() == "86defdd03d1ec8ce94b8d24c2da7086094b72e81c61098ec79bdd5481c7f19e3", hashlib.sha256(golden).hexdigest()
          gate = json.loads(subprocess.check_output(["node","geometry-web/canvas_registry.js","check"]))
          assert gate["declarations_complete"] and gate["data_contract_verified"] and gate["goldenSha256"]=="86defdd03d1ec8ce94b8d24c2da7086094b72e81c61098ec79bdd5481c7f19e3"
          print(json.dumps({"coverage":gate,"P1162":current,"artifact":metadata["digest"]},sort_keys=True))
          assert git("diff", "--name-only").decode().splitlines() == [row_path.as_posix()]
          for path in (row_path, receipt_dir / "receipt.json", receipt_dir / "artifact.zip"):
              (out / path).parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(path, out / path)
      - name: Save generated bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r448-p1162-import
          path: ${{ runner.temp }}/r448-result/
          if-no-files-found: error
          retention-days: 14
