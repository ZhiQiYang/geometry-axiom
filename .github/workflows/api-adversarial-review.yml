name: API adversarial review

# 用 repo secret ANTHROPIC_API_KEY 的 API 額度，對指定 PR 做唯讀的「獨立對抗審查」，結果留言在該 PR。
# 安全設計與限制見 .github/prompts/adversarial-review.md 與建立本檔的 PR 說明。
#
# 只能手動觸發（擁有者本人）：
#   gh workflow run api-adversarial-review.yml --repo ZhiQiYang/geometry-axiom --ref main -f pr_number=<號>

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 要審查的 PR 號（head 必須在本 repo，base 必須是 main）
        required: true
        type: string
      max_budget_usd:
        description: 本次審查的 API 花費上限（美元，上限 30）
        required: false
        default: "10"
        type: string

# workflow 層級不給任何權限；只在 job 上給最小權限。
permissions: {}

concurrency:
  group: api-adversarial-review-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Adversarial review of PR #${{ inputs.pr_number }}
    # 只准 repo 擁有者本人、從 main 上的這份 workflow 觸發。
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
    env:
      CLAUDE_CODE_VERSION: "2.1.330"
      # npm registry 上 @anthropic-ai/claude-code-linux-x64@2.1.330 的 dist.integrity（sha512）。
      CLAUDE_CODE_TARBALL_SHA512: "9Gn+V7DtJ8M1nztP9CeDVl9g3RtrepI7rOFTyPRRnZe8D6zebIHKmC7OvBauucuAP0X0k85SDN/LPVZyjsGezQ=="
      REVIEW_MODEL: claude-opus-5-5
      REVIEW_EFFORT: high
      REVIEW_MAX_TURNS: "120"
      # 審查與預檢共用的 CLI 旗標（單一來源，避免兩處漂移）。不用 --bare：在 2.1.330 它會把工具縮成只剩 Read。
      # --restricted 已忽略 user／project／local 設定（含 hooks）並把檔案工具限在工作目錄內。
      REVIEW_CLI_FLAGS: >-
        --restricted --strict-mcp-config --disable-slash-commands --no-session-persistence
        --tools Read,Grep,Glob --allowedTools Read,Grep,Glob --permission-mode dontAsk
    steps:
      - name: Validate inputs and resolve PR (fork heads are rejected)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::pr_number 必須是正整數" >&2; exit 1
          fi
          if ! [[ "$MAX_BUDGET_USD" =~ ^[0-9]{1,2}(\.[0-9]{1,2})?$ ]] \
             || ! python3 -c 'import sys; v=float(sys.argv[1]); sys.exit(0 if 0 < v <= 30 else 1)' "$MAX_BUDGET_USD"; then
            echo "::error::max_budget_usd 必須是 0 到 30 之間的數字" >&2; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-meta.json"
          python3 - "$RUNNER_TEMP/pr-meta.json" <<'PY'
          import json, os, re, sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name") or ""
          if head_repo.lower() != repo:
              sys.exit(f"::error::PR head 來自 {head_repo or '已刪除的 repo'}，不是本 repo；拒絕審查 fork PR")
          if (pr.get("base") or {}).get("ref") != "main":
              sys.exit("::error::只審 base 為 main 的 PR")
          head_sha = pr["head"]["sha"]
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              sys.exit("::error::head SHA 格式不符")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"head_sha={head_sha}\n")
              out.write(f"short_sha={head_sha[:7]}\n")
          print(f"PR #{pr['number']} head {head_sha} (state={pr['state']})")
          PY
          echo "max_budget_usd=$MAX_BUDGET_USD" >> "$GITHUB_OUTPUT"

      - name: Check out trusted main (prompt and reference tree)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Check out PR head as data (never executed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Collect read-only git and GitHub data (no API key in this step)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          data="$GITHUB_WORKSPACE/review-data"
          mkdir -p "$data/commits"
          # 符號連結可能指向工作區外（例如 /proc/self/environ），一律換成純文字佔位檔，只留目標字串當資料。
          : > "$data/symlinks.txt"
          while IFS= read -r -d '' link; do
            target=$(readlink -- "$link")
            printf '%s -> %s\n' "${link#"$GITHUB_WORKSPACE"/}" "$target" >> "$data/symlinks.txt"
            rm -f -- "$link"
            printf '[symlink placeholder] target: %s\n' "$target" > "$link"
          done < <(find "$GITHUB_WORKSPACE/pr" "$GITHUB_WORKSPACE/main" -type l -print0)

          G=(git -C "$GITHUB_WORKSPACE/pr" -c core.hooksPath=/dev/null -c diff.external= -c core.pager=cat)
          test "$("${G[@]}" rev-parse HEAD)" = "$HEAD_SHA"
          base="$("${G[@]}" rev-parse origin/main)"
          mb="$("${G[@]}" merge-base origin/main HEAD)"
          printf 'main=%s\nmerge_base=%s\nhead=%s\nworkflow_main=%s\n' "$base" "$mb" "$HEAD_SHA" "$GITHUB_SHA" > "$data/refs.txt"
          "${G[@]}" diff --no-ext-diff --no-textconv origin/main...HEAD > "$data/diff.patch"
          "${G[@]}" diff --no-ext-diff --no-textconv --stat=200 origin/main...HEAD > "$data/diff-stat.txt"
          "${G[@]}" diff --no-ext-diff --no-textconv --name-status origin/main...HEAD > "$data/diff-name-status.txt"
          "${G[@]}" log --no-color --format='commit %H%nAuthor: %an%nDate:   %aI%n%n%B' origin/main..HEAD > "$data/log.txt"
          for c in $("${G[@]}" rev-list origin/main..HEAD); do
            "${G[@]}" show --no-ext-diff --no-textconv --no-color --stat --patch "$c" > "$data/commits/$c.txt"
          done

          api() { gh api --paginate "$1" --jq '.[]' | jq -s "$2"; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq '{number, title, state, draft, user: .user.login, body, base: .base.ref, head: .head.ref, head_sha: .head.sha, labels: [.labels[].name], created_at, updated_at, html_url}' > "$data/pr.json.tmp"
          api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" '[.[] | {sha, author: .commit.author.name, date: .commit.author.date, message: .commit.message}]' > "$data/commits.json"
          jq --slurpfile commits "$data/commits.json" '. + {commits: $commits[0]}' "$data/pr.json.tmp" > "$data/pr.json"
          rm -f "$data/pr.json.tmp" "$data/commits.json"
          api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" '[.[] | {user: .user.login, created_at, updated_at, body, html_url}] | sort_by(.created_at)' > "$data/issue-comments.json"
          api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" '[.[] | {user: .user.login, state, submitted_at, commit_id, body, html_url}]' > "$data/reviews.json"
          api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments?per_page=100" '[.[] | {user: .user.login, created_at, path, line, original_line, commit_id, in_reply_to_id, body, html_url}] | sort_by(.created_at)' > "$data/review-comments.json"
          wc -c "$data"/*.patch "$data"/*.json "$data"/*.txt

      - name: Install pinned Claude Code CLI (checksum-verified, no API key in this step)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/claude-cli"
          mkdir -p "$dir"
          url="https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
          curl -fsSL --retry 3 -o "$dir/cli.tgz" "$url"
          actual="$(openssl dgst -sha512 -binary "$dir/cli.tgz" | base64 -w0)"
          if [ "$actual" != "$CLAUDE_CODE_TARBALL_SHA512" ]; then
            echo "::error::Claude Code tarball sha512 不符" >&2; exit 1
          fi
          tar -xzf "$dir/cli.tgz" -C "$dir"
          "$dir/package/claude" --version

      - name: Build prompt from trusted main copy
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          {
            cat "$GITHUB_WORKSPACE/main/.github/prompts/adversarial-review.md"
            printf '\n## 本次執行參數（由 workflow 產生）\n\n'
            printf -- '- 受審 PR：#%s\n' "$PR_NUMBER"
            printf -- '- head SHA：%s\n' "$HEAD_SHA"
            printf -- '- 工作目錄：%s\n' "$GITHUB_WORKSPACE"
            printf -- '- PR 目錄（head 檔案樹，受審資料）：%s/pr\n' "$GITHUB_WORKSPACE"
            printf -- '- main 目錄（可信版本）：%s/main\n' "$GITHUB_WORKSPACE"
            printf -- '- 資料目錄：%s/review-data（refs.txt 記錄 main、merge-base、head 的完整 SHA）\n' "$GITHUB_WORKSPACE"
          } > "$RUNNER_TEMP/review-prompt.md"

      - name: Preflight the tool list without the API key
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/claude-preflight-home"
          mkdir -p "$home"
          cd "$GITHUB_WORKSPACE"
          out="$RUNNER_TEMP/preflight.jsonl"
          # 用假金鑰指向關閉的本機埠：不連外、不花錢，只取 CLI 啟動時的 init 訊息（實際生效的工具清單）。
          # shellcheck disable=SC2086
          echo preflight | HOME="$home" ANTHROPIC_API_KEY=preflight-not-a-key ANTHROPIC_BASE_URL=http://127.0.0.1:9 \
            DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            CLAUDE_CODE_DISABLE_CLAUDE_MDS=1 CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 \
            "$RUNNER_TEMP/claude-cli/package/claude" -p $REVIEW_CLI_FLAGS \
            --model "$REVIEW_MODEL" --max-turns 1 --output-format stream-json --verbose > "$out" 2>/dev/null &
          pid=$!
          for _ in $(seq 1 120); do
            grep -q '"subtype":"init"' "$out" && break
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          init="$(grep -m1 '"subtype":"init"' "$out" || true)"
          echo "$init" | jq -c '{tools, mcp_servers, permissionMode, slash_commands}'
          echo "$init" | jq -e '(.tools | sort) == ["Glob","Grep","Read"] and (.mcp_servers | length) == 0 and .permissionMode == "dontAsk"' > /dev/null \
            || { echo "::error::CLI 實際工具清單不是 Glob/Grep/Read（或有 MCP／權限模式不符），中止" >&2; exit 1; }

      - name: Run read-only review (the only step that receives the API key)
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_BUDGET_USD: ${{ steps.pr.outputs.max_budget_usd }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/claude-home"
          mkdir -p "$home"
          cd "$GITHUB_WORKSPACE"
          # 子行程環境只留金鑰與必要變數；不帶任何 GitHub token。
          unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          status=0
          # shellcheck disable=SC2086
          HOME="$home" DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
          CLAUDE_CODE_DISABLE_CLAUDE_MDS=1 CLAUDE_CODE_DISABLE_AUTO_MEMORY=1 \
          "$RUNNER_TEMP/claude-cli/package/claude" -p $REVIEW_CLI_FLAGS \
            --model "$REVIEW_MODEL" --effort "$REVIEW_EFFORT" \
            --max-turns "$REVIEW_MAX_TURNS" --max-budget-usd "$MAX_BUDGET_USD" \
            --output-format json \
            < "$RUNNER_TEMP/review-prompt.md" > "$RUNNER_TEMP/review-result.json" || status=$?
          echo "claude exit status: $status"
          jq '{is_error, subtype, terminal_reason, num_turns, total_cost_usd, permission_denials: (.permission_denials | length)}' \
            "$RUNNER_TEMP/review-result.json" || true

      - name: Post the review as one PR comment (no API key in this step)
        if: always() && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          rc=0
          python3 - "$RUNNER_TEMP/review-result.json" "$current" > "$RUNNER_TEMP/review-comment.md" <<'PY' || rc=$?
          import json, os, re, sys
          path, current = sys.argv[1], sys.argv[2]
          env = os.environ
          try:
              res = json.load(open(path, encoding="utf-8"))
          except Exception:
              res = {}
          text = (res.get("result") or "").strip() if isinstance(res.get("result"), str) else ""
          ok = bool(text) and res.get("is_error") is False
          # 看起來像憑證的字串一律拒貼。
          if re.search(r"sk-ant-[A-Za-z0-9_-]{8,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}", text):
              print("::error::審查輸出含疑似憑證字串，拒絕貼出", file=sys.stderr)
              sys.exit(3)
          # 不讓模型輸出 @ 到任何人。
          text = re.sub(r"(?<![\w`])@(?=[A-Za-z0-9])", "@​", text)
          lines = [f"【API 對抗審查】PR #{env['PR_NUMBER']} head {env['SHORT_SHA']}", ""]
          if current != env["HEAD_SHA"]:
              lines += [f"> ⚠️ 審查期間 PR head 已變為 `{current[:7]}`；本審查只對 `{env['HEAD_SHA']}`。", ""]
          if ok:
              lines.append(text[:60000] + ("\n\n…（輸出過長，已截斷）" if len(text) > 60000 else ""))
          else:
              lines.append("### 結論\n審查**未完成**，以下沒有可用的審查結果。")
              lines.append(f"\n- subtype：`{res.get('subtype')}`；terminal_reason：`{res.get('terminal_reason')}`；is_error：`{res.get('is_error')}`")
          cost = res.get("total_cost_usd")
          lines += [
              "",
              "---",
              "這是**唯讀審查**：審查過程只讀檔與搜尋，**未執行任何測試、build 或 PR 內的程式**；"
              "需要執行才能確認的事項見上方「未驗項」。",
              f"模型 `{env['REVIEW_MODEL']}`（effort {env['REVIEW_EFFORT']}）／Claude Code {env['CLAUDE_CODE_VERSION']}／"
              f"輪數 {res.get('num_turns') if res.get('num_turns') is not None else '未知'}／花費 US${cost if cost is not None else '未知'}／"
              f"[run]({env['RUN_URL']})／head `{env['HEAD_SHA']}`",
          ]
          print("\n".join(lines))
          sys.exit(0 if ok else 2)
          PY
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::留言內容產生失敗或被安全檢查擋下（rc=$rc），不留言" >&2; exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$RUNNER_TEMP/review-comment.md" --jq .html_url
          exit $rc
