name: PR338 exact R8 ELF reproduction

on:
  push:
    branches: [codex/pr338-r8-repro-20261102]

permissions:
  contents: read
  actions: read

jobs:
  reproduce-original-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.preserve.outputs.artifact-id }}
      artifact-digest: ${{ steps.preserve.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /evidence/pr338-b1-repro-20261102/
            /evidence/geo337-train-20261024/review-unblock-20261029/B1_STATUS.json
            /evidence/geo337-train-20261024/full-R8-five-stage-raw/ORIGINAL_R8_FIVE_STAGE_RAW.tar.gz
      - name: Rebuild the three roles with recorded paths and Debian compiler
        run: |
          mkdir -p "$RUNNER_TEMP/pr338-r8-repro"
          docker pull debian:trixie > "$RUNNER_TEMP/pr338-r8-repro/docker-pull.stdout.txt" 2> "$RUNNER_TEMP/pr338-r8-repro/docker-pull.stderr.txt"
          docker image inspect debian:trixie > "$RUNNER_TEMP/pr338-r8-repro/docker-image.json"
          set +e
          docker run --rm --env GITHUB_ACTIONS --env GITHUB_SHA --env GITHUB_RUN_ID \
            --volume "$GITHUB_WORKSPACE:/input:ro" \
            --volume "$RUNNER_TEMP/pr338-r8-repro:/evidence" \
            debian:trixie /bin/bash /input/evidence/pr338-b1-repro-20261102/container_entry.sh
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/pr338-r8-repro/container-process-exit.txt"
          exit "$result"
      - name: Preserve original receipts, source and toolchain hashes, ELF tar and raw streams
        id: preserve
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr338-r8-repro-${{ github.sha }}
          path: ${{ runner.temp }}/pr338-r8-repro/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  whole-memo-formal:
    needs: reproduce-original-bytes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /evidence/pr338-b1-repro-20261102/
            /evidence/geo323-provider-hint-1449d430/TOOLS/capture.py
            /evidence/geo337-train-20261024/current-R5-status/recorder-v5-originals/original-v4/
            /evidence/geo337-train-20261024/prepared-during-F8/memo-copy-v2/tools/
            /evidence/geo337-train-20261024/full-R8-five-stage-raw/ORIGINAL_R8_FIVE_STAGE_RAW.tar.gz
            /evidence/geo337-train-20261024/review-unblock-20261029/B1_STATUS.json
      - name: Download the exact-byte predecessor artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr338-whole-memo"
          gh api repos/ZhiQiYang/geometry-axiom/actions/artifacts/${{ needs.reproduce-original-bytes.outputs.artifact-id }}/zip > "$RUNNER_TEMP/pr338-whole-memo/repro-input.zip"
      - name: Execute unchanged original whole-memo driver at clean F8
        env:
          REPRO_ZIP_SHA: ${{ needs.reproduce-original-bytes.outputs.artifact-digest }}
        run: |
          docker pull debian:trixie > "$RUNNER_TEMP/pr338-whole-memo/docker-pull.stdout.txt" 2> "$RUNNER_TEMP/pr338-whole-memo/docker-pull.stderr.txt"
          docker image inspect debian:trixie > "$RUNNER_TEMP/pr338-whole-memo/docker-image.json"
          set +e
          docker run --rm --env GITHUB_ACTIONS --env GITHUB_SHA --env GITHUB_RUN_ID --env REPRO_ZIP_SHA \
            --volume "$GITHUB_WORKSPACE:/input:ro" \
            --volume "$RUNNER_TEMP/pr338-whole-memo:/evidence" \
            debian:trixie /bin/bash /input/evidence/pr338-b1-repro-20261102/formal_entry.sh
          result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/pr338-whole-memo/container-process-exit.txt"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/pr338-whole-memo"
          exit "$result"
      - name: Preserve formal phases, exact ELF payloads, source closure and raw streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr338-whole-memo-${{ github.sha }}
          path: ${{ runner.temp }}/pr338-whole-memo/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
