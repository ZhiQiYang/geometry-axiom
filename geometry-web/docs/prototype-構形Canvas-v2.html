  function normalizeState(candidate) {
    const normalized = candidate && typeof candidate === 'object' ? candidate : {};
    normalized.version = APP_VERSION;
    normalized.project = normalized.project || { name: '未命名專案', createdAt: nowIso(), updatedAt: nowIso() };
    normalized.objects = Array.isArray(normalized.objects) ? normalized.objects : [];
    normalized.objects.forEach((object) => {
      if (object?.type === 'face') ensureFaceData(object);
      if (object?.type === 'space') {
        object.data = object.data && typeof object.data === 'object' ? object.data : {};
        object.data.width = Math.max(1, safeNumber(object.data.width, 600));
        object.data.depth = Math.max(1, safeNumber(object.data.depth, 450));
        object.data.height = Math.max(1, safeNumber(object.data.height, 280));
        object.data.coordinateSystem = object.data.coordinateSystem || object.name || 'WORLD';
        object.data.boundaryFaceIds = Array.isArray(object.data.boundaryFaceIds) ? object.data.boundaryFaceIds : [];
      }
    });
    normalized.nodes = Array.isArray(normalized.nodes) ? normalized.nodes : [];
    normalized.relations = Array.isArray(normalized.relations) ? normalized.relations : [];
    normalized.camera = {
      x: safeNumber(normalized.camera?.x, 240),
      y: safeNumber(normalized.camera?.y, 160),
      scale: clamp(safeNumber(normalized.camera?.scale, 1), 0.15, 2.5)
    };
    normalized.preferences = {
      snap: normalized.preferences?.snap !== false,
      gridSize: clamp(safeNumber(normalized.preferences?.gridSize, 20), 5, 200),
      showGrid: normalized.preferences?.showGrid !== false
    };
    normalized.nodes = normalized.nodes
      .filter((node) => normalized.objects.some((object) => object.id === node.objectId))
      .map((node) => {
        const mode = node.mode === 'compact' ? 'compact' : 'preview';
        const size = NODE_SIZE[mode];
        return {
          ...node,
          x: safeNumber(node.x),
          y: safeNumber(node.y),
          mode,
          w: safeNumber(node.w, size.w),
          h: safeNumber(node.h, size.h)
        };
      });
    normalized.relations = normalized.relations.filter((relation) =>
      normalized.objects.some((object) => object.id === relation.sourceObjectId) &&
      normalized.objects.some((object) => object.id === relation.targetObjectId)
    );
    return normalized;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
      if (!raw) return null;
      const loaded = normalizeState(JSON.parse(raw));
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(loaded)); } catch {}
      return loaded;
    } catch (error) {
      console.warn('Unable to load saved project:', error);
      return null;
    }
  }

  function hasStoredState() {
    try {
      return Boolean(localStorage.getItem(STORAGE_KEY));
    } catch {
      return false;
    }
  }

  function captureModel() {
    return deepClone({
      project: state.project,
      objects: state.objects,
      nodes: state.nodes,
      relations: state.relations,
      preferences: state.preferences
    });
  }

  function restoreModel(snapshot) {
    state.project = deepClone(snapshot.project);
    state.objects = deepClone(snapshot.objects);
    state.nodes = deepClone(snapshot.nodes);
    state.relations = deepClone(snapshot.relations);
    state.preferences = deepClone(snapshot.preferences);
    state = normalizeState(state);
    clearInvalidSelection();
  }

  function pushHistory(label, snapshot = captureModel()) {
    undoStack.push({ label, snapshot });
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }

  function commit(label, mutation) {
    pushHistory(label);
    mutation();
    state.project.updatedAt = nowIso();
    markDirty();
    renderAll();
  }

  function undo() {
    const entry = undoStack.pop();
    if (!entry) return;
    redoStack.push({ label: entry.label, snapshot: captureModel() });
    restoreModel(entry.snapshot);
    markDirty();
    renderAll();
    toast(`已復原：${entry.label}`);
  }

  function redo() {
    const entry = redoStack.pop();
    if (!entry) return;
    undoStack.push({ label: entry.label, snapshot: captureModel() });
    restoreModel(entry.snapshot);
    markDirty();
    renderAll();
    toast(`已重做：${entry.label}`);
  }

  function updateHistoryButtons() {
    elements.undoButton.disabled = undoStack.length === 0;
    elements.redoButton.disabled = redoStack.length === 0;
  }

  function markDirty() {
    elements.saveStatus.innerHTML = `${icon('save')}儲存中…`;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 180);
  }

  function saveNow() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      elements.saveStatus.innerHTML = `${icon('check')}已自動儲存`;
    } catch (error) {
      console.warn('Unable to save project:', error);
      elements.saveStatus.innerHTML = `${icon('warning')}無法自動儲存`;
    }
  }

  function isNodeVisible(node) {
    const object = getObject(node.objectId);
    if (!object) return false;
    if (!ui.enabledTypes.has(object.type)) return false;
    const query = ui.search.trim().toLocaleLowerCase('zh-Hant');
    if (!query) return true;
    const haystack = [object.name, object.id, object.type, TYPE_META[object.type]?.label, object.description]
      .filter(Boolean)
      .join(' ')
      .toLocaleLowerCase('zh-Hant');
    return haystack.includes(query);
  }

  function clearInvalidSelection() {
    if (ui.selectedNodeId && !getNode(ui.selectedNodeId)) ui.selectedNodeId = null;
    if (ui.selectedObjectId && !getObject(ui.selectedObjectId)) ui.selectedObjectId = null;
    if (ui.connectSourceNodeId && !getNode(ui.connectSourceNodeId)) ui.connectSourceNodeId = null;
  }

  function getSelectedObject() {
    if (ui.selectedObjectId) return getObject(ui.selectedObjectId);
    const selectedNode = getNode(ui.selectedNodeId);
    return selectedNode ? getObject(selectedNode.objectId) : null;
  }

  function selectNode(nodeId, options = {}) {
    const node = getNode(nodeId);
    if (!node) return;
    ui.selectedNodeId = node.id;
    ui.selectedObjectId = node.objectId;
    ui.selectedRelationId = null;
    if (options.center) centerOnNode(node);
    renderNodes();
    renderObjectList();
    renderInspector();
    renderStatus();
    drawMinimap();
  }

  function selectObject(objectId, options = {}) {
    const object = getObject(objectId);
    if (!object) return;
    ui.selectedObjectId = object.id;
    const node = getNodesForObject(object.id)[0] || null;
    ui.selectedNodeId = node?.id || null;
    ui.selectedRelationId = null;
    if (options.center && node) centerOnNode(node);
    renderNodes();
    renderObjectList();
    renderInspector();
    renderStatus();
    drawMinimap();
  }

  function clearSelection() {
    ui.selectedNodeId = null;
    ui.selectedObjectId = null;
    ui.selectedRelationId = null;
    renderNodes();
    renderObjectList();
    renderInspector();
    renderStatus();
    drawMinimap();
  }

  function previewFaceSvg(object, options = {}) {
    ensureFaceData(object);
    const points = object.data.boundary;
    const bounds = polygonBounds(points);
    const viewW = options.large ? 520 : 320;
    const viewH = options.large ? 330 : 180;
    const padX = options.large ? 68 : 42;
    const padY = options.large ? 58 : 34;
    const maxW = Math.max(1, viewW - padX * 2);
    const maxH = Math.max(1, viewH - padY * 2);
    const scale = Math.min(maxW / Math.max(1, bounds.width), maxH / Math.max(1, bounds.height));
    const offsetX = (viewW - bounds.width * scale) / 2 - bounds.minX * scale;
    const offsetY = (viewH - bounds.height * scale) / 2 - bounds.minY * scale;
    const mapX = (value) => round(value * scale + offsetX, 2);
    const mapY = (value) => round(value * scale + offsetY, 2);
    const polygon = points.map((point) => `${mapX(point.x)},${mapY(point.y)}`).join(' ');
    const elevation = safeNumber(object.data.elevation, 0);
    const role = object.data.boundaryRole ? boundaryRoleLabel(object.data.boundaryRole) : '自訂面';
    const fontSize = options.large ? 11 : 8;
    const vertexRadius = options.large ? 3.3 : 2.5;
    const elementsMarkup = object.data.elements.map((element) => {
      if (element.type === 'referenceLine') {
        return `<g><path d="M${mapX(element.x1)} ${mapY(element.y1)}L${mapX(element.x2)} ${mapY(element.y2)}" fill="none" stroke="#607089" stroke-width="${options.large ? 1.6 : 1.2}" stroke-dasharray="5 4"/><circle cx="${mapX(element.x1)}" cy="${mapY(element.y1)}" r="${options.large ? 2.6 : 1.9}" fill="#fff" stroke="#607089"/><circle cx="${mapX(element.x2)}" cy="${mapY(element.y2)}" r="${options.large ? 2.6 : 1.9}" fill="#fff" stroke="#607089"/></g>`;
      }
      const x = mapX(element.x);
      const y = mapY(element.y);
      const width = Math.max(2, element.width * scale);
      const height = Math.max(2, element.height * scale);
      return `<g><rect x="${x}" y="${y}" width="${round(width, 2)}" height="${round(height, 2)}" rx="2" fill="#84c8df" fill-opacity=".52" stroke="#398cb8" stroke-width="${options.large ? 1.5 : 1.1}"/><path d="M${x} ${y}l${round(width,2)} ${round(height,2)}M${round(x+width,2)} ${y}l-${round(width,2)} ${round(height,2)}" stroke="#398cb8" stroke-width=".8" opacity=".6"/></g>`;
    }).join('');
    const vertices = points.map((point) => `<circle cx="${mapX(point.x)}" cy="${mapY(point.y)}" r="${vertexRadius}" fill="#fff" stroke="#2f8f7b" stroke-width="${options.large ? 1.4 : 1}"/>`).join('');
    const interiorCount = object.data.elements.length;
    return `
      <svg viewBox="0 0 ${viewW} ${viewH}" role="img" aria-label="${escapeHtml(object.name)}的面預覽">
        <defs>
          <linearGradient id="faceFill-${escapeHtml(object.id)}-${options.large ? 'large' : 'small'}" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#dff3ed"/><stop offset="1" stop-color="#b9ded4"/>
          </linearGradient>
          <pattern id="faceGrid-${escapeHtml(object.id)}-${options.large ? 'large' : 'small'}" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M16 0H0V16" fill="none" stroke="#2f8f7b" stroke-opacity=".08" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="${viewW}" height="${viewH}" fill="#f7f9fb"/>
        <path d="M20 ${viewH - 23}H${viewW - 20}" stroke="#dfe5ec" stroke-width="1"/>
        <polygon points="${polygon}" transform="translate(4 5)" fill="#173e35" opacity=".08"/>
        <polygon points="${polygon}" fill="url(#faceFill-${escapeHtml(object.id)}-${options.large ? 'large' : 'small'})" stroke="#2f8f7b" stroke-width="${options.large ? 1.8 : 1.4}" stroke-linejoin="round"/>
        <polygon points="${polygon}" fill="url(#faceGrid-${escapeHtml(object.id)}-${options.large ? 'large' : 'small'})"/>
        ${elementsMarkup}
        ${vertices}
        <text x="${viewW / 2}" y="${viewH - (options.large ? 20 : 10)}" text-anchor="middle" fill="#596578" font-size="${fontSize}" font-weight="650">範圍 ${escapeHtml(formatLength(bounds.width))} × ${escapeHtml(formatLength(bounds.height))} · ${points.length} 頂點</text>
        <g transform="translate(${options.large ? 20 : 12} ${options.large ? 20 : 11})">
          <rect width="${options.large ? 114 : 80}" height="${options.large ? 27 : 19}" rx="${options.large ? 7 : 5}" fill="#fff" stroke="#dfe4eb"/>
          <text x="${options.large ? 57 : 40}" y="${options.large ? 18 : 13.5}" text-anchor="middle" fill="#2f8f7b" font-size="${options.large ? 10 : 7.2}" font-weight="700">${escapeHtml(role)}</text>
        </g>
        <g transform="translate(${viewW - (options.large ? 144 : 102)} ${options.large ? 20 : 11})">
          <rect width="${options.large ? 124 : 90}" height="${options.large ? 27 : 19}" rx="${options.large ? 7 : 5}" fill="#fff" stroke="#dfe4eb"/>
          <text x="${options.large ? 62 : 45}" y="${options.large ? 18 : 13.5}" text-anchor="middle" fill="#687487" font-size="${options.large ? 9.5 : 7}" font-weight="650">Z = ${escapeHtml(formatLength(elevation))}${interiorCount ? ` · ${interiorCount} 物件` : ''}</text>
        </g>
      </svg>`;
  }

  function previewSpaceSvg(object, options = {}) {
    const width = Math.max(1, safeNumber(object.data.width, 600));
    const depth = Math.max(1, safeNumber(object.data.depth, 450));
    const height = Math.max(1, safeNumber(object.data.height, 280));
    const viewW = options.large ? 520 : 320;
    const viewH = options.large ? 330 : 180;
    const centerX = viewW * 0.5;
    const baseY = viewH * (options.large ? 0.68 : 0.71);
    const footprintW = options.large ? 270 : 166;
    const footprintD = footprintW * clamp(depth / width, 0.42, 1.15) * 0.42;
    const wallH = (options.large ? 145 : 80) * clamp(height / 280, 0.65, 1.35);
    const left = [centerX - footprintW / 2, baseY - footprintD / 2];
    const front = [centerX, baseY + footprintD / 2];
    const right = [centerX + footprintW / 2, baseY - footprintD / 2];
    const back = [centerX, baseY - footprintD * 1.5];
    const top = (point) => [point[0], point[1] - wallH];
    const p = (point) => `${round(point[0], 2)},${round(point[1], 2)}`;
    const fontSize = options.large ? 11 : 8;
    return `
      <svg viewBox="0 0 ${viewW} ${viewH}" role="img" aria-label="${escapeHtml(object.name)}的空間預覽">
        <defs>
          <linearGradient id="spaceWallA-${escapeHtml(object.id)}" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#ded6fb" stop-opacity=".8"/>
            <stop offset="1" stop-color="#bdb0ee" stop-opacity=".52"/>
          </linearGradient>
          <linearGradient id="spaceWallB-${escapeHtml(object.id)}" x1="1" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#cfc3f5" stop-opacity=".72"/>
            <stop offset="1" stop-color="#a895e5" stop-opacity=".42"/>
          </linearGradient>
        </defs>
        <rect width="${viewW}" height="${viewH}" fill="#f7f9fb"/>
        <ellipse cx="${centerX}" cy="${baseY + footprintD * .72}" rx="${footprintW * .58}" ry="${footprintD * .65}" fill="#362670" opacity=".07"/>
        <polygon points="${p(left)} ${p(front)} ${p(right)} ${p(back)}" fill="#eeeaff" stroke="#7557cc" stroke-opacity=".72" stroke-width="1.3"/>
        <polygon points="${p(left)} ${p(back)} ${p(top(back))} ${p(top(left))}" fill="url(#spaceWallA-${escapeHtml(object.id)})" stroke="#7557cc" stroke-opacity=".82" stroke-width="1.3"/>
        <polygon points="${p(back)} ${p(right)} ${p(top(right))} ${p(top(back))}" fill="url(#spaceWallB-${escapeHtml(object.id)})" stroke="#7557cc" stroke-opacity=".82" stroke-width="1.3"/>
        <path d="M${p(top(left))}L${p(top(front))}L${p(top(right))}L${p(top(back))}Z" fill="none" stroke="#7557cc" stroke-width="1.3" stroke-dasharray="4 4"/>
        <path d="M${p(front)}L${p(top(front))}M${p(left)}L${p(top(left))}M${p(right)}L${p(top(right))}" fill="none" stroke="#7557cc" stroke-width="1.3"/>
        <g fill="#fff" stroke="#7557cc" stroke-width="1">
          <circle cx="${left[0]}" cy="${left[1]}" r="2.6"/><circle cx="${front[0]}" cy="${front[1]}" r="2.6"/><circle cx="${right[0]}" cy="${right[1]}" r="2.6"/><circle cx="${back[0]}" cy="${back[1]}" r="2.6"/>
        </g>
        <text x="${centerX}" y="${baseY + footprintD / 2 + (options.large ? 28 : 18)}" text-anchor="middle" fill="#5d687a" font-size="${fontSize}" font-weight="600">${escapeHtml(formatLength(width))} × ${escapeHtml(formatLength(depth))}</text>
        <text x="${right[0] + (options.large ? 27 : 16)}" y="${right[1] - wallH / 2}" text-anchor="middle" fill="#5d687a" font-size="${fontSize}" font-weight="600" transform="rotate(-90 ${right[0] + (options.large ? 27 : 16)} ${right[1] - wallH / 2})">${escapeHtml(formatLength(height))}</text>
        <g transform="translate(${options.large ? 22 : 13} ${options.large ? 22 : 12})">
          <rect width="${options.large ? 142 : 96}" height="${options.large ? 28 : 20}" rx="${options.large ? 7 : 5}" fill="#fff" stroke="#dfe4eb"/>
          <text x="${options.large ? 71 : 48}" y="${options.large ? 18.5 : 14}" text-anchor="middle" fill="#7557cc" font-size="${options.large ? 10 : 7.5}" font-weight="700">封閉空間 · 6 個邊界面</text>
        </g>
      </svg>`;
  }

  function previewSvg(object, options = {}) {
    return object.type === 'space' ? previewSpaceSvg(object, options) : previewFaceSvg(object, options);
  }

  function boundaryRoleLabel(role) {
    return ({ ceiling: '天花板面', floor: '地板面', north: '北牆面', south: '南牆面', east: '東牆面', west: '西牆面' })[role] || '邊界面';
  }

  function objectMetrics(object) {
    if (object.type === 'space') {
      const width = safeNumber(object.data.width);
      const depth = safeNumber(object.data.depth);
      const height = safeNumber(object.data.height);
      return [
        { label: '平面尺寸', value: `${formatLength(width)} × ${formatLength(depth)}` },
        { label: '高度', value: formatLength(height) },
        { label: '樓地板面積', value: formatArea(width * depth) },
        { label: '體積', value: formatVolume(width * depth * height) }
      ];
    }
    ensureFaceData(object);
    const points = object.data.boundary;
    const bounds = polygonBounds(points);
    return [
      { label: '輪廓範圍', value: `${formatLength(bounds.width)} × ${formatLength(bounds.height)}` },
      { label: '面積', value: formatArea(polygonArea(points)) },
      { label: '周長', value: formatLength(polygonPerimeter(points)) },
      { label: '內部物件', value: `${object.data.elements.length} 個` }
    ];
  }

  function objectProperties(object) {
    if (object.type === 'space') {
      return [
        ['物件 ID', object.id],
        ['寬度', formatLength(object.data.width)],
        ['深度', formatLength(object.data.depth)],
        ['高度', formatLength(object.data.height)],
        ['樓地板面積', formatArea(safeNumber(object.data.width) * safeNumber(object.data.depth))],
        ['體積', formatVolume(safeNumber(object.data.width) * safeNumber(object.data.depth) * safeNumber(object.data.height))],
        ['座標系', object.data.coordinateSystem || '未指定'],
        ['邊界面', `${(object.data.boundaryFaceIds || []).length} 個`]
      ];
    }
    ensureFaceData(object);
    const points = object.data.boundary;
    const bounds = polygonBounds(points);
    const lineCount = object.data.elements.filter((element) => element.type === 'referenceLine').length;
    const openingCount = object.data.elements.filter((element) => element.type === 'opening').length;
    return [
      ['物件 ID', object.id],
      ['形狀', object.data.shape === 'rectangle' ? '矩形輪廓' : '多邊形輪廓'],
      ['頂點', `${points.length} 個`],
      ['外包範圍', `${formatLength(bounds.width)} × ${formatLength(bounds.height)}`],
      ['面積', formatArea(polygonArea(points))],
      ['周長', formatLength(polygonPerimeter(points))],
      ['面內內容', `${lineCount} 條參考線 · ${openingCount} 個開口`],
      ['標高', formatLength(object.data.elevation)],
      ['法線', object.data.normal || '未指定'],
      ['座標系', object.data.coordinateSystem || '未指定'],
      ['角色', object.data.boundaryRole ? boundaryRoleLabel(object.data.boundaryRole) : '獨立面']
    ];
  }

  function renderNodeBody(object, node) {
    if (node.mode === 'compact') {
      const metrics = objectMetrics(object).slice(0, 2);
      return `<div class="compact-summary">
        <strong>${escapeHtml(metrics[0]?.value || '')}</strong>
        <span>${escapeHtml(metrics[1]?.label || '')}：${escapeHtml(metrics[1]?.value || '')}</span>
      </div>`;
    }
    const metrics = objectMetrics(object).slice(0, 2);
    return `
      <div class="preview-stage">${previewSvg(object)}</div>
      <div class="preview-metrics">
        ${metrics.map((metric) => `<div class="preview-metric"><span>${escapeHtml(metric.label)}</span><strong>${escapeHtml(metric.value)}</strong></div>`).join('')}
      </div>`;
  }

  function renderNodes() {
    elements.nodeLayer.innerHTML = state.nodes.map((node) => {
      const object = getObject(node.objectId);
      if (!object) return '';
      const meta = typeMeta(object.type);
      const selected = ui.selectedNodeId === node.id;
      const connectSource = ui.connectSourceNodeId === node.id;
      const visible = isNodeVisible(node);
      const modeClass = node.mode === 'compact' ? 'node-compact' : 'node-preview';
      const visibilityClass = visible ? '' : (!ui.enabledTypes.has(object.type) ? 'type-hidden' : 'search-hidden');
      return `
        <article class="canvas-node ${modeClass} ${selected ? 'selected' : ''} ${connectSource ? 'connect-source' : ''} ${visibilityClass}"
          data-node-id="${escapeHtml(node.id)}"
          style="left:${safeNumber(node.x)}px;top:${safeNumber(node.y)}px;width:${safeNumber(node.w)}px;height:${safeNumber(node.h)}px"
          aria-label="${escapeHtml(meta.label)}：${escapeHtml(object.name)}">
          <header class="node-header" data-drag-handle>
            <span class="type-icon ${escapeHtml(object.type)}">${icon(meta.icon)}</span>
            <span class="node-header-copy">
              <strong>${escapeHtml(object.name)}</strong>
              <small>${escapeHtml(meta.en.toUpperCase())} · ${escapeHtml(shortId(object.id))}</small>
            </span>
            <button class="node-menu-button" type="button" data-node-action="toggle-mode" title="切換摘要／預覽" aria-label="切換顯示模式">${icon(node.mode === 'compact' ? 'expand' : 'compact')}</button>
          </header>
          <div class="node-body">${renderNodeBody(object, node)}</div>
          <footer class="node-footer">
            <button class="node-action" type="button" data-node-action="view">${icon('eye')}檢視</button>
            <button class="node-action" type="button" data-node-action="edit">${icon('arrowRight')}進入</button>
          </footer>
        </article>`;
    }).join('');
  }

  function edgeNodesForRelation(relation) {
    let source = relation.sourceNodeId ? getNode(relation.sourceNodeId) : null;
    let target = relation.targetNodeId ? getNode(relation.targetNodeId) : null;
    if (!source || source.objectId !== relation.sourceObjectId || !isNodeVisible(source)) {
      source = getFirstVisibleNodeForObject(relation.sourceObjectId);
    }
    if (!target || target.objectId !== relation.targetObjectId || !isNodeVisible(target)) {
      target = getFirstVisibleNodeForObject(relation.targetObjectId);
    }
    return { source, target };
  }

  function nodeAnchor(node, toward) {
    const center = { x: node.x + node.w / 2, y: node.y + node.h / 2 };
    const dx = toward.x - center.x;
    const dy = toward.y - center.y;
    if (Math.abs(dx / node.w) > Math.abs(dy / node.h)) {
      return { x: center.x + Math.sign(dx || 1) * node.w / 2, y: center.y + dy * (node.w / 2 / Math.max(1, Math.abs(dx))) };
    }
    return { x: center.x + dx * (node.h / 2 / Math.max(1, Math.abs(dy))), y: center.y + Math.sign(dy || 1) * node.h / 2 };
  }

  function relationGeometry(source, target) {
    const sourceCenter = { x: source.x + source.w / 2, y: source.y + source.h / 2 };
    const targetCenter = { x: target.x + target.w / 2, y: target.y + target.h / 2 };
    const start = nodeAnchor(source, targetCenter);
    const end = nodeAnchor(target, sourceCenter);
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const horizontal = Math.abs(dx) >= Math.abs(dy);
    const bend = clamp(Math.abs(horizontal ? dx : dy) * 0.45, 50, 180);
    const c1 = horizontal
      ? { x: start.x + Math.sign(dx || 1) * bend, y: start.y }
      : { x: start.x, y: start.y + Math.sign(dy || 1) * bend };
    const c2 = horizontal
      ? { x: end.x - Math.sign(dx || 1) * bend, y: end.y }
      : { x: end.x, y: end.y - Math.sign(dy || 1) * bend };
    const mid = { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 };
    return { start, end, c1, c2, mid, path: `M${start.x} ${start.y} C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${end.x} ${end.y}` };
  }

  function renderEdges() {
    const relationMarkup = [];
    for (const relation of state.relations) {
      const { source, target } = edgeNodesForRelation(relation);
      if (!source || !target || source.id === target.id) continue;
      const geometry = relationGeometry(source, target);
      const label = relation.label || relationMeta(relation.type).label;
      const labelWidth = clamp(label.length * 11 + 20, 46, 150);
      relationMarkup.push(`
        <g class="edge-group-item ${ui.selectedRelationId === relation.id ? 'selected' : ''}" data-relation-id="${escapeHtml(relation.id)}">
          <path class="edge-path" d="${geometry.path}"/>
          <rect class="edge-label-bg" x="${geometry.mid.x - labelWidth / 2}" y="${geometry.mid.y - 10}" width="${labelWidth}" height="20" rx="7"/>
          <text class="edge-label" x="${geometry.mid.x}" y="${geometry.mid.y + .5}">${escapeHtml(label)}</text>
        </g>`);
    }
    elements.edgeGroup.innerHTML = relationMarkup.join('');
  }

  function renderObjectList() {
    const query = ui.search.trim().toLocaleLowerCase('zh-Hant');
    const filtered = state.objects.filter((object) => {
      if (!ui.enabledTypes.has(object.type)) return false;
      if (!query) return true;
      return [object.name, object.id, object.description, object.type, TYPE_META[object.type]?.label]
        .filter(Boolean)
        .join(' ')
        .toLocaleLowerCase('zh-Hant')
        .includes(query);
    });

    if (filtered.length === 0) {
      elements.objectList.innerHTML = `<div class="object-list-empty">${state.objects.length ? '沒有符合搜尋條件的物件' : '尚未建立物件'}</div>`;
    } else {
      elements.objectList.innerHTML = filtered.map((object) => {
        const meta = typeMeta(object.type);
        const nodes = getNodesForObject(object.id);
        const selected = ui.selectedObjectId === object.id;
        return `
          <div class="object-row ${selected ? 'selected' : ''}" role="listitem" data-object-id="${escapeHtml(object.id)}">
            <span class="row-icon ${escapeHtml(object.type)}">${icon(meta.icon)}</span>
            <span class="row-copy"><strong>${escapeHtml(object.name)}</strong><small>${escapeHtml(meta.en)} · ${nodes.length} 個檢視</small></span>
            <button class="show-view" type="button" data-list-action="${nodes.length ? 'locate' : 'show'}" title="${nodes.length ? '定位畫布檢視' : '放到畫布'}" aria-label="${nodes.length ? '定位畫布檢視' : '放到畫布'}">${icon(nodes.length ? 'locate' : 'plus')}</button>
          </div>`;
      }).join('');
    }

    const faceCount = state.objects.filter((object) => object.type === 'face').length;
    const spaceCount = state.objects.filter((object) => object.type === 'space').length;
    elements.faceCount.textContent = String(faceCount);
    elements.spaceCount.textContent = String(spaceCount);
    elements.objectCountBadge.textContent = String(state.objects.length);
  }

  function propertiesMarkup(object) {
    return `<dl class="property-list">${objectProperties(object).map(([term, value]) => `
      <div class="property-row"><dt>${escapeHtml(term)}</dt><dd>${escapeHtml(value)}</dd></div>`).join('')}</dl>`;
  }

  function relationListMarkup(object) {
    const relations = state.relations.filter((relation) => relation.sourceObjectId === object.id || relation.targetObjectId === object.id);
    if (relations.length === 0) return '<p class="description-box">尚未建立語意關係。</p>';
    return `<div class="relation-list">${relations.map((relation) => {
      const outgoing = relation.sourceObjectId === object.id;
      const counterpart = getObject(outgoing ? relation.targetObjectId : relation.sourceObjectId);
      const meta = relationMeta(relation.type);
      return `
        <div class="relation-row" data-relation-id="${escapeHtml(relation.id)}">
          <span class="relation-direction">${icon(outgoing ? 'arrowRight' : 'arrowLeft')}</span>
          <span class="relation-copy"><strong>${escapeHtml(counterpart?.name || '遺失物件')}</strong><small>${outgoing ? '輸出' : '輸入'} · ${escapeHtml(relation.label || meta.label)} (${escapeHtml(meta.en)})</small></span>
          <button class="relation-delete" type="button" data-inspector-action="delete-relation" data-relation-id="${escapeHtml(relation.id)}" title="刪除關係" aria-label="刪除關係">${icon('trash')}</button>
        </div>`;
    }).join('')}</div>`;
  }

  function boundaryListMarkup(spaceObject) {
    const faceIds = spaceObject.data.boundaryFaceIds || [];
    if (faceIds.length === 0) return '';
    return `<section class="inspector-section"><h3>邊界面</h3><div class="boundary-list">${faceIds.map((faceId) => {
      const face = getObject(faceId);
      if (!face) return '';
      const visibleNode = getNodesForObject(face.id)[0];
      return `<div class="boundary-row"><span>${escapeHtml(face.name)}</span><button type="button" data-inspector-action="${visibleNode ? 'locate-object' : 'show-object'}" data-object-id="${escapeHtml(face.id)}">${visibleNode ? '定位' : '顯示'}</button></div>`;
    }).join('')}</div></section>`;
  }

  function renderInspector() {
    const object = getSelectedObject();
    if (!object) {
      elements.inspectorEmpty.hidden = false;
      elements.inspectorContent.hidden = true;
      elements.inspectorContent.innerHTML = '';
      return;
    }

    const meta = typeMeta(object.type);
    const selectedNode = ui.selectedNodeId ? getNode(ui.selectedNodeId) : null;
    const objectNodes = getNodesForObject(object.id);
    elements.inspectorEmpty.hidden = true;
    elements.inspectorContent.hidden = false;
    elements.inspectorContent.innerHTML = `
      <section class="inspector-hero">
        <div class="inspector-title-row">
          <span class="type-icon ${escapeHtml(object.type)}">${icon(meta.icon)}</span>
          <div class="inspector-title-copy"><h2>${escapeHtml(object.name)}</h2><p>${escapeHtml(meta.label)} · ${escapeHtml(meta.en)} · ${escapeHtml(shortId(object.id))}</p></div>
        </div>
        <div class="inspector-preview">${previewSvg(object)}</div>
        <div class="inspector-actions">
          <button class="secondary-button" type="button" data-inspector-action="view">${icon('eye')}檢視</button>
          <button class="primary-button" type="button" data-inspector-action="edit">${icon('arrowRight')}進入物件</button>
        </div>
      </section>
      <section class="inspector-section"><h3>物件資料</h3>${propertiesMarkup(object)}</section>

      <section class="inspector-section"><h3>畫布檢視</h3>
        <div class="inspector-actions">
          <button class="secondary-button" type="button" data-inspector-action="duplicate-view">${icon('copy')}新增檢視</button>
          ${selectedNode ? `<button class="secondary-button" type="button" data-inspector-action="toggle-mode">${icon(selectedNode.mode === 'compact' ? 'expand' : 'compact')}${selectedNode.mode === 'compact' ? '展開' : '摘要'}</button>` : `<button class="secondary-button" type="button" data-inspector-action="show-object">${icon('plus')}放到畫布</button>`}
        </div>
        ${objectNodes.length ? `<p class="description-box" style="margin-top:8px">目前有 ${objectNodes.length} 個畫布檢視。所有檢視共用同一份物件資料。</p>` : ''}
        ${selectedNode ? `<button class="text-button" style="margin-top:10px" type="button" data-inspector-action="remove-view">移除目前檢視（保留物件）</button>` : ''}
      </section>
      <div class="inspector-danger-zone"><button type="button" data-inspector-action="delete-object">刪除物件與全部檢視</button></div>`;

  function renderStatus() {
    const toolLabels = { select: '選取工具', pan: '平移工具', connect: '關係工具' };
    elements.toolStatus.innerHTML = `<span class="status-dot"></span>${toolLabels[ui.tool] || '選取工具'}`;
    const object = getSelectedObject();
    elements.selectionStatus.textContent = object ? `已選取：${object.name}` : '未選取物件';
    elements.summaryStatus.textContent = `${state.objects.length} 個物件 · ${state.nodes.length} 個檢視 · ${state.relations.length} 個關係`;
    elements.zoomLevelButton.textContent = `${Math.round(state.camera.scale * 100)}%`;
    elements.snapToggle.checked = state.preferences.snap;
    elements.gridToggle.checked = state.preferences.showGrid;
  }

  function updateWorldTransform() {
    elements.world.style.transform = `translate(${state.camera.x}px, ${state.camera.y}px) scale(${state.camera.scale})`;
    elements.zoomLevelButton.textContent = `${Math.round(state.camera.scale * 100)}%`;
    elements.viewport.classList.toggle('zoom-low', state.camera.scale < 0.44);
    elements.viewport.classList.toggle('show-grid', state.preferences.showGrid);

    let grid = state.preferences.gridSize * state.camera.scale;
    while (grid < 11) grid *= 5;
    while (grid > 80) grid /= 5;
    const major = grid * 5;
    const mod = (value, size) => ((value % size) + size) % size;
    elements.viewport.style.setProperty('--grid-size', `${grid}px`);
    elements.viewport.style.setProperty('--grid-major', `${major}px`);
    elements.viewport.style.setProperty('--grid-x', `${mod(state.camera.x, grid)}px`);
    elements.viewport.style.setProperty('--grid-y', `${mod(state.camera.y, grid)}px`);
  }

  function renderToolState() {
    $$('[data-tool]').forEach((button) => button.classList.toggle('active', button.dataset.tool === ui.tool));
    elements.viewport.classList.toggle('tool-pan', ui.tool === 'pan');
    elements.viewport.classList.toggle('tool-connect', ui.tool === 'connect');
    elements.viewport.classList.toggle('space-pan', ui.spacePressed);
    if (ui.tool === 'connect') {
      elements.connectionHint.hidden = false;
      const sourceNode = getNode(ui.connectSourceNodeId);
      const sourceObject = sourceNode ? getObject(sourceNode.objectId) : null;
      elements.connectionHintText.textContent = sourceObject
        ? `來源：${sourceObject.name}。請選擇目標物件。`
        : '先選擇關係來源物件';
    } else {
      elements.connectionHint.hidden = true;
    }
  }

  function renderEmptyState() {
    elements.emptyState.hidden = state.nodes.length !== 0;
  }

  function renderAll() {
    clearInvalidSelection();
    updateWorldTransform();
    renderToolState();
    renderObjectList();
    renderNodes();
    renderEdges();
    renderInspector();
    renderStatus();
    renderEmptyState();
    updateHistoryButtons();
    drawMinimap();
    if (ui.workspaceObjectId) renderObjectWorkspace();
  }

  function viewportToWorld(clientX, clientY) {
    const rect = elements.viewport.getBoundingClientRect();
    return {
      x: (clientX - rect.left - state.camera.x) / state.camera.scale,
      y: (clientY - rect.top - state.camera.y) / state.camera.scale
    };
  }

  function viewportCenterWorld() {
    const rect = elements.viewport.getBoundingClientRect();
    return viewportToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  function setCameraScale(nextScale, clientX, clientY) {
    const rect = elements.viewport.getBoundingClientRect();
    const screenX = clientX == null ? rect.width / 2 : clientX - rect.left;
    const screenY = clientY == null ? rect.height / 2 : clientY - rect.top;
    const worldX = (screenX - state.camera.x) / state.camera.scale;
    const worldY = (screenY - state.camera.y) / state.camera.scale;
    const scale = clamp(nextScale, 0.15, 2.5);
    state.camera.scale = scale;
    state.camera.x = screenX - worldX * scale;
    state.camera.y = screenY - worldY * scale;
    updateWorldTransform();
    drawMinimap();
    markDirty();
  }

  function centerOnNode(node) {
    const rect = elements.viewport.getBoundingClientRect();
    state.camera.x = rect.width / 2 - (node.x + node.w / 2) * state.camera.scale;
    state.camera.y = rect.height / 2 - (node.y + node.h / 2) * state.camera.scale;
    updateWorldTransform();
    drawMinimap();
    markDirty();
  }

  function fitAll() {
    const nodes = state.nodes.filter(isNodeVisible);
    if (nodes.length === 0) {
      state.camera = { x: 240, y: 160, scale: 1 };
      updateWorldTransform();
      drawMinimap();
      markDirty();
      return;
    }
    const rect = elements.viewport.getBoundingClientRect();
    const minX = Math.min(...nodes.map((node) => node.x));
    const minY = Math.min(...nodes.map((node) => node.y));
    const maxX = Math.max(...nodes.map((node) => node.x + node.w));
    const maxY = Math.max(...nodes.map((node) => node.y + node.h));
    const width = Math.max(1, maxX - minX);
    const height = Math.max(1, maxY - minY);
    const padding = 90;
    const scale = clamp(Math.min((rect.width - padding * 2) / width, (rect.height - padding * 2) / height), 0.18, 1.2);
    state.camera.scale = scale;
    state.camera.x = rect.width / 2 - (minX + width / 2) * scale;
    state.camera.y = rect.height / 2 - (minY + height / 2) * scale;
    updateWorldTransform();
    drawMinimap();
    markDirty();
  }

  function snapValue(value) {
    if (!state.preferences.snap) return round(value, 1);
    const size = state.preferences.gridSize;
    return Math.round(value / size) * size;
  }

  function findFreeNodePosition(desiredX, desiredY, width, height) {
    const margin = 24;
    const overlaps = (x, y) => state.nodes.some((node) =>
      x < node.x + node.w + margin &&
      x + width + margin > node.x &&
      y < node.y + node.h + margin &&
      y + height + margin > node.y
    );

    const baseX = snapValue(desiredX);
    const baseY = snapValue(desiredY);
    if (!overlaps(baseX, baseY)) return { x: baseX, y: baseY };

    const stepX = Math.max(80, width * 0.72);
    const stepY = Math.max(70, height * 0.58);
    for (let ring = 1; ring <= 10; ring += 1) {
      const candidates = [];
      for (let ix = -ring; ix <= ring; ix += 1) {
        candidates.push([ix, -ring], [ix, ring]);
      }
      for (let iy = -ring + 1; iy <= ring - 1; iy += 1) {
        candidates.push([-ring, iy], [ring, iy]);
      }
      candidates.sort((a, b) => (Math.abs(a[0]) + Math.abs(a[1])) - (Math.abs(b[0]) + Math.abs(b[1])));
      for (const [ix, iy] of candidates) {
        const x = snapValue(baseX + ix * stepX);
        const y = snapValue(baseY + iy * stepY);
        if (!overlaps(x, y)) return { x, y };
      }
    }
    return { x: baseX + width + margin, y: baseY + height + margin };
  }

  function addViewForObject(objectId, position = null, options = {}) {
    const object = getObject(objectId);
    if (!object) return null;
    const mode = options.mode || 'preview';
    const size = NODE_SIZE[mode] || NODE_SIZE.preview;
    const center = position || viewportCenterWorld();
    const offset = getNodesForObject(objectId).length * 28;
    const desiredX = center.x - size.w / 2 + offset;
    const desiredY = center.y - size.h / 2 + offset;
    const freePosition = findFreeNodePosition(desiredX, desiredY, size.w, size.h);
    const node = createCanvasNode(objectId, freePosition.x, freePosition.y, mode);
    state.nodes.push(node);
    ui.selectedNodeId = node.id;
    ui.selectedObjectId = object.id;
    return node;
  }

  function removeView(nodeId, withHistory = true) {
    const node = getNode(nodeId);
    if (!node) return;
    const action = () => {
      state.nodes = state.nodes.filter((item) => item.id !== nodeId);
      for (const relation of state.relations) {
        if (relation.sourceNodeId === nodeId) relation.sourceNodeId = null;
        if (relation.targetNodeId === nodeId) relation.targetNodeId = null;
      }
      if (ui.selectedNodeId === nodeId) ui.selectedNodeId = null;
      ui.selectedObjectId = node.objectId;
    };
    if (withHistory) commit('移除畫布檢視', action);
    else action();
  }

  function deleteObject(objectId) {
    const object = getObject(objectId);
    if (!object) return;
    const message = `確定刪除「${object.name}」嗎？\n\n這會刪除底層物件、全部畫布檢視，以及連到它的關係。`;
    if (!window.confirm(message)) return;
    commit('刪除物件', () => {
      state.objects = state.objects.filter((item) => item.id !== objectId);
      state.nodes = state.nodes.filter((node) => node.objectId !== objectId);
      state.relations = state.relations.filter((relation) => relation.sourceObjectId !== objectId && relation.targetObjectId !== objectId);
      for (const space of state.objects.filter((item) => item.type === 'space')) {
        space.data.boundaryFaceIds = (space.data.boundaryFaceIds || []).filter((id) => id !== objectId);
      }
      if (object.type === 'space') {
        for (const childId of object.data.boundaryFaceIds || []) {
          const child = getObject(childId);
          if (child?.data.generatedFromSpaceId === object.id) child.data.generatedFromSpaceId = null;
        }
      }
      ui.selectedNodeId = null;
      ui.selectedObjectId = null;
      ui.connectSourceNodeId = null;
    });
    toast(`已刪除「${object.name}」`);
  }

  function duplicateObject(objectId) {
    const object = getObject(objectId);
    if (!object) return;
    commit('複製物件', () => {
      const copy = deepClone(object);
      copy.id = uid(copy.type);
      copy.name = `${copy.name} 複本`;
      copy.createdAt = nowIso();
      copy.updatedAt = copy.createdAt;
      if (copy.type === 'space') copy.data.boundaryFaceIds = [];
      if (copy.type === 'face') {
        copy.data.generatedFromSpaceId = null;
        copy.data.boundaryRole = null;
      }
      state.objects.push(copy);
      const center = viewportCenterWorld();
      const node = createCanvasNode(copy.id, snapValue(center.x - 156), snapValue(center.y - 139));
      state.nodes.push(node);
      ui.selectedNodeId = node.id;
      ui.selectedObjectId = copy.id;
    });
  }

  function setTool(tool) {
    ui.tool = ['select', 'pan', 'connect'].includes(tool) ? tool : 'select';
    if (ui.tool !== 'connect') {
      ui.connectSourceNodeId = null;
      ui.pendingRelation = null;
    }
    renderToolState();
    renderNodes();
    renderStatus();
  }

  function handleConnectNode(nodeId) {
    const node = getNode(nodeId);
    if (!node) return;
    if (!ui.connectSourceNodeId) {
      ui.connectSourceNodeId = node.id;
      selectNode(node.id);
      renderToolState();
      renderNodes();
      return;
    }
    if (ui.connectSourceNodeId === node.id) {
      toast('來源與目標不能是同一個畫布檢視。', 'error');
      return;
    }
    const sourceNode = getNode(ui.connectSourceNodeId);
    if (!sourceNode) {
      ui.connectSourceNodeId = node.id;
      renderToolState();
      return;
    }
    if (sourceNode.objectId === node.objectId) {
      toast('同一個底層物件的不同檢視不需要建立語意關係。', 'error');
      return;
    }
    ui.pendingRelation = { sourceNodeId: sourceNode.id, targetNodeId: node.id };
    openRelationDialog();
  }

  function currentWorkspaceObject() {
    return ui.workspaceObjectId ? getObject(ui.workspaceObjectId) : null;
  }

  function faceToolLabel(tool = ui.faceTool) {
    return ({
      select: '選取工具',
      vertex: '新增頂點工具',
      referenceLine: '參考線工具',
      opening: '開口工具',
      pan: '平移工具'
    })[tool] || '選取工具';
  }

  function faceToolHint(tool = ui.faceTool) {
    return ({
      select: '直接拖曳白色頂點改變面輪廓；選取參考線或開口後可移動、調整。雙擊邊界也能新增頂點。',
      vertex: '點一下任一邊界邊，即可在該位置插入新的輪廓頂點。',
      referenceLine: '在面內按住並拖曳，建立一條可作為放置基準的參考線。',
      opening: '在面內按住並拖曳，建立矩形開口；之後可拖曳四角調整。',
      pan: '拖曳空白區域移動面內視野；滾輪可縮放。'
    })[tool] || '';
  }

  function setFaceTool(tool) {
    const allowed = new Set(['select', 'vertex', 'referenceLine', 'opening', 'pan']);
    ui.faceTool = allowed.has(tool) ? tool : 'select';
    ui.faceDraft = null;
    renderFaceWorkspace();
  }

  function openObjectWorkspace(objectId, options = {}) {
    const object = getObject(objectId);
    if (!object) return;
    closeDialogs(false);
    if (ui.workspaceObjectId && ui.workspaceObjectId !== object.id && options.pushCurrent) {
      ui.workspaceStack.push(ui.workspaceObjectId);
    } else if (!options.keepStack && !options.pushCurrent) {
      ui.workspaceStack = [];
    }
    ui.workspaceObjectId = object.id;
    ui.faceSelection = object.type === 'face' ? { kind: 'boundary' } : null;
    ui.faceDraft = null;
    ui.faceTool = 'select';
    ui.faceSpacePressed = false;
    if (object.type === 'face') ensureFaceData(object);
    elements.objectWorkspace.hidden = false;
    document.body.classList.add('workspace-open');
    renderObjectWorkspace();
    requestAnimationFrame(() => {
      const active = currentWorkspaceObject();
      if (active?.type === 'face') {
        ensureFaceData(active);
        if (!active.data.editor.initialized) fitFaceEditor(active, { mark: false });
        else renderFaceWorkspace();
      }
    });
  }

  function closeObjectWorkspace(forceCanvas = false) {
    if (!forceCanvas && ui.workspaceStack.length > 0) {
      const previousId = ui.workspaceStack.pop();
      const previous = getObject(previousId);
      if (previous) {
        ui.workspaceObjectId = previous.id;
        ui.faceSelection = previous.type === 'face' ? { kind: 'boundary' } : null;
        ui.faceTool = 'select';
        ui.faceDraft = null;
        renderObjectWorkspace();
        return;
      }
    }
    ui.workspaceObjectId = null;
    ui.workspaceStack = [];
    ui.faceSelection = null;
    ui.faceDraft = null;
    ui.faceTool = 'select';
    ui.faceSpacePressed = false;
    faceDragState = null;
    elements.objectWorkspace.hidden = true;
    elements.workspaceContent.innerHTML = '';
    document.body.classList.remove('workspace-open');
    renderAll();
  }

  function renderObjectWorkspace() {
    const object = currentWorkspaceObject();
    if (!object) {
      closeObjectWorkspace(true);
      return;
    }
    const meta = typeMeta(object.type);
    elements.workspaceTypeIcon.className = `type-icon ${object.type}`;
    elements.workspaceTypeIcon.innerHTML = icon(meta.icon);
    elements.workspaceEyebrow.textContent = object.type === 'face' ? '面內部工作區' : '空間內部工作區';
    elements.workspaceTitle.textContent = object.name;
    const parent = ui.workspaceStack.length ? getObject(ui.workspaceStack.at(-1)) : null;
    elements.workspaceBackLabel.textContent = parent ? `返回${typeMeta(parent.type).label}「${parent.name}」` : '返回物件畫布';
    elements.faceWorkspaceTools.hidden = object.type !== 'face';
    elements.workspaceFitButton.hidden = object.type !== 'face';
    elements.faceUndoButton.disabled = undoStack.length === 0;
    elements.faceRedoButton.disabled = redoStack.length === 0;
    if (object.type === 'face') renderFaceWorkspace();
    else renderSpaceWorkspace(object);
  }

  function faceWorkspaceShell() {
    return `
      <div class="face-workspace-layout">
        <aside class="inner-panel face-layer-panel">
          <div class="inner-panel-header"><h2>面內物件</h2><p>這些內容屬於目前這個面</p></div>
          <section class="inner-section">
            <div class="inner-section-title"><span>圖層與輪廓</span><span id="faceLayerCount">0</span></div>
            <div id="faceLayerList" class="face-layer-list"></div>
          </section>
          <section class="inner-section">
            <div class="inner-section-title"><span>直接建立</span></div>
            <div class="face-add-buttons">
              <button class="face-add-button" type="button" data-face-tool="referenceLine">${icon('line')}參考線</button>
              <button class="face-add-button" type="button" data-face-tool="opening">${icon('rectangle')}開口</button>
            </div>
          </section>
          <section class="inner-section">
            <div class="inner-section-title"><span>面內畫布</span></div>
            <div class="face-editor-options">
              <label class="face-option-row"><span>格線吸附</span><input id="faceSnapToggle" type="checkbox" /></label>
              <label class="face-option-row"><span>顯示格線</span><input id="faceGridToggle" type="checkbox" /></label>
              <label class="face-option-row"><span>格線間距</span><select id="faceGridSizeSelect"><option value="10">10 cm</option><option value="25">25 cm</option><option value="50">50 cm</option><option value="100">100 cm</option></select></label>
            </div>
          </section>
          <section class="inner-section face-editor-help">
            <div class="inner-section-title"><span>操作提示</span></div>
            <p><strong>拖曳頂點</strong>會直接改變面輪廓，不需要先修改寬高欄位。按住空白鍵可暫時平移，滾輪縮放，Delete 刪除選取的內部元素。</p>
          </section>
        </aside>

        <section id="faceEditorViewport" class="face-editor-viewport" tabindex="0" aria-label="面內幾何編輯畫布">
          <svg id="faceEditorSvg" class="face-editor-svg" aria-label="面輪廓與面內物件"></svg>
          <div id="faceCanvasHint" class="face-canvas-hint"></div>
          <div class="face-canvas-controls" aria-label="面內縮放控制">
            <button type="button" data-workspace-action="face-zoom-out" title="縮小">${icon('minus')}</button>
            <span id="faceCanvasScale" class="face-canvas-scale">100%</span>
            <button type="button" data-workspace-action="face-zoom-in" title="放大">${icon('plus')}</button>
            <button type="button" data-workspace-action="face-fit" title="顯示全部">${icon('fit')}</button>
          </div>
          <div id="faceCoordinateReadout" class="face-coordinate-readout">X: 0 cm · Y: 0 cm</div>

  }

  function renderFaceWorkspace() {
    const object = currentWorkspaceObject();
    if (!object || object.type !== 'face') return;
    ensureFaceData(object);
    if (elements.workspaceContent.dataset.mode !== 'face' || elements.workspaceContent.dataset.objectId !== object.id) {
      elements.workspaceContent.dataset.mode = 'face';
      elements.workspaceContent.dataset.objectId = object.id;
      elements.workspaceContent.innerHTML = faceWorkspaceShell();
    }
    $$('[data-face-tool]', elements.objectWorkspace).forEach((button) => button.classList.toggle('active', button.dataset.faceTool === ui.faceTool));
    const viewport = $('#faceEditorViewport', elements.workspaceContent);
    if (viewport) {
      viewport.className = `face-editor-viewport tool-${ui.faceTool}${ui.faceSpacePressed ? ' space-pan' : ''}${faceDragState?.kind === 'pan' ? ' is-panning' : ''}`;
    }
    const snapToggle = $('#faceSnapToggle', elements.workspaceContent);
    const gridToggle = $('#faceGridToggle', elements.workspaceContent);
    const gridSizeSelect = $('#faceGridSizeSelect', elements.workspaceContent);
    if (snapToggle) snapToggle.checked = object.data.editor.snap;
    if (gridToggle) gridToggle.checked = object.data.editor.showGrid;
    if (gridSizeSelect) gridSizeSelect.value = String(object.data.editor.gridSize);
    renderFaceLayerList(object);
    renderFaceEditorSvg(object);
    renderFaceInspector(object);
    const hint = $('#faceCanvasHint', elements.workspaceContent);
    if (hint) hint.textContent = faceToolHint();
    const scale = Math.round(object.data.editor.camera.scale * 100);
    const scaleLabel = $('#faceCanvasScale', elements.workspaceContent);
    if (scaleLabel) scaleLabel.textContent = `${scale}%`;
    elements.workspaceToolStatus.textContent = faceToolLabel();
    elements.workspaceZoomStatus.textContent = `${scale}%`;
    elements.workspaceCoordinateStatus.textContent = `X: ${round(ui.facePointer.x, 1)} · Y: ${round(ui.facePointer.y, 1)}`;
    elements.faceUndoButton.disabled = undoStack.length === 0;
    elements.faceRedoButton.disabled = redoStack.length === 0;
  }

  function renderFaceLayerList(object) {
    const list = $('#faceLayerList', elements.workspaceContent);
    if (!list) return;
    const selection = ui.faceSelection;
    const boundarySelected = selection?.kind === 'boundary' || selection?.kind === 'vertex';
    const rows = [`
      <button class="face-layer-row ${boundarySelected ? 'selected' : ''}" type="button" data-face-select-kind="boundary">
        <span class="face-layer-icon">${icon('face')}</span>
        <span class="face-layer-copy"><strong>面輪廓</strong><small>${object.data.boundary.length} 個頂點 · ${object.data.shape === 'rectangle' ? '矩形' : '多邊形'}</small></span>
        <span class="face-layer-count">${object.data.boundary.length}</span>
      </button>`];
    object.data.elements.forEach((element) => {
      const selected = selection?.kind === 'element' && selection.id === element.id;
      const iconName = element.type === 'opening' ? 'rectangle' : 'line';
      const detail = element.type === 'opening'
        ? `${formatLength(element.width)} × ${formatLength(element.height)}`
        : `長 ${formatLength(Math.hypot(element.x2 - element.x1, element.y2 - element.y1))}`;
      rows.push(`
        <button class="face-layer-row ${selected ? 'selected' : ''}" type="button" data-face-select-kind="element" data-element-id="${escapeHtml(element.id)}">
          <span class="face-layer-icon">${icon(iconName)}</span>
          <span class="face-layer-copy"><strong>${escapeHtml(element.label)}</strong><small>${detail}</small></span>
          <span class="face-layer-count">${element.type === 'opening' ? '孔' : '線'}</span>
        </button>`);
    });
    list.innerHTML = rows.join('');
    const count = $('#faceLayerCount', elements.workspaceContent);
    if (count) count.textContent = `${object.data.elements.length + 1} 項`;
  }

  function faceSelectionDescription(object) {
    const selection = ui.faceSelection || { kind: 'boundary' };
    const points = object.data.boundary;
    if (selection.kind === 'vertex') {
      const index = points.findIndex((point) => point.id === selection.id);
      const point = points[index];
      if (!point) { ui.faceSelection = { kind: 'boundary' }; return faceSelectionDescription(object); }
      const previous = points[(index - 1 + points.length) % points.length];
      const next = points[(index + 1) % points.length];
      return {
        icon: 'vertex',
        title: `輪廓頂點 ${index + 1}`,
        subtitle: '拖曳此點即可直接改變面輪廓',
        rows: [
          ['X 座標', formatLength(point.x)],
          ['Y 座標', formatLength(point.y)],
          ['前一邊', formatLength(Math.hypot(point.x - previous.x, point.y - previous.y))],
          ['下一邊', formatLength(Math.hypot(next.x - point.x, next.y - point.y))]
        ],
        canDelete: points.length > 3
      };
    }
    if (selection.kind === 'element') {
      const element = faceElementById(object, selection.id);
      if (element?.type === 'referenceLine') {
        const dx = element.x2 - element.x1;
        const dy = element.y2 - element.y1;
        return {
          icon: 'line',
          title: element.label,
          subtitle: '拖曳線段移動；拖曳端點改變方向與長度',
          rows: [
            ['長度', formatLength(Math.hypot(dx, dy))],
            ['角度', `${round(Math.atan2(dy, dx) * 180 / Math.PI, 1)}°`],
            ['起點', `(${round(element.x1,1)}, ${round(element.y1,1)})`],
            ['終點', `(${round(element.x2,1)}, ${round(element.y2,1)})`]
          ],
          canDelete: true,
          canRename: true,
          element
        };
      }
      if (element?.type === 'opening') {
        return {
          icon: 'rectangle',
          title: element.label,
          subtitle: '拖曳本體移動；拖曳四角改變開口尺寸',
          rows: [
            ['位置', `(${round(element.x,1)}, ${round(element.y,1)})`],
            ['寬度', formatLength(element.width)],
            ['高度', formatLength(element.height)],
            ['面積', formatArea(element.width * element.height)]
          ],
          canDelete: true,
          canRename: true,
          element
        };
      }
    }
    const bounds = polygonBounds(points);
    return {
      icon: 'face',
      title: '面輪廓',
      subtitle: '白色圓點就是可直接拖曳的輪廓頂點',
      rows: [
        ['頂點', `${points.length} 個`],
        ['範圍', `${formatLength(bounds.width)} × ${formatLength(bounds.height)}`],
        ['面積', formatArea(polygonArea(points))],
        ['周長', formatLength(polygonPerimeter(points))]
      ],
      canDelete: false
    };
  }

  function renderFaceInspector(object) {
    const inspector = $('#faceInspectorContent', elements.workspaceContent);

      </div>
      <section class="inner-section">
        <div class="inner-section-title"><span>物件名稱</span></div>
        <div class="workspace-name-row"><input id="workspaceNameInput" type="text" maxlength="80" value="${escapeHtml(object.name)}"/><button type="button" data-workspace-action="rename-object">套用</button></div>
      </section>
      <section class="inner-section">
        <div class="inner-section-title"><span>面資料</span></div>

          ${selection.canRename ? `<div class="workspace-name-row" style="margin-top:10px"><input id="selectionLabelInput" type="text" maxlength="60" value="${escapeHtml(selection.element.label)}"/><button type="button" data-workspace-action="rename-selection">改名</button></div>` : ''}
          <div class="selection-data-list">${selection.rows.map(([label, value]) => `<div class="selection-data-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join('')}</div>
          <div class="selection-actions">

        <p class="inspector-note"><strong>幾何編輯不在這裡輸入寬高。</strong><br/>請直接在中央畫布拖曳頂點、參考線或開口。右側只顯示選取結果與基本資料。</p>
      </section>`;
    elements.workspaceSelectionStatus.textContent = selection.title;

  function renderFaceEditorSvg(object) {
    const svg = $('#faceEditorSvg', elements.workspaceContent);
    const viewport = $('#faceEditorViewport', elements.workspaceContent);
    if (!svg || !viewport) return;
    const rect = viewport.getBoundingClientRect();
    const viewWidth = Math.max(1, rect.width);
    const viewHeight = Math.max(1, rect.height);
    svg.setAttribute('viewBox', `0 0 ${viewWidth} ${viewHeight}`);
    const editor = object.data.editor;
    const camera = editor.camera;
    const points = object.data.boundary;
    const polygon = points.map((point) => `${round(point.x,2)},${round(point.y,2)}`).join(' ');
    const visible = {
      minX: (-camera.x) / camera.scale - 100,
      minY: (-camera.y) / camera.scale - 100,
      maxX: (viewWidth - camera.x) / camera.scale + 100,
      maxY: (viewHeight - camera.y) / camera.scale + 100
    };
    const gridWidth = visible.maxX - visible.minX;
    const gridHeight = visible.maxY - visible.minY;
    const handleRadius = 6 / camera.scale;
    const endpointRadius = 5 / camera.scale;
    const resizeSize = 9 / camera.scale;
    const labelSize = clamp(11 / camera.scale, 4, 18);
    const selection = ui.faceSelection;
    const selectedBoundary = selection?.kind === 'boundary' || selection?.kind === 'vertex';
    const orientation = signedPolygonArea(points) >= 0 ? 1 : -1;

    const edgeMarkup = points.map((point, index) => {
      const next = points[(index + 1) % points.length];
      const dx = next.x - point.x;
      const dy = next.y - point.y;
      const length = Math.max(.001, Math.hypot(dx, dy));
      const normalX = orientation * dy / length;
      const normalY = orientation * -dx / length;
      const labelX = (point.x + next.x) / 2 + normalX * (18 / camera.scale);
      const labelY = (point.y + next.y) / 2 + normalY * (18 / camera.scale);
      let rotate = Math.atan2(dy, dx) * 180 / Math.PI;
      if (rotate > 90) rotate -= 180;
      if (rotate < -90) rotate += 180;
      return `<g>
        <path class="face-edge-visible" d="M${point.x} ${point.y}L${next.x} ${next.y}"/>
        <path class="face-edge-hit" data-face-hit="edge" data-edge-index="${index}" d="M${point.x} ${point.y}L${next.x} ${next.y}"/>
        <text class="face-dimension-label" x="${labelX}" y="${labelY}" text-anchor="middle" dominant-baseline="middle" font-size="${labelSize}" transform="rotate(${rotate} ${labelX} ${labelY})">${escapeHtml(formatLength(length))}</text>
      </g>`;
    }).join('');

    const elementsMarkup = object.data.elements.map((element) => {
      const selected = selection?.kind === 'element' && selection.id === element.id;
      if (element.type === 'referenceLine') {
        const midpointX = (element.x1 + element.x2) / 2;
        const midpointY = (element.y1 + element.y2) / 2;
        return `<g data-element-id="${escapeHtml(element.id)}">
          <path class="face-reference-line ${selected ? 'selected' : ''}" d="M${element.x1} ${element.y1}L${element.x2} ${element.y2}"/>
          <path class="face-reference-hit" data-face-hit="line" data-element-id="${escapeHtml(element.id)}" d="M${element.x1} ${element.y1}L${element.x2} ${element.y2}"/>
          <text class="face-dimension-label" x="${midpointX}" y="${midpointY - 11 / camera.scale}" text-anchor="middle" font-size="${labelSize}">${escapeHtml(element.label)}</text>
          ${selected ? `<circle class="face-line-endpoint" data-face-hit="line-endpoint" data-element-id="${escapeHtml(element.id)}" data-endpoint="start" cx="${element.x1}" cy="${element.y1}" r="${endpointRadius}"/><circle class="face-line-endpoint" data-face-hit="line-endpoint" data-element-id="${escapeHtml(element.id)}" data-endpoint="end" cx="${element.x2}" cy="${element.y2}" r="${endpointRadius}"/>` : ''}
        </g>`;
      }
      const x = element.x;
      const y = element.y;
      const right = element.x + element.width;
      const bottom = element.y + element.height;
      const handles = selected ? [
        ['nw', x, y], ['ne', right, y], ['se', right, bottom], ['sw', x, bottom]
      ].map(([corner, hx, hy]) => `<rect class="face-resize-handle" data-face-hit="opening-handle" data-element-id="${escapeHtml(element.id)}" data-corner="${corner}" x="${hx - resizeSize / 2}" y="${hy - resizeSize / 2}" width="${resizeSize}" height="${resizeSize}"/>`).join('') : '';
      return `<g data-element-id="${escapeHtml(element.id)}">
        <rect class="face-opening ${selected ? 'selected' : ''}" data-face-hit="opening" data-element-id="${escapeHtml(element.id)}" x="${x}" y="${y}" width="${element.width}" height="${element.height}" rx="${2 / camera.scale}"/>
        <path class="face-opening-cross" d="M${x} ${y}L${right} ${bottom}M${right} ${y}L${x} ${bottom}"/>
        <text class="face-dimension-label" x="${x + element.width / 2}" y="${y + element.height / 2}" text-anchor="middle" dominant-baseline="middle" font-size="${labelSize}">${escapeHtml(element.label)}</text>
        ${handles}
      </g>`;
    }).join('');

    const verticesMarkup = points.map((point) => `<circle class="face-vertex-handle ${selection?.kind === 'vertex' && selection.id === point.id ? 'selected' : ''}" data-face-hit="vertex" data-vertex-id="${escapeHtml(point.id)}" cx="${point.x}" cy="${point.y}" r="${handleRadius}"/>`).join('');

    let draftMarkup = '';
    if (ui.faceDraft?.objectId === object.id) {
      const start = ui.faceDraft.start;
      const end = ui.faceDraft.end || start;
      if (ui.faceDraft.kind === 'referenceLine') {
        draftMarkup = `<path class="draft-shape" d="M${start.x} ${start.y}L${end.x} ${end.y}"/>`;
      } else {
        const x = Math.min(start.x, end.x);
        const y = Math.min(start.y, end.y);
        const width = Math.abs(end.x - start.x);
        const height = Math.abs(end.y - start.y);
        draftMarkup = `<rect class="draft-shape" x="${x}" y="${y}" width="${width}" height="${height}"/>`;
      }
    }

    const gridMarkup = editor.showGrid ? `<rect x="${visible.minX}" y="${visible.minY}" width="${gridWidth}" height="${gridHeight}" fill="url(#face-editor-grid)"/>` : '';
    svg.innerHTML = `
      <defs>
        <pattern id="face-editor-grid" width="${editor.gridSize}" height="${editor.gridSize}" patternUnits="userSpaceOnUse">
          <path d="M${editor.gridSize} 0H0V${editor.gridSize}" fill="none" stroke="#aab4c4" stroke-opacity=".22" stroke-width="1" vector-effect="non-scaling-stroke"/>
        </pattern>
      </defs>
      <rect width="${viewWidth}" height="${viewHeight}" fill="#f8fafc" data-face-hit="canvas"/>
      <g transform="translate(${camera.x} ${camera.y}) scale(${camera.scale})">
        ${gridMarkup}
        <path class="face-origin-axis" d="M${visible.minX} 0H${visible.maxX}M0 ${visible.minY}V${visible.maxY}"/>
        <text class="face-origin-label" x="${7 / camera.scale}" y="${-7 / camera.scale}" font-size="${labelSize}">0,0</text>
        <polygon class="face-boundary-fill ${selectedBoundary ? 'selected' : ''}" data-face-hit="boundary" points="${polygon}"/>
        ${edgeMarkup}
        ${elementsMarkup}
        ${verticesMarkup}
        ${draftMarkup}
      </g>`;
  }
