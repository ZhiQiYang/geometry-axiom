        </section>
        <aside class="inner-panel space-info-panel">
          <div class="inner-panel-header"><div class="face-inspector-title"><span class="type-icon space">${icon('space')}</span><div class="face-inspector-title-copy"><h2>${escapeHtml(object.name)}</h2><p>SPACE · ${escapeHtml(shortId(object.id))}</p></div></div></div>
          <section class="inner-section"><div class="inner-section-title"><span>物件名稱</span></div><div class="workspace-name-row"><input id="workspaceNameInput" type="text" maxlength="80" value="${escapeHtml(object.name)}"/><button type="button" data-workspace-action="rename-object">套用</button></div></section>
          <section class="inner-section"><div class="inner-section-title"><span>空間資料</span></div><div class="workspace-property-grid"><div class="workspace-property-card"><span>寬度</span><strong>${escapeHtml(formatLength(object.data.width))}</strong></div><div class="workspace-property-card"><span>深度</span><strong>${escapeHtml(formatLength(object.data.depth))}</strong></div><div class="workspace-property-card"><span>高度</span><strong>${escapeHtml(formatLength(object.data.height))}</strong></div><div class="workspace-property-card"><span>邊界面</span><strong>${faceObjects.length} 個</strong></div></div></section>
          <section class="inner-section"><p class="inspector-note"><strong>空間是容器。</strong><br/>從左側或中央卡片選擇邊界面，就會再進入該面的內部幾何編輯器；返回時仍會回到這個空間。</p></section>
        </aside>
      </div>`;
    elements.workspaceToolStatus.textContent = '空間瀏覽';
    elements.workspaceSelectionStatus.textContent = `${faceObjects.length} 個邊界面`;
    elements.workspaceCoordinateStatus.textContent = object.data.coordinateSystem || 'WORLD';
    elements.workspaceZoomStatus.textContent = '空間層';
  }

  function facePointerToWorld(clientX, clientY, object = currentWorkspaceObject()) {
    const viewport = $('#faceEditorViewport', elements.workspaceContent);
    if (!viewport || !object || object.type !== 'face') return { x: 0, y: 0 };
    const rect = viewport.getBoundingClientRect();
    const camera = object.data.editor.camera;
    return {
      x: (clientX - rect.left - camera.x) / camera.scale,
      y: (clientY - rect.top - camera.y) / camera.scale
    };
  }

  function snapFacePoint(point, object = currentWorkspaceObject()) {
    if (!object || object.type !== 'face' || !object.data.editor.snap) return { x: round(point.x, 2), y: round(point.y, 2) };
    const grid = object.data.editor.gridSize;
    return { x: Math.round(point.x / grid) * grid, y: Math.round(point.y / grid) * grid };
  }

  function setFaceCameraScale(nextScale, clientX = null, clientY = null) {
    const object = currentWorkspaceObject();
    const viewport = $('#faceEditorViewport', elements.workspaceContent);
    if (!object || object.type !== 'face' || !viewport) return;
    const rect = viewport.getBoundingClientRect();
    const camera = object.data.editor.camera;
    const screenX = clientX == null ? rect.width / 2 : clientX - rect.left;
    const screenY = clientY == null ? rect.height / 2 : clientY - rect.top;
    const worldX = (screenX - camera.x) / camera.scale;
    const worldY = (screenY - camera.y) / camera.scale;
    const scale = clamp(nextScale, .08, 8);
    camera.scale = scale;
    camera.x = screenX - worldX * scale;
    camera.y = screenY - worldY * scale;
    camera.initialized = true;
    object.data.editor.initialized = true;
    renderFaceWorkspace();
    markDirty();
  }

  function fitFaceEditor(object = currentWorkspaceObject(), options = {}) {
    const viewport = $('#faceEditorViewport', elements.workspaceContent);
    if (!object || object.type !== 'face' || !viewport) return;
    ensureFaceData(object);
    const rect = viewport.getBoundingClientRect();
    if (rect.width < 20 || rect.height < 20) return;
    const bounds = polygonBounds(object.data.boundary);
    const padding = Math.min(110, Math.max(55, Math.min(rect.width, rect.height) * .14));
    const scale = clamp(Math.min((rect.width - padding * 2) / Math.max(1, bounds.width), (rect.height - padding * 2) / Math.max(1, bounds.height)), .08, 5);
    object.data.editor.camera.scale = scale;
    object.data.editor.camera.x = rect.width / 2 - bounds.centerX * scale;
    object.data.editor.camera.y = rect.height / 2 - bounds.centerY * scale;
    object.data.editor.initialized = true;
    renderFaceWorkspace();
    if (options.mark !== false) markDirty();
  }

  function pushFaceDragHistory(label, snapshot) {
    undoStack.push({ label, snapshot });
    if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }

  function beginFaceGeometryDrag(kind, event, data = {}) {
    const object = currentWorkspaceObject();
    if (!object || object.type !== 'face') return;
    faceDragState = {
      kind,
      objectId: object.id,
      label: data.label || '編輯面內幾何',
      startClientX: event.clientX,
      startClientY: event.clientY,
      startWorld: facePointerToWorld(event.clientX, event.clientY, object),
      snapshot: captureModel(),
      moved: false,
      ...data
    };
  }

  function insertFaceVertex(object, edgeIndex, point) {
    if (!object || object.type !== 'face') return;
    const snapped = snapFacePoint(point, object);
    let vertexId = null;
    commit('新增面輪廓頂點', () => {
      const vertex = { id: uid('vertex'), x: snapped.x, y: snapped.y };
      object.data.boundary.splice(edgeIndex + 1, 0, vertex);
      object.data.manualGeometry = true;
      object.updatedAt = nowIso();
      updateFaceDerived(object);
      vertexId = vertex.id;
      ui.faceSelection = { kind: 'vertex', id: vertex.id };
    });
    if (vertexId) toast('已在面輪廓新增一個頂點。');
  }

  function deleteFaceSelection() {
    const object = currentWorkspaceObject();
    const selection = ui.faceSelection;
    if (!object || object.type !== 'face' || !selection) return;
    if (selection.kind === 'vertex') {
      if (object.data.boundary.length <= 3) {
        toast('面輪廓至少需要三個頂點。', 'error');
        return;
      }
      commit('刪除面輪廓頂點', () => {
        object.data.boundary = object.data.boundary.filter((point) => point.id !== selection.id);
        object.data.manualGeometry = true;
        object.updatedAt = nowIso();
        updateFaceDerived(object);
        ui.faceSelection = { kind: 'boundary' };
      });
      return;
    }
    if (selection.kind === 'element') {
      const element = faceElementById(object, selection.id);
      if (!element) return;
      commit(`刪除${elementTypeLabel(element)}`, () => {
        object.data.elements = object.data.elements.filter((item) => item.id !== element.id);
        object.updatedAt = nowIso();
        ui.faceSelection = { kind: 'boundary' };
      });
    }
  }

  function renameWorkspaceObject() {
    const object = currentWorkspaceObject();
    const input = $('#workspaceNameInput', elements.workspaceContent);
    const name = input?.value.trim();
    if (!object || !name || name === object.name) return;
    commit('重新命名物件', () => {
      object.name = name;
      object.updatedAt = nowIso();
      if (object.type === 'space') syncBoundaryFaces(object);
    });
    toast(`已重新命名為「${name}」。`);
  }

  function renameFaceSelection() {
    const object = currentWorkspaceObject();
    const element = object?.type === 'face' && ui.faceSelection?.kind === 'element' ? faceElementById(object, ui.faceSelection.id) : null;
    const input = $('#selectionLabelInput', elements.workspaceContent);
    const label = input?.value.trim();
    if (!element || !label || label === element.label) return;
    commit(`重新命名${elementTypeLabel(element)}`, () => {
      element.label = label;
      object.updatedAt = nowIso();
    });
  }

  function handleWorkspaceClick(event) {
    const toolButton = event.target.closest('[data-face-tool]');
    if (toolButton) {
      event.preventDefault();
      setFaceTool(toolButton.dataset.faceTool);
      return;
    }
    const openButton = event.target.closest('[data-open-object]');
    if (openButton) {
      openObjectWorkspace(openButton.dataset.openObject, { pushCurrent: true, keepStack: true });
      return;
    }
    const layerButton = event.target.closest('[data-face-select-kind]');
    if (layerButton) {
      ui.faceSelection = layerButton.dataset.faceSelectKind === 'element'
        ? { kind: 'element', id: layerButton.dataset.elementId }
        : { kind: 'boundary' };
      renderFaceWorkspace();
      return;
    }
    const actionButton = event.target.closest('[data-workspace-action]');
    if (!actionButton) return;
    const action = actionButton.dataset.workspaceAction;
    if (action === 'face-zoom-in') setFaceCameraScale(currentWorkspaceObject()?.data.editor.camera.scale * 1.2);
    if (action === 'face-zoom-out') setFaceCameraScale(currentWorkspaceObject()?.data.editor.camera.scale / 1.2);
    if (action === 'face-fit') fitFaceEditor();
    if (action === 'rename-object') renameWorkspaceObject();
    if (action === 'rename-selection') renameFaceSelection();
    if (action === 'delete-face-selection') deleteFaceSelection();
  }

  function handleWorkspaceChange(event) {
    const object = currentWorkspaceObject();
    if (!object || object.type !== 'face') return;
    if (event.target.id === 'faceSnapToggle') object.data.editor.snap = event.target.checked;
    else if (event.target.id === 'faceGridToggle') object.data.editor.showGrid = event.target.checked;
    else if (event.target.id === 'faceGridSizeSelect') object.data.editor.gridSize = safeNumber(event.target.value, 25);
    else return;
    markDirty();
    renderFaceWorkspace();
  }

  function handleFacePointerDown(event) {
    const viewport = event.target.closest('#faceEditorViewport');
    const object = currentWorkspaceObject();
    if (!viewport || !object || object.type !== 'face') return;
    viewport.focus();
    const shouldPan = ui.faceTool === 'pan' || ui.faceSpacePressed || event.button === 1;
    if (shouldPan) {
      event.preventDefault();
      faceDragState = {
        kind: 'pan',
        objectId: object.id,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startX: object.data.editor.camera.x,
        startY: object.data.editor.camera.y
      };
      renderFaceWorkspace();
      return;
    }
    if (event.button !== 0) return;
    const hit = event.target.closest('[data-face-hit]');
    const rawPoint = facePointerToWorld(event.clientX, event.clientY, object);
    const point = snapFacePoint(rawPoint, object);
    ui.facePointer = point;

    if (ui.faceTool === 'vertex') {
      if (hit?.dataset.faceHit === 'edge') insertFaceVertex(object, Number(hit.dataset.edgeIndex), rawPoint);
      else toast('請點選面輪廓的其中一條邊。', 'error');
      event.preventDefault();
      return;
    }

    if (ui.faceTool === 'referenceLine' || ui.faceTool === 'opening') {
      event.preventDefault();
      ui.faceDraft = { kind: ui.faceTool, objectId: object.id, start: point, end: point };
      faceDragState = {
        kind: 'draft',
        objectId: object.id,
        startClientX: event.clientX,
        startClientY: event.clientY
      };
      renderFaceWorkspace();
      return;
    }

    if (ui.faceTool !== 'select') return;
    const hitKind = hit?.dataset.faceHit;
    if (hitKind === 'vertex') {
      const vertex = object.data.boundary.find((item) => item.id === hit.dataset.vertexId);
      if (!vertex) return;
      ui.faceSelection = { kind: 'vertex', id: vertex.id };
      beginFaceGeometryDrag('vertex', event, { vertexId: vertex.id, original: { x: vertex.x, y: vertex.y }, label: '拖曳面輪廓頂點' });
    } else if (hitKind === 'line-endpoint') {
      const element = faceElementById(object, hit.dataset.elementId);
      if (!element) return;
      ui.faceSelection = { kind: 'element', id: element.id };
      beginFaceGeometryDrag('line-endpoint', event, { elementId: element.id, endpoint: hit.dataset.endpoint, original: deepClone(element), label: '調整參考線端點' });
    } else if (hitKind === 'line') {
      const element = faceElementById(object, hit.dataset.elementId);
      if (!element) return;
      ui.faceSelection = { kind: 'element', id: element.id };
      beginFaceGeometryDrag('line-move', event, { elementId: element.id, original: deepClone(element), label: '移動參考線' });
    } else if (hitKind === 'opening-handle') {
      const element = faceElementById(object, hit.dataset.elementId);
      if (!element) return;
      ui.faceSelection = { kind: 'element', id: element.id };
      beginFaceGeometryDrag('opening-resize', event, { elementId: element.id, corner: hit.dataset.corner, original: deepClone(element), label: '調整開口尺寸' });
    } else if (hitKind === 'opening') {
      const element = faceElementById(object, hit.dataset.elementId);
      if (!element) return;
      ui.faceSelection = { kind: 'element', id: element.id };
      beginFaceGeometryDrag('opening-move', event, { elementId: element.id, original: deepClone(element), label: '移動開口' });
    } else if (hitKind === 'boundary' || hitKind === 'edge') {
      ui.faceSelection = { kind: 'boundary' };
    } else {
      ui.faceSelection = null;
    }
    event.preventDefault();
    renderFaceWorkspace();
  }

  function handleFaceDoubleClick(event) {
    const viewport = event.target.closest('#faceEditorViewport');
    const object = currentWorkspaceObject();
    if (!viewport || !object || object.type !== 'face' || ui.faceTool !== 'select') return;
    const edge = event.target.closest('[data-face-hit="edge"]');
    if (!edge) return;
    event.preventDefault();
    insertFaceVertex(object, Number(edge.dataset.edgeIndex), facePointerToWorld(event.clientX, event.clientY, object));
  }

  function updateFacePointerReadout(event) {
    const object = currentWorkspaceObject();
    const viewport = $('#faceEditorViewport', elements.workspaceContent);
    if (!object || object.type !== 'face' || !viewport) return;
    const rect = viewport.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) return;
    ui.facePointer = facePointerToWorld(event.clientX, event.clientY, object);
    const readout = $('#faceCoordinateReadout', elements.workspaceContent);
    if (readout) readout.textContent = `X: ${round(ui.facePointer.x, 1)} cm · Y: ${round(ui.facePointer.y, 1)} cm`;
    elements.workspaceCoordinateStatus.textContent = `X: ${round(ui.facePointer.x, 1)} · Y: ${round(ui.facePointer.y, 1)}`;
  }

  function handleFacePointerMove(event) {
    const drag = faceDragState;
    if (!drag) return false;
    const object = getObject(drag.objectId);
    if (!object || object.type !== 'face') {
      faceDragState = null;
      return false;
    }
    if (drag.kind === 'pan') {
      object.data.editor.camera.x = drag.startX + event.clientX - drag.startClientX;
      object.data.editor.camera.y = drag.startY + event.clientY - drag.startClientY;
      object.data.editor.initialized = true;
      renderFaceWorkspace();
      return true;
    }
    const rawPoint = facePointerToWorld(event.clientX, event.clientY, object);
    const point = snapFacePoint(rawPoint, object);
    ui.facePointer = rawPoint;
    if (drag.kind === 'draft') {
      if (ui.faceDraft) ui.faceDraft.end = point;
      renderFaceWorkspace();
      return true;
    }
    const screenDistance = Math.hypot(event.clientX - drag.startClientX, event.clientY - drag.startClientY);
    if (!drag.moved && screenDistance > 2) {
      drag.moved = true;
      pushFaceDragHistory(drag.label, drag.snapshot);
    }
    if (!drag.moved) return true;
    const deltaX = point.x - drag.startWorld.x;
    const deltaY = point.y - drag.startWorld.y;
    if (drag.kind === 'vertex') {
      const vertex = object.data.boundary.find((item) => item.id === drag.vertexId);
      if (vertex) {
        vertex.x = point.x;
        vertex.y = point.y;
        object.data.manualGeometry = true;
        updateFaceDerived(object);
      }
    } else {
      const element = faceElementById(object, drag.elementId);
      if (!element) return true;
      if (drag.kind === 'line-move') {
        element.x1 = drag.original.x1 + deltaX;
        element.y1 = drag.original.y1 + deltaY;
        element.x2 = drag.original.x2 + deltaX;
        element.y2 = drag.original.y2 + deltaY;
      }
      if (drag.kind === 'line-endpoint') {
        if (drag.endpoint === 'start') { element.x1 = point.x; element.y1 = point.y; }
        else { element.x2 = point.x; element.y2 = point.y; }
      }
      if (drag.kind === 'opening-move') {
        element.x = drag.original.x + deltaX;
        element.y = drag.original.y + deltaY;
      }
      if (drag.kind === 'opening-resize') {
        let left = drag.original.x;
        let right = drag.original.x + drag.original.width;
        let top = drag.original.y;
        let bottom = drag.original.y + drag.original.height;
        if (drag.corner.includes('w')) left = point.x;
        if (drag.corner.includes('e')) right = point.x;
        if (drag.corner.includes('n')) top = point.y;
        if (drag.corner.includes('s')) bottom = point.y;
        if (Math.abs(right - left) < 5) right = left + (right >= left ? 5 : -5);
        if (Math.abs(bottom - top) < 5) bottom = top + (bottom >= top ? 5 : -5);
        element.x = Math.min(left, right);
        element.y = Math.min(top, bottom);
        element.width = Math.abs(right - left);
        element.height = Math.abs(bottom - top);
      }
    }
    object.updatedAt = nowIso();
    renderFaceWorkspace();
    return true;
  }

  function handleFacePointerUp(event) {
    const drag = faceDragState;
    if (!drag) return false;
    const object = getObject(drag.objectId);
    faceDragState = null;
    const viewport = $('#faceEditorViewport', elements.workspaceContent);
    viewport?.classList.remove('is-panning');
    if (!object || object.type !== 'face') return true;
    if (drag.kind === 'pan') {
      markDirty();
      renderFaceWorkspace();
      return true;
    }
    if (drag.kind === 'draft') {
      const draft = ui.faceDraft;
      ui.faceDraft = null;
      if (!draft) { renderFaceWorkspace(); return true; }
      const end = draft.end || draft.start;
      const distance = Math.hypot(end.x - draft.start.x, end.y - draft.start.y);
      if (draft.kind === 'referenceLine' && distance >= 5) {
        let createdId = null;
        commit('建立面內參考線', () => {
          const count = object.data.elements.filter((item) => item.type === 'referenceLine').length + 1;
          const element = { id: uid('line'), type: 'referenceLine', label: `參考線 ${count}`, x1: draft.start.x, y1: draft.start.y, x2: end.x, y2: end.y };
          object.data.elements.push(element);
          object.updatedAt = nowIso();
          createdId = element.id;
          ui.faceSelection = { kind: 'element', id: element.id };
        });
        if (createdId) setFaceTool('select');
      } else if (draft.kind === 'opening' && Math.abs(end.x - draft.start.x) >= 5 && Math.abs(end.y - draft.start.y) >= 5) {
        let createdId = null;
        commit('建立面內開口', () => {
          const count = object.data.elements.filter((item) => item.type === 'opening').length + 1;
          const element = {
            id: uid('opening'), type: 'opening', label: `開口 ${count}`,
            x: Math.min(draft.start.x, end.x), y: Math.min(draft.start.y, end.y),
            width: Math.abs(end.x - draft.start.x), height: Math.abs(end.y - draft.start.y)
          };
          object.data.elements.push(element);
          object.updatedAt = nowIso();
          createdId = element.id;
          ui.faceSelection = { kind: 'element', id: element.id };
        });
        if (createdId) setFaceTool('select');
      } else {
        toast('拖曳距離太短，未建立面內物件。', 'error');
        renderFaceWorkspace();
      }
      return true;
    }
    if (drag.moved) {
      object.updatedAt = nowIso();
      updateFaceDerived(object);
      state.project.updatedAt = nowIso();
      markDirty();
      renderAll();
    } else {
      renderFaceWorkspace();
    }
    return true;
  }

  function handleFaceWheel(event) {
    const viewport = event.target.closest('#faceEditorViewport');
    const object = currentWorkspaceObject();
    if (!viewport || !object || object.type !== 'face') return;
    event.preventDefault();
    if (event.shiftKey) {
      object.data.editor.camera.x -= event.deltaY;
      object.data.editor.initialized = true;
      renderFaceWorkspace();
      markDirty();
      return;
    }
    const intensity = event.deltaMode === 1 ? .045 : .0015;
    setFaceCameraScale(object.data.editor.camera.scale * Math.exp(-event.deltaY * intensity), event.clientX, event.clientY);
  }

  function handleWorkspaceKeyboard(event, typing) {
    const object = currentWorkspaceObject();
    if (!object) return;
    if (typing) {
      if (event.key === 'Escape') event.target.blur();
      if (event.key === 'Enter' && event.target.id === 'workspaceNameInput') renameWorkspaceObject();
      if (event.key === 'Enter' && event.target.id === 'selectionLabelInput') renameFaceSelection();
      return;
    }
    if (event.key === 'Escape') {
      event.preventDefault();
      if (ui.faceDraft) { ui.faceDraft = null; faceDragState = null; renderFaceWorkspace(); }
      else if (ui.faceSelection) { ui.faceSelection = null; renderFaceWorkspace(); }
      else closeObjectWorkspace(false);
      return;
    }
    if (event.key === ' ') {
      event.preventDefault();
      ui.faceSpacePressed = true;
      if (object.type === 'face') renderFaceWorkspace();
      return;
    }
    if (object.type !== 'face') return;
    const key = event.key.toLowerCase();
    if (key === 'v') setFaceTool('select');
    if (key === 'p') setFaceTool('vertex');
    if (key === 'l') setFaceTool('referenceLine');
    if (key === 'r') setFaceTool('opening');
    if (key === 'h') setFaceTool('pan');
    if (key === 'f') fitFaceEditor();
    if (key === '1') setFaceCameraScale(1);
    if ((event.key === 'Delete' || event.key === 'Backspace') && ui.faceSelection) {
      event.preventDefault();
      deleteFaceSelection();
    }
  }


  function openDialog(dialogName) {
    closeDialogs(false);
    ui.dialog = dialogName;
    elements.modalBackdrop.hidden = false;
    const dialog = dialogName === 'object' ? elements.objectDialog : dialogName === 'view' ? elements.viewDialog : elements.relationDialog;
    dialog.hidden = false;
    requestAnimationFrame(() => {
      const focusable = dialog.querySelector('input:not([type="hidden"]), select, textarea, button');
      focusable?.focus();
    });
  }

  function closeDialogs(resetPending = true) {
    elements.modalBackdrop.hidden = true;
    elements.objectDialog.hidden = true;
    elements.viewDialog.hidden = true;
    elements.relationDialog.hidden = true;
    ui.dialog = null;
    if (resetPending) {
      ui.pendingRelation = null;
      ui.viewingObjectId = null;
    }
  }

  function selectedObjectTypeFromForm() {
    return $('input[name="objectType"]:checked', elements.objectForm)?.value || 'face';
  }

  function dynamicFieldsMarkup(type, editing = false) {
    if (type === 'space') {
      return `
        <label class="field"><span>寬度（cm）</span><input id="spaceWidthInput" name="width" type="number" min="1" step="0.1" required value="600" /></label>

        <label class="field"><span>座標系名稱</span><input id="spaceCoordinateInput" name="coordinateSystem" type="text" maxlength="60" value="ROOM-A" /></label>

  function setTypeChoice(type) {

  function renderDynamicFields(type, values = null, editing = false) {

      $('#spaceWidthInput').value = values.width ?? 600;

      $('#spaceHeightInput').value = values.height ?? 280;
      $('#spaceCoordinateInput').value = values.coordinateSystem ?? '';

      $('#faceWidthInput').value = values.width ?? 600;
      $('#faceHeightInput').value = values.height ?? 450;

  function openCreateObject(type = 'face') {
    elements.objectForm.reset();
    elements.editingObjectId.value = '';
    elements.objectTypeChooser.hidden = false;
    elements.objectDialogEyebrow.textContent = '建立領域物件';
    elements.objectDialogTitle.textContent = '建立物件';
    elements.submitObjectButton.innerHTML = `${icon('plus')}建立並放到畫布`;

    elements.objectNameInput.value = type === 'space' ? `新空間 ${state.objects.filter((object) => object.type === 'space').length + 1}` : `新面 ${state.objects.filter((object) => object.type === 'face').length + 1}`;

  function openEditObject(objectId) {
    openObjectWorkspace(objectId);

  function formObjectData(type) {
    if (type === 'space') {
      return {
        width: safeNumber($('#spaceWidthInput').value, 600),
        depth: safeNumber($('#spaceDepthInput').value, 450),
        height: safeNumber($('#spaceHeightInput').value, 280),
        coordinateSystem: $('#spaceCoordinateInput').value.trim() || 'WORLD'
      };
    }
    const width = safeNumber($('#faceWidthInput').value, 600);
    const height = safeNumber($('#faceHeightInput').value, 450);
    return {
      shape: 'rectangle',
      width,
      height,
      boundary: createRectangleBoundary(width, height),
      elements: [],
      editor: defaultFaceEditorState(),
      manualGeometry: false,
      elevation: safeNumber($('#faceElevationInput').value, 0),
      normal: $('#faceNormalInput').value,
      coordinateSystem: $('#faceCoordinateInput').value.trim() || 'WORLD'
    };
  }

  function submitObjectForm(event) {
    event.preventDefault();
    if (!elements.objectForm.reportValidity()) return;
    const editingId = elements.editingObjectId.value;
    const name = elements.objectNameInput.value.trim();
    const description = elements.objectDescriptionInput.value.trim();
    const type = editingId ? getObject(editingId)?.type : selectedObjectTypeFromForm();
    if (!type || !name) return;
    const data = formObjectData(type);
    if (Object.values(data).some((value) => typeof value === 'number' && !Number.isFinite(value))) {
      toast('請輸入有效尺寸。', 'error');
      return;
    }

    if (editingId) {
      const object = getObject(editingId);
      if (!object) return;
      commit('編輯物件', () => {
        const preserved = object.type === 'face'
          ? {
              boundaryRole: object.data.boundaryRole,
              orientation: object.data.orientation,
              generatedFromSpaceId: object.data.generatedFromSpaceId,
              boundary: object.data.boundary,
              elements: object.data.elements,
              editor: object.data.editor,
              manualGeometry: object.data.manualGeometry
            }
          : { boundaryFaceIds: object.data.boundaryFaceIds || [] };
        object.name = name;
        object.description = description;
        object.data = { ...data, ...preserved };
        object.updatedAt = nowIso();
        if (object.type === 'space') syncBoundaryFaces(object);
        ui.selectedObjectId = object.id;
      });
      closeDialogs();
      toast(`已更新「${name}」；所有畫布檢視同步更新。`);
      return;
    }

    let createdObjectId = null;
    commit('建立物件', () => {
      const object = createDomainObject(type, name, data, description);
      if (type === 'face') ensureFaceData(object);
      state.objects.push(object);
      if (type === 'space') {
        object.data.boundaryFaceIds = [];
        const createFaces = $('#createBoundaryFacesInput')?.checked !== false;
        if (createFaces) {
          const generated = createBoundaryFaces(object);
          state.objects.push(...generated.faceObjects);
          state.relations.push(...generated.relations);
        }
      }
      const node = addViewForObject(object.id);
      ui.selectedNodeId = node.id;
      ui.selectedObjectId = object.id;
      createdObjectId = object.id;
    });
    closeDialogs();
    toast(`已建立「${name}」；正在進入物件內部。`);
    if (createdObjectId) requestAnimationFrame(() => openObjectWorkspace(createdObjectId));
  }

  function openViewObject(objectId) {
    const object = getObject(objectId);
    if (!object) return;
    ui.viewingObjectId = object.id;
    elements.viewDialogTitle.textContent = object.name;
    const relations = state.relations.filter((relation) => relation.sourceObjectId === object.id || relation.targetObjectId === object.id);
    elements.viewDialogBody.innerHTML = `
      <div class="view-large-preview">${previewSvg(object, { large: true })}</div>
      <div class="view-details">
        <section class="view-detail-block"><h3>物件資訊</h3>${propertiesMarkup(object)}</section>
        ${object.description ? `<section class="view-detail-block"><h3>描述</h3><p class="description-box">${escapeHtml(object.description)}</p></section>` : ''}
        <section class="view-detail-block"><h3>關係摘要</h3><p class="description-box">${relations.length ? `此物件目前參與 ${relations.length} 個語意關係。` : '此物件尚未建立語意關係。'}</p></section>
      </div>`;
    openDialog('view');
  }

  function openRelationDialog() {
    const pending = ui.pendingRelation;
    const sourceNode = getNode(pending?.sourceNodeId);
    const targetNode = getNode(pending?.targetNodeId);
    const sourceObject = sourceNode ? getObject(sourceNode.objectId) : null;
    const targetObject = targetNode ? getObject(targetNode.objectId) : null;
    if (!sourceObject || !targetObject) return;
    const suggestedType = sourceObject.type === 'space' && targetObject.type === 'face' ? 'contains' : 'relatedTo';
    elements.relationTypeInput.value = suggestedType;
    elements.relationLabelInput.value = relationMeta(suggestedType).label;
    elements.relationEndpoints.innerHTML = `
      <div class="endpoint-card"><span class="type-icon ${escapeHtml(sourceObject.type)}">${icon(typeMeta(sourceObject.type).icon)}</span><span><strong>${escapeHtml(sourceObject.name)}</strong><small>來源</small></span></div>
      <span class="endpoint-arrow">${icon('arrowRight')}</span>
      <div class="endpoint-card"><span class="type-icon ${escapeHtml(targetObject.type)}">${icon(typeMeta(targetObject.type).icon)}</span><span><strong>${escapeHtml(targetObject.name)}</strong><small>目標</small></span></div>`;
    openDialog('relation');
  }

  function submitRelationForm(event) {
    event.preventDefault();
    const pending = ui.pendingRelation;
    const sourceNode = getNode(pending?.sourceNodeId);
    const targetNode = getNode(pending?.targetNodeId);
    const sourceObject = sourceNode ? getObject(sourceNode.objectId) : null;
    const targetObject = targetNode ? getObject(targetNode.objectId) : null;
    if (!sourceObject || !targetObject) {
      closeDialogs();
      return;
    }
    const type = elements.relationTypeInput.value;
    const label = elements.relationLabelInput.value.trim() || relationMeta(type).label;
    commit('建立語意關係', () => {
      state.relations.push({
        id: uid('rel'),

        label,
        sourceObjectId: sourceObject.id,
        targetObjectId: targetObject.id,
        sourceNodeId: sourceNode.id,

  function deleteRelation(relationId) {
    const relation = state.relations.find((item) => item.id === relationId);
    if (!relation) return;
    commit('刪除語意關係', () => {
      state.relations = state.relations.filter((item) => item.id !== relationId);

  function toggleNodeMode(nodeId) {
    const node = getNode(nodeId);
    if (!node) return;
    commit('切換檢視模式', () => {
      node.mode = node.mode === 'compact' ? 'preview' : 'compact';

      node.w = size.w;
      node.h = size.h;
    });

  function drawMinimap() {
    const canvas = elements.minimap;
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = window.devicePixelRatio || 1;
    const targetW = Math.round(rect.width * dpr);
    const targetH = Math.round(rect.height * dpr);
    if (canvas.width !== targetW || canvas.height !== targetH) {
      canvas.width = targetW;
      canvas.height = targetH;
    }
    const context = canvas.getContext('2d');
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    context.clearRect(0, 0, rect.width, rect.height);
    context.fillStyle = '#fbfcfd';
    context.fillRect(0, 0, rect.width, rect.height);

    const viewportRect = elements.viewport.getBoundingClientRect();
    const viewBounds = {
      minX: -state.camera.x / state.camera.scale,
      minY: -state.camera.y / state.camera.scale,
      maxX: (viewportRect.width - state.camera.x) / state.camera.scale,
      maxY: (viewportRect.height - state.camera.y) / state.camera.scale
    };
    const nodes = state.nodes.filter(isNodeVisible);
    const allMinX = Math.min(viewBounds.minX, ...nodes.map((node) => node.x));
    const allMinY = Math.min(viewBounds.minY, ...nodes.map((node) => node.y));
    const allMaxX = Math.max(viewBounds.maxX, ...nodes.map((node) => node.x + node.w));
    const allMaxY = Math.max(viewBounds.maxY, ...nodes.map((node) => node.y + node.h));
    const margin = 100;
    const bounds = { minX: allMinX - margin, minY: allMinY - margin, maxX: allMaxX + margin, maxY: allMaxY + margin };
    const worldW = Math.max(1, bounds.maxX - bounds.minX);
    const worldH = Math.max(1, bounds.maxY - bounds.minY);
    const padding = 7;
    const scale = Math.min((rect.width - padding * 2) / worldW, (rect.height - padding * 2) / worldH);
    const offsetX = (rect.width - worldW * scale) / 2 - bounds.minX * scale;
    const offsetY = (rect.height - worldH * scale) / 2 - bounds.minY * scale;
    const mapX = (x) => x * scale + offsetX;
    const mapY = (y) => y * scale + offsetY;
    ui.minimapTransform = { scale, offsetX, offsetY };

    context.lineWidth = 1;
    context.strokeStyle = '#d8dde6';
    for (const relation of state.relations) {
      const { source, target } = edgeNodesForRelation(relation);
      if (!source || !target) continue;
      context.beginPath();
      context.moveTo(mapX(source.x + source.w / 2), mapY(source.y + source.h / 2));
      context.lineTo(mapX(target.x + target.w / 2), mapY(target.y + target.h / 2));
      context.stroke();
    }

    for (const node of nodes) {
      const object = getObject(node.objectId);
      context.fillStyle = typeMeta(object?.type).color;
      context.globalAlpha = ui.selectedNodeId === node.id ? 1 : 0.72;
      context.fillRect(mapX(node.x), mapY(node.y), Math.max(3, node.w * scale), Math.max(2, node.h * scale));
    }
    context.globalAlpha = 1;
    context.strokeStyle = '#4e67e8';
    context.lineWidth = 1.2;
    context.fillStyle = 'rgba(78,103,232,.06)';
    const vx = mapX(viewBounds.minX);
    const vy = mapY(viewBounds.minY);
    const vw = Math.max(5, (viewBounds.maxX - viewBounds.minX) * scale);
    const vh = Math.max(5, (viewBounds.maxY - viewBounds.minY) * scale);
    context.fillRect(vx, vy, vw, vh);
    context.strokeRect(vx, vy, vw, vh);
  }

  function toast(message, type = 'success') {
    const item = document.createElement('div');
    item.className = `toast ${type}`;
    item.innerHTML = `${icon(type === 'error' ? 'warning' : 'check')}<span>${escapeHtml(message)}</span>`;
    elements.toastRegion.appendChild(item);
    setTimeout(() => item.remove(), 3200);
  }

  function exportProject() {
    saveNow();
    const payload = JSON.stringify({ ...state, exportedAt: nowIso() }, null, 2);
    const blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    anchor.href = url;
    anchor.download = `object-canvas-${date}.json`;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    URL.revokeObjectURL(url);
    toast('專案 JSON 已匯出。');
  }

  async function importProject(file) {
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed.objects) || !Array.isArray(parsed.nodes) || !Array.isArray(parsed.relations)) {
        throw new Error('檔案缺少 objects、nodes 或 relations。');
      }
      pushHistory('匯入專案');
      state = normalizeState(parsed);
      ui.selectedNodeId = null;
      ui.selectedObjectId = null;
      setTool('select');
      markDirty();
      renderAll();
      fitAll();
      toast(`已匯入 ${state.objects.length} 個物件。`);
    } catch (error) {
      console.error(error);
      toast(`匯入失敗：${error.message}`, 'error');
    } finally {
      elements.importFileInput.value = '';
    }
  }

  function loadDemo() {
    if (!window.confirm('載入示範會取代目前專案。是否繼續？')) return;
    pushHistory('載入示範');
    state = createDemoState();
    ui.selectedNodeId = null;
    ui.selectedObjectId = null;
    ui.connectSourceNodeId = null;
    setTool('select');
    markDirty();
    renderAll();
    setTimeout(fitAll, 10);
  }

  function newProject() {
    if (!window.confirm('確定清空目前專案嗎？你仍可使用「復原」取回內容。')) return;
    pushHistory('清空專案');
    const camera = state.camera;
    state = createEmptyState();
    state.camera = camera;
    ui.selectedNodeId = null;
    ui.selectedObjectId = null;
    ui.connectSourceNodeId = null;
    setTool('select');
    markDirty();
    renderAll();
  }

  function handleNodeLayerClick(event) {
    const nodeElement = event.target.closest('.canvas-node');
    if (!nodeElement) return;
    const nodeId = nodeElement.dataset.nodeId;
    const actionButton = event.target.closest('[data-node-action]');
    if (actionButton) {
      event.stopPropagation();
      const action = actionButton.dataset.nodeAction;
      const node = getNode(nodeId);
      const object = node ? getObject(node.objectId) : null;
      if (!node || !object) return;
      if (action === 'view') openViewObject(object.id);
      if (action === 'edit') openEditObject(object.id);
      if (action === 'toggle-mode') toggleNodeMode(node.id);
      return;
    }
    if (ui.tool === 'connect') {
      handleConnectNode(nodeId);
      return;
    }
    selectNode(nodeId);
  }

  function handleNodePointerDown(event) {
    if (event.button !== 0 || ui.tool !== 'select' || ui.spacePressed) return;
    const handle = event.target.closest('[data-drag-handle]');
    if (!handle || event.target.closest('button')) return;
    const nodeElement = handle.closest('.canvas-node');
    const node = getNode(nodeElement?.dataset.nodeId);
    if (!node) return;
    event.preventDefault();
    if (ui.selectedNodeId !== node.id) selectNode(node.id);
    const liveElement = elements.nodeLayer.querySelector(`[data-node-id="${node.id}"]`) || nodeElement;
    dragState = {
      nodeId: node.id,
      element: liveElement,
      startClientX: event.clientX,
      startClientY: event.clientY,
      startX: node.x,
      startY: node.y,
      moved: false,
      snapshot: captureModel()
    };
    liveElement.setPointerCapture?.(event.pointerId);
  }

  function handleViewportPointerDown(event) {
    if (event.target.closest('.canvas-node')) return;
    const shouldPan = ui.tool === 'pan' || ui.spacePressed || event.button === 1;
    if (shouldPan) {
      event.preventDefault();
      panState = {
        startClientX: event.clientX,
        startClientY: event.clientY,
        startX: state.camera.x,
        startY: state.camera.y
      };
      elements.viewport.classList.add('is-panning');
      return;
    }
    if (event.button === 0 && ui.tool === 'select') clearSelection();
  }

  function handlePointerMove(event) {
    if (ui.workspaceObjectId) updateFacePointerReadout(event);
    if (faceDragState && handleFacePointerMove(event)) return;
    if (dragState) {
      const node = getNode(dragState.nodeId);
      if (!node) return;
      const dx = (event.clientX - dragState.startClientX) / state.camera.scale;
      const dy = (event.clientY - dragState.startClientY) / state.camera.scale;
      if (!dragState.moved && Math.hypot(dx, dy) > 2) {
        dragState.moved = true;
        undoStack.push({ label: '移動畫布檢視', snapshot: dragState.snapshot });
        if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
        redoStack = [];
      }
      node.x = state.preferences.snap ? snapValue(dragState.startX + dx) : round(dragState.startX + dx, 1);
      node.y = state.preferences.snap ? snapValue(dragState.startY + dy) : round(dragState.startY + dy, 1);
      dragState.element.style.left = `${node.x}px`;
      dragState.element.style.top = `${node.y}px`;
      renderEdges();
      drawMinimap();
      return;
    }
    if (panState) {
      state.camera.x = panState.startX + event.clientX - panState.startClientX;
      state.camera.y = panState.startY + event.clientY - panState.startClientY;
      updateWorldTransform();
      drawMinimap();
    }
  }

  function handlePointerUp(event) {
    if (faceDragState && handleFacePointerUp(event)) return;
    if (dragState) {
      if (dragState.moved) {
        state.project.updatedAt = nowIso();
        markDirty();
        updateHistoryButtons();
        renderInspector();
        renderStatus();
      }
      dragState = null;
    }
    if (panState) {
      markDirty();
      panState = null;
      elements.viewport.classList.remove('is-panning');
    }
  }

  function handleWheel(event) {
    event.preventDefault();
    if (event.shiftKey) {
      state.camera.x -= event.deltaY;
      updateWorldTransform();
      drawMinimap();
      markDirty();
      return;
    }
    const intensity = event.deltaMode === 1 ? 0.045 : 0.0015;
    const factor = Math.exp(-event.deltaY * intensity);
    setCameraScale(state.camera.scale * factor, event.clientX, event.clientY);
  }

  function handleObjectListClick(event) {
    const row = event.target.closest('[data-object-id]');
    if (!row) return;
    const objectId = row.dataset.objectId;
    const action = event.target.closest('[data-list-action]')?.dataset.listAction;
    if (action === 'show') {
      event.stopPropagation();
      commit('新增畫布檢視', () => addViewForObject(objectId));
      return;
    }
    if (action === 'locate') {
      event.stopPropagation();
      const node = getNodesForObject(objectId)[0];
      if (node) selectNode(node.id, { center: true });
      return;
    }
    selectObject(objectId);
  }

  function handleInspectorClick(event) {
    const button = event.target.closest('[data-inspector-action]');
    if (!button) return;
    const action = button.dataset.inspectorAction;
    const object = getSelectedObject();
    if (!object) return;
    const targetObjectId = button.dataset.objectId;
    if (action === 'view') openViewObject(object.id);
    if (action === 'edit') openEditObject(object.id);
    if (action === 'duplicate-view') {
      const referenceNode = (ui.selectedNodeId && getNode(ui.selectedNodeId)?.objectId === object.id)
        ? getNode(ui.selectedNodeId)
        : getNodesForObject(object.id).at(-1);
      const position = referenceNode
        ? { x: referenceNode.x + referenceNode.w / 2 + 42, y: referenceNode.y + referenceNode.h / 2 + 42 }
        : null;
      commit('新增畫布檢視', () => addViewForObject(object.id, position));
      toast('已建立同一物件的另一個畫布檢視。');
    }
    if (action === 'show-object') {
      const id = targetObjectId || object.id;
      commit('新增畫布檢視', () => addViewForObject(id));
    }
    if (action === 'locate-object') {
      const node = getNodesForObject(targetObjectId)[0];
      if (node) selectNode(node.id, { center: true });
    }
    if (action === 'toggle-mode' && ui.selectedNodeId) toggleNodeMode(ui.selectedNodeId);
    if (action === 'remove-view' && ui.selectedNodeId) removeView(ui.selectedNodeId);
    if (action === 'delete-object') deleteObject(object.id);
    if (action === 'delete-relation') deleteRelation(button.dataset.relationId);
  }

  function handleKeyboard(event) {
    const target = event.target;
    const typing = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement || target.isContentEditable;
    const command = event.ctrlKey || event.metaKey;

    if (command && event.key.toLowerCase() === 'z') {
      event.preventDefault();
      event.shiftKey ? redo() : undo();
      return;
    }
    if (command && event.key.toLowerCase() === 'y') {
      event.preventDefault();
      redo();
      return;
    }
    if (command && event.key.toLowerCase() === 's') {
      event.preventDefault();
      saveNow();
      toast('已儲存到此瀏覽器。');
      return;
    }
    if (command && event.key.toLowerCase() === 'd' && !typing && !ui.workspaceObjectId) {
      event.preventDefault();
      const object = getSelectedObject();
      if (object) duplicateObject(object.id);
      return;
    }
    if (ui.workspaceObjectId) {
      handleWorkspaceKeyboard(event, typing);
      return;
    }
    if (event.key === 'Escape') {
      if (ui.dialog) closeDialogs();
      else if (ui.tool === 'connect') setTool('select');
      else clearSelection();
      return;
    }
    if (typing) return;
    if (event.key === ' ') {
      event.preventDefault();
      ui.spacePressed = true;
      renderToolState();
      return;
    }
    const key = event.key.toLowerCase();
    if (key === 'v') setTool('select');
    if (key === 'h') setTool('pan');
    if (key === 'c') setTool('connect');
    if (key === 'f') fitAll();
    if (key === '1') setCameraScale(1);
    if (key === '/') {
      event.preventDefault();
      elements.searchInput.focus();
    }
    if ((event.key === 'Delete' || event.key === 'Backspace') && ui.selectedNodeId) {
      event.preventDefault();
      removeView(ui.selectedNodeId);
    }
  }

  function handleKeyUp(event) {
    if (event.key === ' ' && ui.workspaceObjectId) {
      ui.faceSpacePressed = false;
      if (currentWorkspaceObject()?.type === 'face') renderFaceWorkspace();
      return;
    }
    if (event.key === ' ') {
      ui.spacePressed = false;
      renderToolState();
    }
  }

  function initializeEvents() {
    $$('[data-tool]').forEach((button) => button.addEventListener('click', () => setTool(button.dataset.tool)));
    $('#createButton').addEventListener('click', () => openCreateObject());
    $('#newObjectIconButton').addEventListener('click', () => openCreateObject());
    $('#emptyCreateButton').addEventListener('click', () => openCreateObject());
    $$('.quick-create').forEach((button) => button.addEventListener('click', () => openCreateObject(button.dataset.createType)));
    $('#fitButton').addEventListener('click', fitAll);
    $('#homeButton').addEventListener('click', () => {
      state.camera = { x: 240, y: 160, scale: 1 };
      updateWorldTransform();
      drawMinimap();
      markDirty();
    });
    $('#zoomInButton').addEventListener('click', () => setCameraScale(state.camera.scale * 1.18));
    $('#zoomOutButton').addEventListener('click', () => setCameraScale(state.camera.scale / 1.18));
    elements.zoomLevelButton.addEventListener('click', () => setCameraScale(1));
    elements.undoButton.addEventListener('click', undo);
    elements.redoButton.addEventListener('click', redo);
    $('#exportButton').addEventListener('click', exportProject);
    $('#importButton').addEventListener('click', () => elements.importFileInput.click());
    elements.importFileInput.addEventListener('change', () => importProject(elements.importFileInput.files?.[0]));
    $('#loadDemoButton').addEventListener('click', loadDemo);
    $('#newProjectButton').addEventListener('click', newProject);
    $('#showAllTypesButton').addEventListener('click', () => {
      ui.enabledTypes = new Set(['face', 'space']);
      $$('[data-filter-type]').forEach((input) => { input.checked = true; });
      renderAll();
    });
    $$('[data-filter-type]').forEach((input) => input.addEventListener('change', () => {
      if (input.checked) ui.enabledTypes.add(input.dataset.filterType);
      else ui.enabledTypes.delete(input.dataset.filterType);
      renderAll();
    }));
    elements.searchInput.addEventListener('input', () => {
      ui.search = elements.searchInput.value;
      renderObjectList();
      renderNodes();
      renderEdges();
      renderEmptyState();
      drawMinimap();
    });
    elements.snapToggle.addEventListener('change', () => {
      state.preferences.snap = elements.snapToggle.checked;
      markDirty();
    });
    elements.gridToggle.addEventListener('change', () => {
      state.preferences.showGrid = elements.gridToggle.checked;
      updateWorldTransform();
      markDirty();
    });

    elements.nodeLayer.addEventListener('click', handleNodeLayerClick);
    elements.nodeLayer.addEventListener('pointerdown', handleNodePointerDown);
    elements.nodeLayer.addEventListener('dblclick', (event) => {
      const node = getNode(event.target.closest('.canvas-node')?.dataset.nodeId);
      if (node && !event.target.closest('button')) openObjectWorkspace(node.objectId);
    });
    elements.viewport.addEventListener('pointerdown', handleViewportPointerDown);
    elements.viewport.addEventListener('wheel', handleWheel, { passive: false });
    elements.viewport.addEventListener('contextmenu', (event) => {
      if (panState || ui.tool === 'pan') event.preventDefault();
    });
    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerup', handlePointerUp);
    window.addEventListener('pointercancel', handlePointerUp);
    window.addEventListener('keydown', handleKeyboard);
    window.addEventListener('keyup', handleKeyUp);
    window.addEventListener('blur', () => {
      ui.spacePressed = false;
      ui.faceSpacePressed = false;
      handlePointerUp();
      renderToolState();
      if (currentWorkspaceObject()?.type === 'face') renderFaceWorkspace();
    });
    window.addEventListener('resize', () => {
      updateWorldTransform();
      drawMinimap();
      if (currentWorkspaceObject()?.type === 'face') renderFaceWorkspace();
    });

    elements.objectList.addEventListener('click', handleObjectListClick);
    elements.inspectorContent.addEventListener('click', handleInspectorClick);
    elements.objectForm.addEventListener('submit', submitObjectForm);
    elements.relationForm.addEventListener('submit', submitRelationForm);
    elements.viewEditButton.addEventListener('click', () => {
      const objectId = ui.viewingObjectId;
      closeDialogs(false);
      if (objectId) openEditObject(objectId);
    });
    elements.relationTypeInput.addEventListener('change', () => {
      elements.relationLabelInput.value = relationMeta(elements.relationTypeInput.value).label;
    });
    $$('input[name="objectType"]', elements.objectForm).forEach((input) => input.addEventListener('change', () => {
      if (!input.checked) return;
      setTypeChoice(input.value);
      renderDynamicFields(input.value, null, false);
      elements.objectNameInput.value = input.value === 'space'
        ? `新空間 ${state.objects.filter((object) => object.type === 'space').length + 1}`
        : `新面 ${state.objects.filter((object) => object.type === 'face').length + 1}`;
    }));
    $$('[data-close-dialog]').forEach((button) => button.addEventListener('click', () => closeDialogs()));
    elements.modalBackdrop.addEventListener('click', () => closeDialogs());
    elements.cancelConnectButton.addEventListener('click', () => setTool('select'));

    elements.workspaceBackButton.addEventListener('click', () => closeObjectWorkspace(false));
    elements.workspaceDoneButton.addEventListener('click', () => closeObjectWorkspace(true));
    elements.workspaceFitButton.addEventListener('click', () => fitFaceEditor());
    elements.faceUndoButton.addEventListener('click', undo);
    elements.faceRedoButton.addEventListener('click', redo);
    elements.objectWorkspace.addEventListener('click', handleWorkspaceClick);
    elements.objectWorkspace.addEventListener('change', handleWorkspaceChange);
    elements.objectWorkspace.addEventListener('pointerdown', handleFacePointerDown);
    elements.objectWorkspace.addEventListener('dblclick', handleFaceDoubleClick);
    elements.objectWorkspace.addEventListener('wheel', handleFaceWheel, { passive: false });
    elements.objectWorkspace.addEventListener('contextmenu', (event) => {
      if (event.target.closest('#faceEditorViewport')) event.preventDefault();
    });

    elements.minimap.addEventListener('click', (event) => {
      const transform = ui.minimapTransform;
      if (!transform) return;
      const rect = elements.minimap.getBoundingClientRect();
      const worldX = (event.clientX - rect.left - transform.offsetX) / transform.scale;
      const worldY = (event.clientY - rect.top - transform.offsetY) / transform.scale;
      const viewportRect = elements.viewport.getBoundingClientRect();
      state.camera.x = viewportRect.width / 2 - worldX * state.camera.scale;
      state.camera.y = viewportRect.height / 2 - worldY * state.camera.scale;
      updateWorldTransform();
      drawMinimap();
      markDirty();
    });
  }

  function init() {
    hydrateIcons();
    initializeEvents();
    renderAll();
    requestAnimationFrame(() => {
      if (!hasStoredState()) fitAll();
      else drawMinimap();
    });
    window.objectCanvasDebug = {
      getState: () => deepClone(state),
      createDemoState,
      exportProject,
      fitAll,
      openObjectWorkspace,
      closeObjectWorkspace,
      fitFaceEditor,
      getWorkspaceObject: () => deepClone(currentWorkspaceObject()),
      getUi: () => deepClone({ workspaceObjectId: ui.workspaceObjectId, faceTool: ui.faceTool, faceSelection: ui.faceSelection })
    };
  }

  init();
})();

</script>
</body>
</html>
