<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>構形 Canvas｜語意物件無限畫布</title>
  <style>
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --panel-muted: #f7f8fa;
  --canvas: #f8fafc;
  --ink: #172033;
  --muted: #6b7485;
  --faint: #98a1b2;
  --border: #dfe4eb;
  --border-strong: #cdd4df;
  --accent: #4e67e8;
  --accent-strong: #3d54d4;
  --accent-soft: #eef1ff;
  --face: #2f8f7b;
  --face-soft: #e8f7f2;
  --space: #7557cc;
  --space-soft: #f0ecff;
  --danger: #c2414f;
  --danger-soft: #fff0f2;
  --warning: #b96a16;
  --shadow-sm: 0 1px 2px rgba(22, 31, 50, .06), 0 1px 5px rgba(22, 31, 50, .04);
  --shadow-md: 0 12px 34px rgba(24, 33, 51, .12), 0 3px 10px rgba(24, 33, 51, .08);
  --shadow-node: 0 8px 24px rgba(30, 42, 65, .09), 0 2px 6px rgba(30, 42, 65, .07);
  --radius: 12px;
  --topbar-h: 58px;
  --statusbar-h: 28px;
  --left-w: 242px;
  --right-w: 326px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color: var(--ink);
  background: var(--bg);
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { font-size: 14px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
button { border: 0; }
button, label, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid rgba(78, 103, 232, .55);
  outline-offset: 2px;
}
svg { display: block; }
[hidden] { display: none !important; }

.app-shell { display: grid; grid-template-rows: var(--topbar-h) 1fr var(--statusbar-h); width: 100%; height: 100%; }
.topbar {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto minmax(360px, 1fr);
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  background: rgba(255, 255, 255, .96);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}
.brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #1f2a44; color: white; }
.brand-mark svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
.brand-copy { display: flex; flex-direction: column; min-width: 0; }
.brand-copy strong { font-size: 14px; letter-spacing: -.01em; }
.brand-copy small { font-size: 10.5px; color: var(--muted); margin-top: -1px; }
.tool-group { justify-self: center; display: flex; align-items: center; gap: 3px; padding: 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-muted); }
.tool-button, .icon-button, .secondary-button, .primary-button, .text-button, .zoom-level {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; white-space: nowrap;
}
.tool-button { height: 34px; padding: 0 10px; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
.tool-button:hover { color: var(--ink); background: white; }
.tool-button.active { color: var(--accent-strong); background: white; box-shadow: var(--shadow-sm); }
.tool-button svg, .icon-button svg, .secondary-button svg, .primary-button svg, .search-control svg, .statusbar svg { width: 16px; height: 16px; }
.icon-button { width: 34px; height: 34px; border-radius: 8px; background: transparent; color: var(--muted); }
.icon-button:hover:not(:disabled) { background: var(--panel-muted); color: var(--ink); }
.icon-button:disabled { opacity: .35; cursor: default; }
.icon-button.compact { width: 28px; height: 28px; }
.toolbar-separator { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
.toolbar-separator.vertical { height: 22px; }
.top-actions { justify-self: end; display: flex; align-items: center; gap: 7px; min-width: 0; }
.search-control { width: min(220px, 18vw); height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-muted); color: var(--muted); }
.search-control:focus-within { border-color: rgba(78,103,232,.55); box-shadow: 0 0 0 3px rgba(78,103,232,.1); background: white; }
.search-control input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12px; }
.search-control kbd { padding: 1px 5px; border: 1px solid var(--border); border-radius: 5px; background: white; font-size: 10px; color: var(--faint); }
.secondary-button, .primary-button { height: 34px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 650; }
.secondary-button { border: 1px solid var(--border); background: white; color: #3c4658; }
.secondary-button:hover { border-color: var(--border-strong); background: var(--panel-muted); }
.primary-button { background: var(--accent); color: white; box-shadow: 0 1px 2px rgba(45, 65, 170, .2); }
.primary-button:hover { background: var(--accent-strong); }
.primary-button.danger { background: var(--danger); }
.text-button { padding: 0; background: transparent; color: var(--accent); font-size: 11px; font-weight: 650; }

.workspace { min-height: 0; display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w); }
.sidebar { min-width: 0; background: var(--panel); z-index: 10; overflow: hidden; }
.sidebar-left { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
.sidebar-right { border-left: 1px solid var(--border); overflow-y: auto; }
.sidebar-section { padding: 16px 14px; border-bottom: 1px solid var(--border); }
.section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.section-heading h2 { margin: 0; font-size: 13px; letter-spacing: -.01em; }
.section-heading p { margin: 2px 0 0; font-size: 10.5px; color: var(--muted); }
.quick-create-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 13px; }
.quick-create { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 9px 8px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); text-align: left; cursor: pointer; }
.quick-create:hover { border-color: #bdc6d4; background: var(--panel-muted); }
.quick-create > span:last-child { min-width: 0; display: flex; flex-direction: column; }
.quick-create strong { font-size: 11.5px; }
.quick-create small { font-size: 9.5px; color: var(--muted); }
.type-icon { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; }
.type-icon svg { width: 17px; height: 17px; }
.type-icon.face { background: var(--face-soft); color: var(--face); }
.type-icon.space { background: var(--space-soft); color: var(--space); }
.section-label-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.section-label { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .075em; }
.filter-row { display: grid; grid-template-columns: 15px 8px 1fr auto; align-items: center; gap: 8px; min-height: 30px; color: #495366; font-size: 11.5px; cursor: pointer; }
.filter-row input { margin: 0; accent-color: var(--accent); }
.filter-row .dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.face { background: var(--face); }
.dot.space { background: var(--space); }
.filter-row strong { min-width: 20px; padding: 1px 6px; border-radius: 9px; background: var(--panel-muted); color: var(--muted); font-size: 9.5px; text-align: center; }
.object-tree-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.count-badge { min-width: 22px; padding: 1px 7px; border-radius: 10px; background: var(--panel-muted); color: var(--muted); font-size: 10px; text-align: center; }
.object-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -5px; padding: 0 5px 12px; }
.object-row { display: grid; grid-template-columns: 27px minmax(0, 1fr) 25px; align-items: center; gap: 8px; min-height: 39px; padding: 4px 4px; border-radius: 8px; cursor: pointer; }
.object-row:hover { background: var(--panel-muted); }
.object-row.selected { background: var(--accent-soft); }
.object-row .row-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 7px; }
.object-row .row-icon svg { width: 15px; height: 15px; }
.object-row .row-icon.face { background: var(--face-soft); color: var(--face); }
.object-row .row-icon.space { background: var(--space-soft); color: var(--space); }
.object-row .row-copy { min-width: 0; display: flex; flex-direction: column; }
.object-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 650; }
.object-row small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5px; color: var(--muted); }
.object-row .show-view { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 6px; background: transparent; color: var(--faint); cursor: pointer; }
.object-row .show-view:hover { background: white; color: var(--accent); }
.object-row .show-view svg { width: 14px; height: 14px; }
.object-list-empty { padding: 22px 8px; color: var(--muted); font-size: 11px; text-align: center; }
.canvas-options-section { padding-top: 12px; padding-bottom: 12px; }
.switch-row { display: flex; align-items: center; min-height: 31px; font-size: 11.5px; color: #495366; cursor: pointer; }
.switch-row > span:first-child { flex: 1; }
.switch-row input { position: absolute; opacity: 0; pointer-events: none; }
.switch-ui { position: relative; width: 31px; height: 17px; border-radius: 12px; background: #cdd3dd; transition: .18s ease; }
.switch-ui::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .18s ease; }
.switch-row input:checked + .switch-ui { background: var(--accent); }
.switch-row input:checked + .switch-ui::after { transform: translateX(14px); }
.project-utility-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }
.project-utility-row button { height: 27px; border: 1px solid var(--border); border-radius: 7px; background: white; color: var(--muted); font-size: 9.5px; font-weight: 650; cursor: pointer; }
.project-utility-row button:hover { background: var(--panel-muted); color: var(--ink); }

.canvas-viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; background-color: var(--canvas); cursor: default; outline: none; --grid-size: 24px; --grid-major: 120px; --grid-x: 0px; --grid-y: 0px; }
.canvas-viewport.show-grid {
  background-image:
    linear-gradient(rgba(103, 116, 139, .10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(103, 116, 139, .10) 1px, transparent 1px),
    linear-gradient(rgba(103, 116, 139, .055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(103, 116, 139, .055) 1px, transparent 1px);
  background-size: var(--grid-major) var(--grid-major), var(--grid-major) var(--grid-major), var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size);
  background-position: var(--grid-x) var(--grid-y), var(--grid-x) var(--grid-y), var(--grid-x) var(--grid-y), var(--grid-x) var(--grid-y);
}
.canvas-viewport.tool-pan, .canvas-viewport.space-pan { cursor: grab; }
.canvas-viewport.is-panning { cursor: grabbing; }
.canvas-viewport.tool-connect { cursor: crosshair; }
.canvas-world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; will-change: transform; }
.edge-layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edge-path { fill: none; stroke: #929bad; stroke-width: 1.6; vector-effect: non-scaling-stroke; marker-end: url(#arrowhead); }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; vector-effect: non-scaling-stroke; }
.edge-label-bg { fill: rgba(255, 255, 255, .94); stroke: #d8dde5; stroke-width: 1; vector-effect: non-scaling-stroke; }
.edge-label { fill: #596376; font-size: 10px; font-weight: 650; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.edge-group-item.selected .edge-path { stroke: var(--accent); stroke-width: 2.2; }
#arrowhead path { fill: #929bad; }
.node-layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; }
.canvas-node { position: absolute; display: flex; flex-direction: column; border: 1px solid #d5dbe5; border-radius: 13px; background: rgba(255,255,255,.98); box-shadow: var(--shadow-node); overflow: hidden; user-select: none; transform: translateZ(0); }
.canvas-node:hover { border-color: #bcc5d4; }
.canvas-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(78,103,232,.15), var(--shadow-node); }
.canvas-node.connect-source { border-color: var(--warning); box-shadow: 0 0 0 3px rgba(185,106,22,.14), var(--shadow-node); }
.canvas-node.search-hidden, .canvas-node.type-hidden { display: none; }
.node-header { flex: 0 0 auto; display: flex; align-items: center; gap: 9px; min-height: 47px; padding: 8px 10px; border-bottom: 1px solid #e8ebf0; cursor: move; background: #fff; }
.node-header-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.node-header-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; letter-spacing: -.01em; }
.node-header-copy small { font-size: 9.5px; color: var(--muted); }
.node-menu-button { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: transparent; color: var(--faint); cursor: pointer; }
.node-menu-button:hover { background: var(--panel-muted); color: var(--ink); }
.node-menu-button svg { width: 15px; height: 15px; }
.node-body { flex: 1; min-height: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.preview-stage { position: relative; flex: 1; min-height: 90px; display: grid; place-items: center; border-radius: 9px; overflow: hidden; background: #f7f9fb; border: 1px solid #e9edf2; }
.preview-stage svg { width: 100%; height: 100%; min-height: 90px; }
.preview-metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px; }
.preview-metric { min-width: 0; padding: 6px 7px; border-radius: 7px; background: var(--panel-muted); }
.preview-metric span { display: block; color: var(--muted); font-size: 8.5px; }
.preview-metric strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; font-size: 10.5px; }
.node-footer { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 10px; border-top: 1px solid #e8ebf0; background: #fbfcfd; }
.node-action { height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 7px; background: transparent; color: #4f5a6d; font-size: 10px; font-weight: 650; cursor: pointer; }
.node-action:hover { background: white; box-shadow: var(--shadow-sm); color: var(--accent); }
.node-action svg { width: 13px; height: 13px; }
.node-compact .node-body { padding: 9px 11px; }
.node-compact .compact-summary { display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 10px; }
.node-compact .compact-summary strong { color: var(--ink); font-size: 11px; }
.node-compact .node-footer { display: none; }
.zoom-low .canvas-node:not(.selected) .node-body, .zoom-low .canvas-node:not(.selected) .node-footer { display: none; }
.zoom-low .canvas-node:not(.selected) { height: 48px !important; }
.zoom-low .canvas-node:not(.selected) .node-header { border-bottom: 0; }

.empty-state { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; pointer-events: none; }
.empty-state > * { pointer-events: auto; }
.empty-state h2 { margin: 15px 0 5px; font-size: 18px; letter-spacing: -.025em; }
.empty-state p { max-width: 420px; margin: 0 0 17px; color: var(--muted); font-size: 12px; }
.empty-illustration { position: relative; width: 120px; height: 80px; }
.empty-tile { position: absolute; display: block; width: 64px; height: 42px; border: 1px solid #c9d1dd; border-radius: 9px; background: white; box-shadow: var(--shadow-sm); }
.tile-a { left: 4px; top: 24px; transform: rotate(-5deg); }
.tile-b { right: 3px; top: 5px; transform: rotate(5deg); }
.empty-line { position: absolute; left: 45px; top: 38px; width: 42px; height: 1px; background: var(--accent); transform: rotate(-12deg); }
.connection-hint { position: absolute; top: 14px; left: 50%; z-index: 8; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #ead5bd; border-radius: 9px; background: #fff9f0; box-shadow: var(--shadow-sm); color: #80511c; font-size: 11px; font-weight: 600; }
.connection-hint svg { width: 15px; height: 15px; }
.connection-hint button { padding: 3px 7px; border-radius: 6px; background: rgba(185,106,22,.1); color: inherit; cursor: pointer; font-size: 10px; }
.canvas-controls { position: absolute; left: 14px; bottom: 14px; z-index: 7; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: rgba(255,255,255,.94); box-shadow: var(--shadow-sm); }
.canvas-controls .icon-button { width: 29px; height: 29px; }
.zoom-level { width: 50px; height: 28px; border-radius: 6px; background: transparent; color: #4b5668; font-size: 10px; font-weight: 650; }
.zoom-level:hover { background: var(--panel-muted); }
.minimap-shell { position: absolute; right: 14px; bottom: 14px; z-index: 7; width: 166px; height: 104px; border: 1px solid var(--border); border-radius: 10px; background: rgba(255,255,255,.92); box-shadow: var(--shadow-sm); overflow: hidden; }
.minimap-shell canvas { width: 100%; height: 100%; cursor: crosshair; }
.minimap-shell > span { position: absolute; left: 7px; bottom: 5px; padding: 1px 4px; border-radius: 4px; background: rgba(255,255,255,.82); color: var(--faint); font-size: 8px; pointer-events: none; }

.inspector-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; text-align: center; }
.inspector-empty-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 13px; background: var(--panel-muted); color: var(--faint); }
.inspector-empty-icon svg { width: 23px; height: 23px; }
.inspector-empty h2 { margin: 14px 0 5px; font-size: 14px; }
.inspector-empty p { max-width: 230px; margin: 0; color: var(--muted); font-size: 11px; }
.inspector-content { min-height: 100%; }
.inspector-hero { padding: 16px; border-bottom: 1px solid var(--border); }
.inspector-title-row { display: flex; align-items: flex-start; gap: 10px; }
.inspector-title-copy { flex: 1; min-width: 0; }
.inspector-title-copy h2 { margin: 0; overflow-wrap: anywhere; font-size: 15px; letter-spacing: -.015em; }
.inspector-title-copy p { margin: 2px 0 0; color: var(--muted); font-size: 10px; }
.inspector-preview { height: 165px; margin-top: 13px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #f8fafc; }
.inspector-preview svg { width: 100%; height: 100%; }
.inspector-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 11px; }
.inspector-actions button { height: 32px; }
.inspector-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.inspector-section h3 { margin: 0 0 10px; color: var(--muted); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; }
.property-list { display: grid; gap: 8px; }
.property-row { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 10px; align-items: baseline; }
.property-row dt { color: var(--muted); font-size: 10px; }
.property-row dd { margin: 0; overflow-wrap: anywhere; text-align: right; color: #384356; font-size: 10.5px; font-weight: 600; }
.description-box { margin: 0; padding: 9px 10px; border-radius: 8px; background: var(--panel-muted); color: #4f5a6c; font-size: 10.5px; white-space: pre-wrap; }
.relation-list { display: grid; gap: 6px; }
.relation-row { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 7px; border: 1px solid var(--border); border-radius: 8px; }
.relation-direction { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: var(--panel-muted); color: var(--muted); }
.relation-direction svg { width: 13px; height: 13px; }
.relation-copy { min-width: 0; display: flex; flex-direction: column; }
.relation-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.relation-copy small { font-size: 8.5px; color: var(--muted); }
.relation-delete { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 6px; background: transparent; color: var(--faint); cursor: pointer; }
.relation-delete:hover { background: var(--danger-soft); color: var(--danger); }
.relation-delete svg { width: 12px; height: 12px; }
.inspector-danger-zone { padding: 14px 16px 20px; }
.inspector-danger-zone button { width: 100%; height: 31px; border: 1px solid #f0cbd0; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font-size: 10.5px; font-weight: 650; cursor: pointer; }
.inspector-danger-zone button:hover { background: #ffe5e9; }
.boundary-list { display: grid; gap: 5px; }
.boundary-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 7px; border-radius: 7px; background: var(--panel-muted); }
.boundary-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9.5px; }
.boundary-row button { padding: 3px 6px; border-radius: 5px; background: white; color: var(--accent); font-size: 8.5px; font-weight: 650; cursor: pointer; }

.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(19, 27, 43, .38); backdrop-filter: blur(2px); }
.dialog { position: fixed; left: 50%; top: 50%; z-index: 60; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 36px)); max-height: calc(100vh - 36px); display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,.55); border-radius: 14px; background: white; box-shadow: 0 24px 70px rgba(17, 27, 49, .24), 0 6px 18px rgba(17, 27, 49, .12); overflow: hidden; }

.dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 17px 19px 13px; border-bottom: 1px solid var(--border); }
.dialog-header h2 { margin: 2px 0 0; font-size: 17px; letter-spacing: -.02em; }
.dialog-eyebrow { color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: .085em; text-transform: uppercase; }

.dialog-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 19px; border-top: 1px solid var(--border); background: #fbfcfd; }
.type-chooser { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 16px; padding: 0; border: 0; }
.type-chooser legend { grid-column: 1 / -1; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 650; }
.type-choice { position: relative; display: grid; grid-template-columns: 37px minmax(0, 1fr) 18px; align-items: center; gap: 9px; min-height: 65px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
.type-choice:hover { border-color: var(--border-strong); }
.type-choice.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px rgba(78,103,232,.08); }

.choice-check svg { width: 11px; height: 11px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dynamic-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { min-width: 0; display: flex; flex-direction: column; gap: 5px; }

.field > span { color: #4e596c; font-size: 10.5px; font-weight: 650; }

.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: white; font-size: 11.5px; transition: .15s ease; }
.field input, .field select { height: 36px; padding: 0 10px; }
.field textarea { min-height: 72px; padding: 9px 10px; resize: vertical; }

}

.checkbox-field { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-muted); cursor: pointer; }
.checkbox-field input { margin-top: 2px; accent-color: var(--accent); }

.view-dialog-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(240px, .85fr); gap: 18px; }

.relation-endpoints { display: grid; grid-template-columns: minmax(0,1fr) 34px minmax(0,1fr); align-items: center; gap: 8px; margin-bottom: 15px; }
.endpoint-card { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 9px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-muted); }
.endpoint-card .type-icon { width: 27px; height: 27px; }
.endpoint-card .type-icon svg { width: 15px; height: 15px; }
.endpoint-card span:last-child { min-width: 0; display: flex; flex-direction: column; }
.endpoint-card strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; }
.endpoint-card small { font-size: 8.5px; color: var(--muted); }
.endpoint-arrow { display: grid; place-items: center; color: var(--muted); }

.toast-region { position: fixed; right: 18px; bottom: 42px; z-index: 100; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
.toast { min-width: 220px; max-width: 340px; display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: rgba(255,255,255,.97); box-shadow: var(--shadow-md); color: #3e495b; font-size: 10.5px; animation: toast-in .18s ease both; }

@media (max-width: 1160px) {
  :root { --left-w: 210px; --right-w: 290px; }

}

@media (max-width: 900px) {

}

@media (max-width: 680px) {

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

.selection-data-row span { color: var(--muted); }
.selection-data-row strong { color: #3e495c; font-size: 10px; font-variant-numeric: tabular-nums; }
.selection-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.selection-actions button { min-height: 31px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; background: #fff; color: #4f5a6c; font-size: 9px; font-weight: 650; cursor: pointer; }
.selection-actions button:hover { background: var(--panel-muted); }
.selection-actions button.danger { border-color: #efcdd2; background: var(--danger-soft); color: var(--danger); }
.inspector-note { margin: 0; padding: 9px 10px; border-radius: 8px; background: #f2f7f5; color: #52635e; font-size: 9.5px; line-height: 1.5; }
.inspector-note strong { color: #2f6f60; }

.space-workspace-layout {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 250px minmax(0,1fr) 310px;
  background: #eef1f5;
}
.space-boundary-panel { border-right: 1px solid var(--border); }
.space-info-panel { border-left: 1px solid var(--border); overflow-y: auto; }
.space-boundary-list { display: grid; gap: 5px; }
.space-boundary-button {
  min-height: 46px;
  display: grid;
  grid-template-columns: 31px minmax(0,1fr) 16px;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.space-boundary-button:hover { border-color: var(--border); background: var(--panel-muted); }
.space-boundary-button .type-icon { width: 31px; height: 31px; }
.space-boundary-button-copy { min-width: 0; display: flex; flex-direction: column; }
.space-boundary-button-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10.5px; }
.space-boundary-button-copy small { color: var(--muted); font-size: 8.5px; }
.space-boundary-button > svg { width: 14px; height: 14px; color: var(--faint); }
.space-workspace-stage { min-width: 0; min-height: 0; overflow: auto; padding: 26px; background: #f8fafc; }
.space-hero-preview { max-width: 760px; height: 330px; margin: 0 auto 20px; overflow: hidden; border: 1px solid var(--border); border-radius: 13px; background: #fff; box-shadow: var(--shadow-sm); }
.space-hero-preview svg { width: 100%; height: 100%; }
.space-face-grid { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(190px,1fr)); gap: 12px; }
.space-face-card { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 11px; background: #fff; box-shadow: var(--shadow-sm); }
.space-face-preview { height: 126px; border-bottom: 1px solid var(--border); background: #f7f9fb; }
.space-face-preview svg { width: 100%; height: 100%; }
.space-face-card-body { padding: 10px; }
.space-face-card-body h3 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.space-face-card-body p { margin: 3px 0 9px; color: var(--muted); font-size: 9px; }
.space-face-card-body button { width: 100%; height: 30px; border-radius: 7px; background: var(--space-soft); color: var(--space); font-size: 9.5px; font-weight: 700; cursor: pointer; }
.space-face-card-body button:hover { background: #e8e1ff; }

@media (max-width: 1180px) {
  .object-workspace-topbar { grid-template-columns: minmax(230px,1fr) auto minmax(185px,1fr); gap: 7px; }
  .workspace-tool span:last-child { display: none; }
  .workspace-tool { width: 34px; padding: 0; }
  .face-workspace-layout { grid-template-columns: 210px minmax(0,1fr) 284px; }
  .space-workspace-layout { grid-template-columns: 220px minmax(0,1fr) 280px; }
}
@media (max-width: 900px) {
  .object-workspace-topbar { grid-template-columns: auto 1fr auto; }
  .workspace-title-copy, .workspace-trail-divider, #workspaceTypeIcon { display: none; }
  .face-workspace-tools { justify-self: center; }
  .object-workspace-actions .secondary-button { display: none; }
  .face-workspace-layout { grid-template-columns: minmax(0,1fr) 270px; }
  .face-layer-panel { display: none; }
  .space-workspace-layout { grid-template-columns: minmax(0,1fr) 270px; }
  .space-boundary-panel { display: none; }
  .space-face-grid { grid-template-columns: repeat(2,minmax(180px,1fr)); }
}
@media (max-width: 680px) {
  .object-workspace-topbar { padding: 0 8px; }
  .workspace-back-button span:last-child, .object-workspace-actions .primary-button span:last-child { display: none; }
  .workspace-back-button { width: 35px; padding: 0; justify-content: center; }
  .object-workspace-actions .primary-button { width: 35px; padding: 0; }
  .face-workspace-layout, .space-workspace-layout { grid-template-columns: 1fr; }
  .face-inspector-panel, .space-info-panel { display: none; }
  .face-workspace-tools { gap: 1px; padding: 3px; }
  .workspace-tool, .workspace-icon-button { width: 31px; height: 31px; }
  .workspace-tool-separator { display: none; }
  .space-workspace-stage { padding: 14px; }
  .space-face-grid { grid-template-columns: 1fr; }
  .space-hero-preview { height: 260px; }
  .face-coordinate-readout { display: none; }
}

</style>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="構形 Canvas">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7 8.5 16 3l9 5.5v10L16 24l-9-5.5z"/><path d="M7 8.5 16 14l9-5.5M16 14v10"/></svg>
        </span>
        <span class="brand-copy">
          <strong>構形 Canvas</strong>
          <small>語意物件無限畫布</small>
        </span>
      </div>

      <nav class="tool-group" aria-label="畫布工具">
        <button class="tool-button active" type="button" data-tool="select" title="選取 (V)">
          <span data-icon="pointer"></span><span>選取</span>
        </button>
        <button class="tool-button" type="button" data-tool="pan" title="平移 (H 或空白鍵)">
          <span data-icon="hand"></span><span>平移</span>
        </button>
        <button class="tool-button" type="button" data-tool="connect" title="建立語意關係 (C)">
          <span data-icon="link"></span><span>關係</span>
        </button>
        <span class="toolbar-separator" aria-hidden="true"></span>
        <button id="undoButton" class="icon-button" type="button" title="復原 (Ctrl+Z)" aria-label="復原"><span data-icon="undo"></span></button>
        <button id="redoButton" class="icon-button" type="button" title="重做 (Ctrl+Y)" aria-label="重做"><span data-icon="redo"></span></button>
      </nav>

      <div class="top-actions">
        <label class="search-control" title="搜尋物件">
          <span data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="搜尋物件…" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <button id="fitButton" class="icon-button" type="button" title="顯示全部 (F)" aria-label="顯示全部"><span data-icon="fit"></span></button>
        <button id="exportButton" class="secondary-button" type="button"><span data-icon="download"></span>匯出</button>
        <button id="importButton" class="secondary-button" type="button"><span data-icon="upload"></span>匯入</button>
        <input id="importFileInput" type="file" accept="application/json,.json" hidden />
        <button id="createButton" class="primary-button" type="button"><span data-icon="plus"></span>建立物件</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar sidebar-left" aria-label="物件庫">
        <section class="sidebar-section create-section">
          <div class="section-heading">
            <div>
              <h2>物件庫</h2>
              <p>底層領域物件</p>
            </div>
            <button id="newObjectIconButton" class="icon-button compact" type="button" title="建立物件" aria-label="建立物件"><span data-icon="plus"></span></button>
          </div>
          <div class="quick-create-grid">
            <button type="button" class="quick-create" data-create-type="face">
              <span class="type-icon face"><span data-icon="face"></span></span>
              <span><strong>面</strong><small>Face</small></span>
            </button>
            <button type="button" class="quick-create" data-create-type="space">
              <span class="type-icon space"><span data-icon="space"></span></span>
              <span><strong>空間</strong><small>Space</small></span>
            </button>
          </div>
        </section>

        <section class="sidebar-section filter-section">
          <div class="section-label-row">
            <span class="section-label">顯示類型</span>
            <button id="showAllTypesButton" class="text-button" type="button">全部</button>
          </div>
          <label class="filter-row"><input type="checkbox" data-filter-type="face" checked /><span class="dot face"></span><span>面</span><strong id="faceCount">0</strong></label>
          <label class="filter-row"><input type="checkbox" data-filter-type="space" checked /><span class="dot space"></span><span>空間</span><strong id="spaceCount">0</strong></label>
        </section>

        <section class="sidebar-section object-tree-section">
          <div class="section-label-row">
            <span class="section-label">所有物件</span>
            <span id="objectCountBadge" class="count-badge">0</span>
          </div>
          <div id="objectList" class="object-list" role="list"></div>
        </section>

        <section class="sidebar-section canvas-options-section">
          <span class="section-label">畫布</span>
          <label class="switch-row"><span>格線吸附</span><input id="snapToggle" type="checkbox" checked /><span class="switch-ui"></span></label>
          <label class="switch-row"><span>顯示格線</span><input id="gridToggle" type="checkbox" checked /><span class="switch-ui"></span></label>
          <div class="project-utility-row">
            <button id="loadDemoButton" type="button">載入示範</button>
            <button id="newProjectButton" type="button">清空</button>
          </div>
        </section>
      </aside>

      <section id="canvasViewport" class="canvas-viewport" tabindex="0" aria-label="無限畫布">
        <div id="canvasWorld" class="canvas-world">
          <svg id="edgeLayer" class="edge-layer" aria-hidden="true">
            <defs>
              <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
                <path d="M0 0L9 4.5L0 9Z" />
              </marker>
            </defs>
            <g id="edgeGroup"></g>
          </svg>
          <div id="nodeLayer" class="node-layer"></div>
        </div>

        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-illustration" aria-hidden="true">
            <span class="empty-tile tile-a"></span><span class="empty-tile tile-b"></span><span class="empty-line"></span>
          </div>
          <h2>建立第一個領域物件</h2>
          <p>建立「面」或「空間」，它會以可預覽的節點出現在畫布；進入物件後，才在物件內部直接編輯。</p>
          <button id="emptyCreateButton" class="primary-button" type="button"><span data-icon="plus"></span>建立物件</button>
        </div>

        <div id="connectionHint" class="connection-hint" hidden>
          <span data-icon="link"></span>
          <span id="connectionHintText">先選擇關係來源物件</span>
          <button id="cancelConnectButton" type="button">取消</button>
        </div>

        <div class="canvas-controls" aria-label="縮放控制">
          <button id="zoomOutButton" class="icon-button" type="button" title="縮小" aria-label="縮小"><span data-icon="minus"></span></button>
          <button id="zoomLevelButton" class="zoom-level" type="button" title="回到 100%">100%</button>
          <button id="zoomInButton" class="icon-button" type="button" title="放大" aria-label="放大"><span data-icon="plus"></span></button>
          <span class="toolbar-separator vertical"></span>
          <button id="homeButton" class="icon-button" type="button" title="回到原點" aria-label="回到原點"><span data-icon="home"></span></button>
        </div>

        <div class="minimap-shell">
          <canvas id="minimap" width="220" height="132" aria-label="畫布小地圖"></canvas>
          <span>小地圖</span>
        </div>
      </section>

      <aside class="sidebar sidebar-right" aria-label="物件檢查器">
        <div id="inspectorEmpty" class="inspector-empty">
          <div class="inspector-empty-icon"><span data-icon="inspect"></span></div>
          <h2>尚未選取物件</h2>
          <p>選取畫布上的物件，這裡會顯示它的資料、關係與可用操作。</p>
        </div>
        <div id="inspectorContent" class="inspector-content" hidden></div>
      </aside>
    </main>

    <footer class="statusbar">
      <div class="status-left">
        <span id="toolStatus"><span class="status-dot"></span>選取工具</span>
        <span class="status-divider"></span>
        <span id="selectionStatus">未選取物件</span>
      </div>
      <div class="status-right">
        <span id="saveStatus"><span data-icon="check"></span>已自動儲存</span>
        <span class="status-divider"></span>
        <span id="summaryStatus">0 個物件 · 0 個關係</span>
      </div>
    </footer>
  </div>


  <section id="objectWorkspace" class="object-workspace" aria-label="物件內部工作區" hidden>
    <header class="object-workspace-topbar">
      <div class="object-workspace-trail">
        <button id="workspaceBackButton" class="workspace-back-button" type="button">
          <span data-icon="arrowLeft"></span><span id="workspaceBackLabel">返回物件畫布</span>
        </button>
        <span class="workspace-trail-divider" aria-hidden="true"></span>
        <span id="workspaceTypeIcon" class="type-icon face"><span data-icon="face"></span></span>
        <span class="workspace-title-copy">
          <small id="workspaceEyebrow">面內部工作區</small>
          <strong id="workspaceTitle">物件</strong>
        </span>
      </div>

      <nav id="faceWorkspaceTools" class="face-workspace-tools" aria-label="面內編輯工具">
        <button class="workspace-tool active" type="button" data-face-tool="select" title="選取與拖曳 (V)"><span data-icon="pointer"></span><span>選取</span></button>
        <button class="workspace-tool" type="button" data-face-tool="vertex" title="在邊界新增頂點 (P)"><span data-icon="vertex"></span><span>頂點</span></button>
        <button class="workspace-tool" type="button" data-face-tool="referenceLine" title="建立參考線 (L)"><span data-icon="line"></span><span>參考線</span></button>
        <button class="workspace-tool" type="button" data-face-tool="opening" title="建立開口 (R)"><span data-icon="rectangle"></span><span>開口</span></button>
        <button class="workspace-tool" type="button" data-face-tool="pan" title="平移面內畫布 (H 或空白鍵)"><span data-icon="hand"></span><span>平移</span></button>
        <span class="workspace-tool-separator" aria-hidden="true"></span>
        <button id="faceUndoButton" class="workspace-icon-button" type="button" title="復原 (Ctrl+Z)" aria-label="復原"><span data-icon="undo"></span></button>
        <button id="faceRedoButton" class="workspace-icon-button" type="button" title="重做 (Ctrl+Y)" aria-label="重做"><span data-icon="redo"></span></button>
      </nav>

      <div class="object-workspace-actions">
        <button id="workspaceFitButton" class="secondary-button" type="button"><span data-icon="fit"></span><span>顯示全部</span></button>
        <button id="workspaceDoneButton" class="primary-button" type="button"><span data-icon="check"></span><span>完成並返回</span></button>
      </div>
    </header>

    <main id="objectWorkspaceContent" class="object-workspace-content"></main>

    <footer class="object-workspace-statusbar">
      <div><span class="status-dot"></span><span id="workspaceToolStatus">選取工具</span><span class="status-divider"></span><span id="workspaceSelectionStatus">未選取面內元素</span></div>
      <div><span id="workspaceCoordinateStatus">X: 0 · Y: 0</span><span class="status-divider"></span><span id="workspaceZoomStatus">100%</span></div>
    </footer>
  </section>

  <div id="modalBackdrop" class="modal-backdrop" hidden></div>

  <section id="objectDialog" class="dialog object-dialog" role="dialog" aria-modal="true" aria-labelledby="objectDialogTitle" hidden>
    <header class="dialog-header">
      <div>
        <span id="objectDialogEyebrow" class="dialog-eyebrow">建立領域物件</span>
        <h2 id="objectDialogTitle">建立物件</h2>
      </div>
      <button class="icon-button dialog-close" type="button" data-close-dialog aria-label="關閉"><span data-icon="close"></span></button>
    </header>
    <form id="objectForm" class="dialog-body">
      <input id="editingObjectId" type="hidden" />
      <fieldset id="objectTypeChooser" class="type-chooser">
        <legend>物件類型</legend>
        <label class="type-choice selected">
          <input type="radio" name="objectType" value="face" checked />
          <span class="type-icon face"><span data-icon="face"></span></span>
          <span><strong>面</strong><small>平面邊界、標高、法線與座標系</small></span>
          <span class="choice-check"><span data-icon="check"></span></span>
        </label>
        <label class="type-choice">
          <input type="radio" name="objectType" value="space" />
          <span class="type-icon space"><span data-icon="space"></span></span>
          <span><strong>空間</strong><small>由邊界面所界定的三維區域</small></span>
          <span class="choice-check"><span data-icon="check"></span></span>
        </label>
      </fieldset>

      <div class="form-grid">
        <label class="field full"><span>名稱</span><input id="objectNameInput" name="name" type="text" required maxlength="80" placeholder="例如：天花板完成面" /></label>
        <div id="dynamicFields" class="dynamic-fields full"></div>
        <label class="field full"><span>描述 <small>選填</small></span><textarea id="objectDescriptionInput" name="description" rows="3" maxlength="500" placeholder="記錄用途、規則或施工註記…"></textarea></label>
      </div>
    </form>
    <footer class="dialog-footer">
      <button class="secondary-button" type="button" data-close-dialog>取消</button>
      <button id="submitObjectButton" class="primary-button" type="submit" form="objectForm"><span data-icon="plus"></span>建立並放到畫布</button>
    </footer>
  </section>

  <section id="viewDialog" class="dialog view-dialog" role="dialog" aria-modal="true" aria-labelledby="viewDialogTitle" hidden>
    <header class="dialog-header">
      <div>
        <span class="dialog-eyebrow">物件檢視</span>
        <h2 id="viewDialogTitle">物件</h2>
      </div>
      <button class="icon-button dialog-close" type="button" data-close-dialog aria-label="關閉"><span data-icon="close"></span></button>
    </header>
    <div id="viewDialogBody" class="dialog-body view-dialog-body"></div>
    <footer class="dialog-footer">
      <button class="secondary-button" type="button" data-close-dialog>關閉</button>
      <button id="viewEditButton" class="primary-button" type="button"><span data-icon="arrowRight"></span>進入物件</button>
    </footer>
  </section>

  <section id="relationDialog" class="dialog relation-dialog" role="dialog" aria-modal="true" aria-labelledby="relationDialogTitle" hidden>
    <header class="dialog-header">
      <div>
        <span class="dialog-eyebrow">建立語意關係</span>
        <h2 id="relationDialogTitle">連接兩個物件</h2>
      </div>
      <button class="icon-button dialog-close" type="button" data-close-dialog aria-label="關閉"><span data-icon="close"></span></button>
    </header>
    <form id="relationForm" class="dialog-body">
      <div id="relationEndpoints" class="relation-endpoints"></div>
      <div class="form-grid">
        <label class="field full"><span>關係類型</span>
          <select id="relationTypeInput" name="relationType">
            <option value="contains">包含 contains</option>
            <option value="boundedBy">由…界定 boundedBy</option>
            <option value="attachedTo">貼附於 attachedTo</option>
            <option value="references">參照 references</option>
            <option value="derivedFrom">衍生自 derivedFrom</option>
            <option value="relatedTo">相關 relatedTo</option>
          </select>
        </label>
        <label class="field full"><span>顯示名稱</span><input id="relationLabelInput" name="relationLabel" type="text" maxlength="60" /></label>
      </div>
    </form>
    <footer class="dialog-footer">
      <button class="secondary-button" type="button" data-close-dialog>取消</button>
      <button class="primary-button" type="submit" form="relationForm"><span data-icon="link"></span>建立關係</button>
    </footer>
  </section>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script>

  function uid(prefix = 'id') {
    const value = typeof crypto !== 'undefined' && crypto.randomUUID
      ? crypto.randomUUID().replace(/-/g, '').slice(0, 12)
      : `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
    return `${prefix}_${value}`;
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function deepClone(value) {
    return typeof structuredClone === 'function'
      ? structuredClone(value)
      : JSON.parse(JSON.stringify(value));
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function safeNumber(value, fallback = 0) {
    const number = Number(value);
    return Number.isFinite(number) ? number : fallback;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function round(value, decimals = 1) {
    const factor = 10 ** decimals;
    return Math.round(value * factor) / factor;
  }

  function formatLength(value) {
    const number = safeNumber(value);
    return `${Number.isInteger(number) ? number : round(number, 1)} cm`;
  }

  function formatArea(valueCm2) {
    return `${round(safeNumber(valueCm2) / 10000, 2)} m²`;
  }

  function formatVolume(valueCm3) {
    return `${round(safeNumber(valueCm3) / 1000000, 2)} m³`;
  }

  function shortId(id) {
    return String(id || '').split('_').at(-1)?.slice(0, 6).toUpperCase() || '—';
  }

  function createRectangleBoundary(width = 600, height = 450) {
    const w = Math.max(1, safeNumber(width, 600));
    const h = Math.max(1, safeNumber(height, 450));
    return [
      { id: uid('vertex'), x: 0, y: 0 },
      { id: uid('vertex'), x: w, y: 0 },
      { id: uid('vertex'), x: w, y: h },
      { id: uid('vertex'), x: 0, y: h }
    ];
  }

  function defaultFaceEditorState() {
    return {
      camera: { x: 120, y: 90, scale: 1 },
      gridSize: 25,
      snap: true,
      showGrid: true,
      initialized: false
    };
  }

  function normalizeFacePoint(point, index = 0) {
    if (Array.isArray(point)) {
      return { id: uid('vertex'), x: safeNumber(point[0]), y: safeNumber(point[1]) };
    }
    return {
      id: point?.id || uid('vertex'),
      x: safeNumber(point?.x),
      y: safeNumber(point?.y)
    };
  }

  function normalizeFaceElement(element, index = 0) {
    if (!element || typeof element !== 'object') return null;
    if (element.type === 'referenceLine') {
      return {
        id: element.id || uid('line'),
        type: 'referenceLine',
        label: element.label || `參考線 ${index + 1}`,
        x1: safeNumber(element.x1),
        y1: safeNumber(element.y1),
        x2: safeNumber(element.x2, 100),
        y2: safeNumber(element.y2)
      };
    }
    if (element.type === 'opening') {
      return {
        id: element.id || uid('opening'),
        type: 'opening',
        label: element.label || `開口 ${index + 1}`,
        x: safeNumber(element.x),
        y: safeNumber(element.y),
        width: Math.max(1, safeNumber(element.width, 60)),
        height: Math.max(1, safeNumber(element.height, 60))
      };
    }
    return null;
  }

  function polygonBounds(points) {
    if (!Array.isArray(points) || points.length === 0) {
      return { minX: 0, minY: 0, maxX: 1, maxY: 1, width: 1, height: 1, centerX: .5, centerY: .5 };
    }
    const xs = points.map((point) => safeNumber(point.x));
    const ys = points.map((point) => safeNumber(point.y));
    const minX = Math.min(...xs);
    const minY = Math.min(...ys);
    const maxX = Math.max(...xs);
    const maxY = Math.max(...ys);
    const width = Math.max(.001, maxX - minX);
    const height = Math.max(.001, maxY - minY);
    return { minX, minY, maxX, maxY, width, height, centerX: minX + width / 2, centerY: minY + height / 2 };
  }

  function polygonArea(points) {
    if (!Array.isArray(points) || points.length < 3) return 0;
    let sum = 0;
    for (let index = 0; index < points.length; index += 1) {
      const current = points[index];
      const next = points[(index + 1) % points.length];
      sum += safeNumber(current.x) * safeNumber(next.y) - safeNumber(next.x) * safeNumber(current.y);
    }
    return Math.abs(sum) / 2;
  }

  function polygonPerimeter(points) {
    if (!Array.isArray(points) || points.length < 2) return 0;
    let sum = 0;
    for (let index = 0; index < points.length; index += 1) {
      const current = points[index];
      const next = points[(index + 1) % points.length];
      sum += Math.hypot(safeNumber(next.x) - safeNumber(current.x), safeNumber(next.y) - safeNumber(current.y));
    }
    return sum;
  }

  function signedPolygonArea(points) {
    if (!Array.isArray(points) || points.length < 3) return 0;
    let sum = 0;
    for (let index = 0; index < points.length; index += 1) {
      const current = points[index];
      const next = points[(index + 1) % points.length];
      sum += safeNumber(current.x) * safeNumber(next.y) - safeNumber(next.x) * safeNumber(current.y);
    }
    return sum / 2;
  }

  function isAxisAlignedRectangle(points) {
    if (!Array.isArray(points) || points.length !== 4) return false;
    return points.every((point, index) => {
      const next = points[(index + 1) % points.length];
      return Math.abs(point.x - next.x) < .001 || Math.abs(point.y - next.y) < .001;
    });
  }

  function ensureFaceData(object) {
    if (!object || object.type !== 'face') return object;
    object.data = object.data && typeof object.data === 'object' ? object.data : {};
    const width = Math.max(1, safeNumber(object.data.width, 600));
    const height = Math.max(1, safeNumber(object.data.height, 450));
    const boundary = Array.isArray(object.data.boundary) && object.data.boundary.length >= 3
      ? object.data.boundary.map(normalizeFacePoint)
      : createRectangleBoundary(width, height);
    object.data.boundary = boundary;
    object.data.elements = (Array.isArray(object.data.elements) ? object.data.elements : [])
      .map(normalizeFaceElement)
      .filter(Boolean);
    const defaults = defaultFaceEditorState();
    const editor = object.data.editor && typeof object.data.editor === 'object' ? object.data.editor : {};
    object.data.editor = {
      ...defaults,
      ...editor,
      camera: {
        ...defaults.camera,
        ...(editor.camera || {}),
        x: safeNumber(editor.camera?.x, defaults.camera.x),
        y: safeNumber(editor.camera?.y, defaults.camera.y),
        scale: clamp(safeNumber(editor.camera?.scale, defaults.camera.scale), .08, 8)
      },
      gridSize: clamp(safeNumber(editor.gridSize, defaults.gridSize), 1, 500),
      snap: editor.snap !== false,
      showGrid: editor.showGrid !== false,
      initialized: Boolean(editor.initialized)
    };
    object.data.elevation = safeNumber(object.data.elevation, 0);
    object.data.normal = object.data.normal || '向上 +Z';
    object.data.coordinateSystem = object.data.coordinateSystem || 'WORLD';
    updateFaceDerived(object);
    return object;
  }

  function updateFaceDerived(object) {
    if (!object || object.type !== 'face') return;
    const points = Array.isArray(object.data?.boundary) ? object.data.boundary : [];
    const bounds = polygonBounds(points);
    object.data.width = round(bounds.width, 2);
    object.data.height = round(bounds.height, 2);
    object.data.shape = isAxisAlignedRectangle(points) ? 'rectangle' : 'polygon';
    object.data.area = round(polygonArea(points), 3);
    object.data.perimeter = round(polygonPerimeter(points), 3);
  }

  function setFaceBoundaryRectangle(object, width, height, options = {}) {
    if (!object || object.type !== 'face') return;
    object.data.boundary = createRectangleBoundary(width, height);
    if (options.manual !== undefined) object.data.manualGeometry = Boolean(options.manual);
    updateFaceDerived(object);
  }

  function faceElementById(object, elementId) {
    ensureFaceData(object);
    return object.data.elements.find((element) => element.id === elementId) || null;
  }

  function elementTypeLabel(element) {

  function getObject(objectId) {

  function getNode(nodeId) {

  function getNodesForObject(objectId) {

  function typeMeta(type) {

  function createDomainObject(type, name, data = {}, description = '') {
    const timestamp = nowIso();
    return {
      id: uid(type),

      description,

      createdAt: timestamp,

  function createCanvasNode(objectId, x, y, mode = 'preview') {
    const size = NODE_SIZE[mode] || NODE_SIZE.preview;
    return {
      id: uid('node'),

  function boundaryDefinitions(spaceObject) {
    const width = safeNumber(spaceObject.data.width, 600);
    const depth = safeNumber(spaceObject.data.depth, 450);
    const height = safeNumber(spaceObject.data.height, 280);
    const coordinateSystem = spaceObject.data.coordinateSystem || spaceObject.name;
    return [
      { role: 'ceiling', label: '天花板面', width, height: depth, elevation: height, normal: '向下 −Z', orientation: 'horizontal' },
      { role: 'floor', label: '地板面', width, height: depth, elevation: 0, normal: '向上 +Z', orientation: 'horizontal' },
      { role: 'north', label: '北牆面', width, height, elevation: 0, normal: '向南 +Y', orientation: 'vertical' },
      { role: 'south', label: '南牆面', width, height, elevation: 0, normal: '向北 −Y', orientation: 'vertical' },
      { role: 'east', label: '東牆面', width: depth, height, elevation: 0, normal: '向西 −X', orientation: 'vertical' },
      { role: 'west', label: '西牆面', width: depth, height, elevation: 0, normal: '向東 +X', orientation: 'vertical' }
    ].map((definition) => ({ ...definition, coordinateSystem }));
  }

  function createBoundaryFaces(spaceObject) {
    const faceObjects = [];
    const relations = [];
    for (const definition of boundaryDefinitions(spaceObject)) {
      const face = createDomainObject(
        'face',
        `${spaceObject.name}・${definition.label}`,
        {
          shape: 'rectangle',
          width: definition.width,
          height: definition.height,
          elevation: definition.elevation,
          normal: definition.normal,
          coordinateSystem: definition.coordinateSystem,
          boundaryRole: definition.role,
          orientation: definition.orientation,
          generatedFromSpaceId: spaceObject.id,
          boundary: createRectangleBoundary(definition.width, definition.height),
          elements: [],
          editor: defaultFaceEditorState(),
          manualGeometry: false
        },
        `由「${spaceObject.name}」自動產生的邊界面。`
      );
      faceObjects.push(face);
      relations.push({
        id: uid('rel'),
        type: 'contains',
        label: '包含',
        sourceObjectId: spaceObject.id,
        targetObjectId: face.id,
        sourceNodeId: null,
        targetNodeId: null,
        createdAt: nowIso()
      });
    }
    spaceObject.data.boundaryFaceIds = faceObjects.map((face) => face.id);
    return { faceObjects, relations };
  }

  function syncBoundaryFaces(spaceObject) {
    const definitions = new Map(boundaryDefinitions(spaceObject).map((definition) => [definition.role, definition]));
    for (const faceId of spaceObject.data.boundaryFaceIds || []) {
      const face = getObject(faceId);
      if (!face || face.type !== 'face') continue;
      const definition = definitions.get(face.data.boundaryRole);
      if (!definition) continue;
      face.name = `${spaceObject.name}・${definition.label}`;
      ensureFaceData(face);
      if (!face.data.manualGeometry) setFaceBoundaryRectangle(face, definition.width, definition.height, { manual: false });
      face.data.elevation = definition.elevation;
      face.data.normal = definition.normal;
      face.data.coordinateSystem = definition.coordinateSystem;
      face.data.orientation = definition.orientation;
      face.updatedAt = nowIso();
    }
  }

  function createDemoState() {
    const timestamp = nowIso();
    const space = createDomainObject('space', '房間 A', {
      width: 600,
      depth: 450,
      height: 280,
      coordinateSystem: 'ROOM-A',
      boundaryFaceIds: []
    }, '示範空間：由六個邊界面界定，可展開個別檢視。');
    const generated = createBoundaryFaces(space);
    const ceiling = generated.faceObjects.find((face) => face.data.boundaryRole === 'ceiling');
    ceiling.description = '房間 A 的天花板完成面，可作為角材、板材與開口的放置基準。';

    const spaceNode = createCanvasNode(space.id, 80, 90, 'preview');
    const ceilingNode = createCanvasNode(ceiling.id, 500, 135, 'preview');

    return normalizeState({
      version: APP_VERSION,
      project: { name: '未命名空間模型', createdAt: timestamp, updatedAt: timestamp },
      objects: [space, ...generated.faceObjects],
      nodes: [spaceNode, ceilingNode],
      relations: generated.relations,
      camera: { x: 120, y: 90, scale: 0.88 },
      preferences: { snap: true, gridSize: 20, showGrid: true }
    });
  }

  function createEmptyState() {
    const timestamp = nowIso();
    return normalizeState({
      version: APP_VERSION,
      project: { name: '未命名專案', createdAt: timestamp, updatedAt: timestamp },
      objects: [],
      nodes: [],
      relations: [],
      camera: { x: 240, y: 160, scale: 1 },
      preferences: { snap: true, gridSize: 20, showGrid: true }
    });
