<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e6e9ee}a{color:#4e67e8}a:hover{color:#3d54d4}</style>
</helmet>
<div data-screen-label="步驟板" style="padding:40px;display:flex;flex-direction:column;gap:48px;font-family:Inter,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#172033;width:max-content">
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
    <section id="{{ r.id }}" style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;gap:12px"><span style="padding:2px 8px;border-radius:6px;background:#172033;color:#fff;font-size:12px;font-weight:700">{{ r.id }}</span><h2 style="margin:0;font-size:18px;font-weight:700">{{ r.title }}</h2><span style="font-size:13px;color:#6b7485">{{ r.sub }}</span></div>
      <div style="display:flex;gap:24px">
        <sc-for list="{{ r.frames }}" as="f" hint-placeholder-count="3">
          <figure style="margin:0;display:flex;flex-direction:column;gap:8px;width:1000px">
            <div style="width:1000px;height:600px;border-radius:10px;overflow:hidden;box-shadow:0 12px 34px rgba(24,33,51,.12),0 3px 10px rgba(24,33,51,.08);background:#eef1f5">
              <dc-import name="形狀編輯提案" scene="{{ f.scene }}" embed="{{ true }}" hint-size="1000px,600px" style="width:1000px;height:600px;display:block"></dc-import>
            </div>
            <figcaption style="display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.5"><b style="flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#4e67e8;color:#fff;font-size:11.5px">{{ f.n }}</b><span><strong>{{ f.title }}</strong> <span style="color:#6b7485">{{ f.desc }}</span></span></figcaption>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { id: "1a", title: "A · 邊優先", sub: "點邊／角 → 就地選操作 → 填參數 → 套用；已建特徵可複製、鏡射、等距", frames: [
        { scene: "a1", title: "點一條邊", desc: "邊亮起，浮出「凹口／外凸／推拉」；點角則是「切角」。拖邊直接推拉。" },
        { scene: "a2", title: "就地填參數", desc: "定位（從左／置中／從右）＋距離、寬、深；畫布紅色虛框即時預覽，Enter 套用。" },
        { scene: "a3", title: "特徵可再操作", desc: "選取後顯示可直接改的尺寸標註，浮動列提供複製／鏡射／等距 ×3／刪除。" } ] },
      { id: "1b", title: "B · 參數面板", sub: "右欄「形狀」頁：基底外環 ＋ 依序套用的特徵清單，改數字畫布即時更新", frames: [
        { scene: "b1", title: "清單＋數字", desc: "每個特徵一列：寬、高、距左／右、距上／下，可切換起算邊；hover 列時畫布高亮。" } ] },
      { id: "1c", title: "C · 步驟引導", sub: "選操作 → 指位置 → 填尺寸 → 確認；每步有提示，可回上一步", frames: [
        { scene: "c1", title: "1 選操作", desc: "六種操作卡片，紅＝減料、綠＝加料。" },
        { scene: "c2", title: "2 指位置", desc: "可點的邊脈動提示；點下去就進下一步。" },
        { scene: "c3", title: "3 填尺寸", desc: "同 A 的參數表，畫布即時預覽。" },
        { scene: "c4", title: "4 確認", desc: "一句話摘要；可「確認並再加一個」連續操作。" } ] },
      { id: "1d", title: "D · 直接繪製", sub: "「減」「加」拖任意矩形，放開即吸附；選取後才出現可改的尺寸標註", frames: [
        { scene: "d1", title: "拖矩形", desc: "拖曳時顯示即時尺寸；蓋到邊＝凹口、全在面內＝開口、蓋到角＝切角。" },
        { scene: "d2", title: "事後修正", desc: "放開後自動吸附格距並選取；點寬、深、距邊數字直接改。" } ] },
      { id: "0", title: "現況", sub: "對照組：凹口對話框、逐點重畫外環", frames: [
        { scene: "cur1", title: "凹口＝點邊＋對話框", desc: "點邊後彈出對話框填 w／d，看不到畫布預覽。" },
        { scene: "cur2", title: "外環＝整個重畫", desc: "只想改局部也得從頭逐點畫；閉合後孔一併清掉。" } ] },
    ].map(r => ({ ...r, frames: r.frames.map((f, i) => ({ ...f, n: String(i + 1) })) }));
    return { rows };
  }
}
</script>
</body>
</html>
