<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#eef1f5}a{color:#4e67e8}a:hover{color:#3d54d4}</style>
</helmet>
<div data-screen-label="面內工作區" style="position:relative;width:1382px;height:804px;display:grid;grid-template-rows:62px minmax(0,1fr) 29px;font-family:Inter,'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:14px;line-height:1.45;color:#172033;background:#eef1f5;overflow:hidden">
  <header style="min-width:0;display:grid;grid-template-columns:minmax(280px,1fr) auto minmax(250px,1fr);align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #dfe4eb;background:rgba(255,255,255,.98)">
    <div style="min-width:0;display:flex;align-items:center;gap:10px">
      <button style="height:35px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;color:#485366;font-size:11px;font-weight:650;cursor:pointer;font-family:inherit;white-space:nowrap"><span>←</span> <span>返回物件畫布</span></button>
      <span style="width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:#f7f8fa;color:#657084;font-size:14px">▱</span>
      <div style="min-width:0;display:flex;flex-direction:column;line-height:1.3"><small style="color:#6b7485;font-size:9px;font-weight:750;letter-spacing:.075em;text-transform:uppercase">面內工作區</small><strong style="font-size:13px;letter-spacing:-.01em;white-space:nowrap">面 3</strong></div>
    </div>
    <nav style="justify-self:center;display:flex;align-items:center;gap:3px;padding:4px;border:1px solid #dfe4eb;border-radius:10px;background:#f7f8fa">
      <sc-for list="{{ tools }}" as="t" hint-placeholder-count="8">
        <button style="height:34px;padding:0 9px;border:0;border-radius:7px;background:{{ t.bg }};color:{{ t.fg }};font-size:11px;font-weight:650;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:{{ t.shadow }}">{{ t.name }}</button>
      </sc-for>
      <span style="width:1px;height:20px;margin:0 2px;background:#dfe4eb"></span>
      <button style="width:33px;height:34px;border:0;border-radius:7px;background:transparent;color:#6b7485;font-size:14px;cursor:pointer">↶</button>
      <button style="width:33px;height:34px;border:0;border-radius:7px;background:transparent;color:#6b7485;font-size:14px;cursor:pointer">↷</button>
      <span style="width:1px;height:20px;margin:0 2px;background:#dfe4eb"></span>
      <button style="width:33px;height:34px;border:0;border-radius:7px;background:transparent;color:#6b7485;font-size:14px;cursor:pointer">⛶</button>
    </nav>
    <div style="justify-self:end;display:flex;align-items:center;gap:7px">
      <button style="height:34px;padding:0 12px;border:0;border-radius:8px;background:#4e67e8;color:#fff;font-size:11px;font-weight:650;box-shadow:0 1px 2px rgba(45,65,170,.2);cursor:pointer;font-family:inherit;white-space:nowrap">完成並返回</button>
    </div>
  </header>

  <main style="min-height:0;min-width:0;overflow:hidden">
    <div style="width:100%;height:100%;display:grid;grid-template-columns:236px minmax(0,1fr) 314px;background:#eef1f5">
      <aside style="min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid #dfe4eb">
        <section style="padding:13px 14px;border-bottom:1px solid #dfe4eb">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;color:#6b7485;font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap"><span>面內物件</span><span>{{ layerCount }}</span></div>
          <div style="display:grid;gap:4px">
            <sc-for list="{{ layers }}" as="l" hint-placeholder-count="3">
              <div style="min-height:39px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 7px;border-radius:8px;cursor:pointer">
                <span style="width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:#f7f8fa;color:#657084;font-size:13px">{{ l.icon }}</span>
                <span style="min-width:0;display:flex;flex-direction:column;line-height:1.35"><strong style="font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.name }}</strong><small style="color:#6b7485;font-size:8.5px">{{ l.sub }}</small></span>
                <sc-if value="{{ l.del }}" hint-placeholder-val="{{ false }}"><button style="margin-left:auto;border:0;background:none;color:#a6aebb;cursor:pointer;font-size:12px;padding:2px 5px;border-radius:4px">✕</button></sc-if>
              </div>
            </sc-for>
          </div>
        </section>
        <section style="padding:13px 14px;border-bottom:1px solid #dfe4eb">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#6b7485;font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap"><span>面內畫布</span></div>
          <div style="display:grid;gap:8px">
            <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;color:#4f5a6d;font-size:10.5px"><span>吸附格線</span><input type="checkbox" checked="{{ true }}" readOnly="{{ true }}" style="accent-color:#2f8f7b;margin:0"></label>
            <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;color:#4f5a6d;font-size:10.5px"><span>顯示格線</span><input type="checkbox" checked="{{ true }}" readOnly="{{ true }}" style="accent-color:#2f8f7b;margin:0"></label>
            <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;color:#4f5a6d;font-size:10.5px"><span>格距</span><span style="height:29px;min-width:78px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:space-between;gap:6px">50 mm<span style="font-size:8px">▼</span></span></label>
          </div>
        </section>
        <section style="padding:13px 14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#6b7485;font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap"><span>說明</span></div>
          <div style="padding:0 14px 12px 0;color:#6b7485;font-size:9.5px;line-height:1.6">選取 v · 參考線 l · 開口 r · 凹口 i · 角材 t · 外環 e · 平移 h/空白 · fit f · 返回 Esc</div>
        </section>
      </aside>

      <section style="position:relative;min-width:0;min-height:0;overflow:hidden;background:#f8fafc">
        <svg style="width:100%;height:100%;display:block">
          <g transform="{{ editorTf }}">
            <sc-for list="{{ gridLines }}" as="g" hint-placeholder-count="0"><line x1="{{ g.x1 }}" y1="{{ g.y1 }}" x2="{{ g.x2 }}" y2="{{ g.y2 }}" style="stroke:#e6eaf0;stroke-width:{{ gridW }}"></line></sc-for>
            <sc-for list="{{ loops }}" as="lp" hint-placeholder-count="1"><polygon points="{{ lp.points }}" style="fill:{{ lp.fill }};stroke:#2f8f7b;stroke-width:1.7;vector-effect:non-scaling-stroke"></polygon></sc-for>
            <sc-for list="{{ verts }}" as="v" hint-placeholder-count="0"><circle cx="{{ v.x }}" cy="{{ v.y }}" r="{{ vr }}" style="fill:#fff;stroke:#2f8f7b;stroke-width:1.7;vector-effect:non-scaling-stroke;cursor:move"></circle></sc-for>
            <sc-for list="{{ guides }}" as="g" hint-placeholder-count="0"><line x1="{{ g.x1 }}" y1="{{ g.y1 }}" x2="{{ g.x2 }}" y2="{{ g.y2 }}" style="fill:none;stroke:#66758d;stroke-width:1.7;stroke-dasharray:7 5;vector-effect:non-scaling-stroke"></line></sc-for>
            <sc-for list="{{ ghosts }}" as="o" hint-placeholder-count="0"><rect x="{{ o.x }}" y="{{ o.y }}" width="{{ o.w }}" height="{{ o.h }}" style="fill:{{ o.fill }};stroke:{{ o.stroke }};stroke-width:1.4;stroke-dasharray:6 4;vector-effect:non-scaling-stroke"></rect></sc-for>
          </g>
        </svg>
        <sc-for list="{{ ghosts }}" as="o" hint-placeholder-count="0"><span style="position:absolute;left:{{ o.lx }};top:{{ o.ly }};transform:translate(-50%,-50%);font-size:11px;font-weight:600;color:#5b4a2a;pointer-events:none;white-space:nowrap">{{ o.label }}</span></sc-for>
        <div style="position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(520px,calc(100% - 40px));padding:7px 10px;border:1px solid rgba(206,213,224,.92);border-radius:8px;background:rgba(255,255,255,.91);box-shadow:0 1px 2px rgba(22,31,50,.06);color:#5a6678;font-size:9.5px;font-weight:600;text-align:center;white-space:nowrap">選取 · 拖頂點/邊編輯，點參考線可拖動</div>
        <div style="position:absolute;right:14px;bottom:14px;min-width:138px;padding:7px 9px;border:1px solid #dfe4eb;border-radius:8px;background:rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(22,31,50,.06);color:#6b7485;font-size:9.5px;font-variant-numeric:tabular-nums">u:1850 v:600</div>
      </section>

      <aside style="min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border-left:1px solid #dfe4eb;overflow-y:auto">
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:12px;font-weight:700">面 3<span style="padding:1px 7px;border-radius:9px;background:#f7f8fa;color:#6b7485;font-size:9px;font-weight:650">已放置</span></div>
          <sc-for list="{{ kv }}" as="k" hint-placeholder-count="6"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 0;font-size:10.5px"><span style="color:#6b7485">{{ k.k }}</span><b style="font-weight:600;font-variant-numeric:tabular-nums;text-align:right">{{ k.v }}</b></div></sc-for>
        </div>
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="margin-bottom:9px;font-size:12px;font-weight:700">邊（外環）</div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <sc-for list="{{ edgeRows }}" as="e" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;gap:6px"><span style="min-width:28px;font-size:12px;color:#66758d">{{ e.idx }}</span><span style="width:72px;font-size:12px;padding:2px 4px;border:1px solid #767676;border-radius:2px;background:#fff;box-sizing:border-box">{{ e.len }}</span><button style="min-width:30px;height:26px;padding:0 6px;border:1px solid #2f8f7b;border-radius:6px;background:#e8f7f2;color:#2f8f7b;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit">F</button></div>
            </sc-for>
          </div>
        </div>
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="margin-bottom:9px;font-size:12px;font-weight:700">放置</div>
          <div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px">
            <sc-for list="{{ presets }}" as="p" hint-placeholder-count="6"><button style="padding:2px 6px;border:0;background:none;color:#4e67e8;font-size:10.5px;font-weight:650;cursor:pointer;font-family:inherit">{{ p }}</button></sc-for>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">origin x<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center">0</span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">origin y<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center">0</span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">origin z<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center">0</span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">u 軸<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center;justify-content:space-between">+x<span style="font-size:8px">▼</span></span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">v 軸<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center;justify-content:space-between">+x<span style="font-size:8px">▼</span></span></label>
            <button style="grid-column:1 / -1;min-height:32px;padding:0 10px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;color:#172033;font-size:11px;font-weight:650;cursor:pointer;font-family:inherit">放置 / 重綁</button>
          </div>
        </div>
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="margin-bottom:9px;font-size:12px;font-weight:700">角材放置</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">長度 L<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#98a1b2;display:flex;align-items:center">auto</span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">A<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center">27</span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">B<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center">33</span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">方向<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center;justify-content:space-between">+u<span style="font-size:8px">▼</span></span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">深度<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#172033;display:flex;align-items:center;justify-content:space-between">+n<span style="font-size:8px">▼</span></span></label>
          </div>
          <div style="padding:8px 0 0;color:#6b7485;font-size:9.5px;line-height:1.6">選「角材」工具後在面上點擊放置（足跡需落在有效區域內）</div>
        </div>
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="margin-bottom:9px;font-size:12px;font-weight:700">網格</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">u 座標<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#98a1b2;display:flex;align-items:center">500 1500</span></label>
            <label style="display:flex;flex-direction:column;gap:3px;color:#6b7485;font-size:9.5px">v 座標<span style="height:28px;padding:0 7px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;font-size:10.5px;color:#98a1b2;display:flex;align-items:center">300 900</span></label>
          </div>
          <button style="margin-top:7px;min-height:32px;padding:0 10px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;color:#172033;font-size:11px;font-weight:650;cursor:pointer;font-family:inherit">建立網格</button>
        </div>
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="font-size:12px;font-weight:700"><button style="padding:2px 6px;border:0;background:none;color:#4e67e8;font-size:10.5px;font-weight:650;cursor:pointer;font-family:inherit">▸ 投影視圖</button></div>
        </div>
      </aside>
    </div>
  </main>

  <footer style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 11px;border-top:1px solid #dfe4eb;background:#fbfcfd;color:#6b7485;font-size:9.5px">
    <div style="min-width:0;display:flex;align-items:center;gap:8px"><span>工具：選取</span><span style="width:1px;height:12px;background:#dfe4eb"></span><span></span></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const outer = [[0,0],[4000,0],[4000,1250],[0,1250]], hole = [[2400,400],[2900,400],[2900,900],[2400,900]];
    const bb = [0, 0, 4000, 1250], vw = 832, vh = 713;
    const z = Math.min(vw / 4000, vh / 1250) * .8;
    const panX = vw / 2 - 2000 * z, panY = vh / 2 - 625 * z;
    const pad = 80 / z, g = 50, gridLines = [];
    const x0 = Math.floor((bb[0] - pad) / g) * g, x1 = Math.ceil((bb[2] + pad) / g) * g;
    const y0 = Math.floor((bb[1] - pad) / g) * g, y1 = Math.ceil((bb[3] + pad) / g) * g;
    for (let x = x0; x <= x1; x += g) gridLines.push({ x1: x, y1: y0, x2: x, y2: y1 });
    for (let y = y0; y <= y1; y += g) gridLines.push({ x1: x0, y1: y, x2: x1, y2: y });
    const gb = [bb[0] - pad, bb[1] - pad, bb[2] + pad, bb[3] + pad];
    const guides = [{ x1: 1500, y1: gb[1], x2: 1500, y2: gb[3] }, { x1: gb[0], y1: 1000, x2: gb[2], y2: 1000 }];
    const toPx = (u, v) => ({ lx: `${u * z + panX}px`, ly: `${v * z + panY}px` });
    const ghosts = [
      { x: 3200, y: 0, w: 600, h: 600, fill: "rgba(196,120,26,.34)", stroke: "#a35d08", label: "柱1·角凹", ...toPx(3500, 300) },
      { x: 0, y: 1000, w: 4000, h: 250, fill: "rgba(64,110,201,.20)", stroke: "#406ec9", label: "樑1·條帶", ...toPx(2000, 1125) },
    ];
    const active = "select";
    const tools = ["選取", "參考線", "開口", "凹口", "角材", "外環", "形狀", "平移"].map((n, i) => ({ name: n, bg: i === 0 ? "#fff" : "transparent", fg: i === 0 ? "#2f8f7b" : "#6b7485", shadow: i === 0 ? "0 1px 2px rgba(22,31,50,.06),0 1px 5px rgba(22,31,50,.04)" : "none" }));
    const layers = [
      { icon: "▱", name: "外環", sub: "4 頂點 · 4/4 邊 F", del: false },
      { icon: "▨", name: "孔 1", sub: "4 頂點 · 500×500", del: false },
      { icon: "⌖", name: "參考線 3", sub: "u = 1500", del: true },
      { icon: "⌖", name: "參考線 4", sub: "v = 1000", del: true },
      { icon: "▤", name: "柱 1 投影", sub: "切角凹", del: false },
      { icon: "▤", name: "樑 1 投影", sub: "條帶 · 勾選+裁切才生效", del: false },
    ];
    const kv = [
      { k: "id", v: "3" }, { k: "承載面", v: "3" }, { k: "origin", v: "0, 0, 2500" }, { k: "u / v", v: "+x / +y" },
      { k: "bbox", v: "0, 0, 4000, 1250" }, { k: "面積", v: "4.75 m²" }, { k: "所屬空間", v: "—" }];
    const edgeRows = [{ idx: "0→", len: 4000 }, { idx: "1↓", len: 1250 }, { idx: "2←", len: 4000 }, { idx: "3↑", len: 1250 }];
    return {
      tools, layers, layerCount: layers.length, kv, edgeRows, presets: ["天花", "地板", "y=0 牆", "y=D 牆", "x=0 牆", "x=W 牆"],
      editorTf: `translate(${panX},${panY}) scale(${z})`, gridLines, gridW: 1 / z, vr: 5 / z,
      loops: [{ points: outer.map(p => p.join(",")).join(" "), fill: "rgba(47,143,123,.13)" }, { points: hole.map(p => p.join(",")).join(" "), fill: "#f8fafc" }],
      verts: [...outer, ...hole].map(p => ({ x: p[0], y: p[1] })), guides, ghosts,
    };
  }
}
</script>
</body>
</html>
