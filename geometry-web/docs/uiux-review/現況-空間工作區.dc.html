<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#eef1f5}a{color:#4e67e8}a:hover{color:#3d54d4}</style>
</helmet>
<div data-screen-label="空間工作區" style="position:relative;width:1382px;height:804px;display:grid;grid-template-rows:62px minmax(0,1fr) 29px;font-family:Inter,'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:14px;line-height:1.45;color:#172033;background:#eef1f5;overflow:hidden">
  <header style="min-width:0;display:grid;grid-template-columns:minmax(280px,1fr) auto minmax(250px,1fr);align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #dfe4eb;background:rgba(255,255,255,.98)">
    <div style="min-width:0;display:flex;align-items:center;gap:10px">
      <button style="height:35px;display:inline-flex;align-items:center;gap:7px;padding:0 10px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;color:#485366;font-size:11px;font-weight:650;cursor:pointer;font-family:inherit;white-space:nowrap"><span>←</span> <span>返回物件畫布</span></button>
      <span style="width:28px;height:28px;display:grid;place-items:center;border-radius:7px;background:#f7f8fa;color:#657084;font-size:14px">▱</span>
      <div style="min-width:0;display:flex;flex-direction:column;line-height:1.3"><small style="color:#6b7485;font-size:9px;font-weight:750;letter-spacing:.075em;text-transform:uppercase">空間工作區</small><strong style="font-size:13px;letter-spacing:-.01em;white-space:nowrap">空間 1</strong></div>
    </div>
    <span></span>
    <div style="justify-self:end;display:flex;align-items:center;gap:7px">
      <button style="height:34px;padding:0 12px;border:0;border-radius:8px;background:#4e67e8;color:#fff;font-size:11px;font-weight:650;box-shadow:0 1px 2px rgba(45,65,170,.2);cursor:pointer;font-family:inherit;white-space:nowrap">完成並返回</button>
    </div>
  </header>

  <main style="min-height:0;min-width:0;overflow:hidden">
    <div style="width:100%;height:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 310px;background:#eef1f5">
      <aside style="min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid #dfe4eb;overflow-y:auto">
        <section style="padding:13px 14px;border-bottom:1px solid #dfe4eb">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#6b7485;font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap"><span>成員面</span><span>5</span></div>
          <div style="display:grid;gap:5px">
            <sc-for list="{{ members }}" as="m" hint-placeholder-count="5">
              <button style="min-height:46px;display:grid;grid-template-columns:31px minmax(0,1fr) 16px;align-items:center;gap:8px;padding:6px 8px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;cursor:pointer;font-family:inherit"><span style="width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:#e8f7f2;color:#2f8f7b;font-size:14px">▱</span><span style="min-width:0;display:flex;flex-direction:column;line-height:1.35"><strong style="font-size:10.5px;color:#172033">面 {{ m.id }}</strong><small style="color:#6b7485;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.bbox }}</small></span><span style="color:#98a1b2;font-size:14px">›</span></button>
            </sc-for>
          </div>
        </section>
        <section style="padding:13px 14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#6b7485;font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap"><span>構件（柱/樑）</span><span>3</span></div>
          <div style="display:grid;gap:5px">
            <sc-for list="{{ rc }}" as="r" hint-placeholder-count="3">
              <div style="min-height:46px;display:grid;grid-template-columns:31px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px;border:1px solid transparent;border-radius:9px;cursor:pointer"><span style="width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:#ececec;color:#5a5a5a;font-size:14px">{{ r.icon }}</span><span style="min-width:0;display:flex;flex-direction:column;line-height:1.35"><strong style="font-size:10.5px">{{ r.name }}</strong><small style="color:#6b7485;font-size:8.5px">{{ r.dims }}</small></span><span style="font-size:14px;color:#172033">移出</span><button style="border:0;background:none;color:#a6aebb;cursor:pointer;font-size:12px;padding:2px 5px;border-radius:4px">✕</button></div>
            </sc-for>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin:13px 0 9px;color:#6b7485;font-size:9.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap"><span>游離構件</span></div>
          <div style="display:flex;justify-content:space-between;margin:4px 0;font-size:10.5px"><span style="color:#6b7485">無游離構件</span></div>
        </section>
      </aside>

      <section style="min-width:0;min-height:0;overflow:auto;padding:26px;background:#f8fafc">
        <div style="max-width:760px;margin:0 auto 16px;border:1px solid #dfe4eb;border-radius:13px;background:#fff;box-shadow:0 1px 2px rgba(22,31,50,.06);overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:13px;font-weight:600;border-bottom:1px solid #dfe4eb">
            <span>平面示意</span>
            <span style="display:flex;gap:10px;align-items:center;font-weight:400">
              <label style="display:inline-flex;align-items:center;white-space:nowrap">柱<span style="margin-left:4px;font-size:13px;border:1px solid #767676;border-radius:3px;padding:1px 4px;background:#efefef">600 ▾</span>見方</label>
              <label style="display:inline-flex;align-items:center;white-space:nowrap">樑<span style="margin-left:4px;font-size:13px;border:1px solid #767676;border-radius:3px;padding:1px 4px;background:#efefef">350×600 ▾</span></label>
              <span style="color:#6b7485;font-size:12px">點放柱 · 拖放樑</span>
            </span>
          </div>
          <svg viewBox="-330 -330 4660 3660" style="display:block;width:100%;height:200px;cursor:crosshair">
            <polygon points="0,0 4000,0 4000,3000 0,3000" style="fill:rgba(47,143,123,.10);stroke:#2f8f7b;stroke-width:2;vector-effect:non-scaling-stroke"></polygon>
            <rect x="0" y="0" width="600" height="600" style="fill:rgba(196,120,26,.45);stroke:#a35d08;stroke-width:2;vector-effect:non-scaling-stroke"></rect>
            <rect x="0" y="1325" width="4000" height="350" style="fill:rgba(64,110,201,.35);stroke:#406ec9;stroke-width:2;vector-effect:non-scaling-stroke"></rect>
            <rect x="1825" y="0" width="350" height="3000" style="fill:rgba(64,110,201,.35);stroke:#406ec9;stroke-width:2;vector-effect:non-scaling-stroke"></rect>
          </svg>
        </div>
        <div style="position:relative;max-width:760px;height:330px;margin:0 auto 20px;overflow:hidden;border:1px solid #dfe4eb;border-radius:13px;background:#fff;box-shadow:0 1px 2px rgba(22,31,50,.06)">
          <svg viewBox="0 0 12000 5200" style="width:100%;height:100%;display:block">
            <sc-for list="{{ views }}" as="v" hint-placeholder-count="3">
              <g transform="{{ v.tf }}">
                <rect x="0" y="0" width="{{ v.w }}" height="{{ v.h }}" style="fill:#fff;stroke:#bbb;stroke-width:1;vector-effect:non-scaling-stroke"></rect>
                <sc-for list="{{ v.rects }}" as="r" hint-placeholder-count="1"><rect x="{{ r.x }}" y="{{ r.y }}" width="{{ r.w }}" height="{{ r.h }}" style="fill:#dbe9ff;fill-opacity:.6;stroke:#3366cc;stroke-width:1.5;vector-effect:non-scaling-stroke"></rect></sc-for>
                <sc-for list="{{ v.rc }}" as="r" hint-placeholder-count="0"><rect x="{{ r.x }}" y="{{ r.y }}" width="{{ r.w }}" height="{{ r.h }}" style="fill:#c8c8c8;fill-opacity:.55;stroke:#5a5a5a;stroke-width:1.5;vector-effect:non-scaling-stroke"></rect></sc-for>
                <sc-for list="{{ v.guides }}" as="g" hint-placeholder-count="0"><line x1="{{ g.x1 }}" y1="{{ g.y1 }}" x2="{{ g.x2 }}" y2="{{ g.y2 }}" style="stroke:#cc3333;stroke-width:1;stroke-dasharray:60 30;vector-effect:non-scaling-stroke"></line></sc-for>
              </g>
            </sc-for>
          </svg>
          <sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><span style="position:absolute;left:{{ v.lx }};top:{{ v.ly }};font-size:9px;font-weight:700;color:#222">{{ v.title }}</span></sc-for>
        </div>
        <div style="max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(190px,1fr));gap:12px">
          <sc-for list="{{ members }}" as="m" hint-placeholder-count="5">
            <div style="min-width:0;overflow:hidden;border:1px solid #dfe4eb;border-radius:11px;background:#fff;box-shadow:0 1px 2px rgba(22,31,50,.06)">
              <div style="height:126px;border-bottom:1px solid #dfe4eb;background:#f7f9fb"><svg viewBox="{{ m.vb }}" style="width:100%;height:100%;display:block"><polygon points="{{ m.points }}" style="fill:rgba(47,143,123,.13);stroke:#2f8f7b;stroke-width:14;vector-effect:non-scaling-stroke"></polygon></svg></div>
              <div style="padding:10px"><h3 style="margin:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">面 {{ m.id }}</h3><p style="margin:3px 0 9px;color:#6b7485;font-size:9px">{{ m.dims }} · 4 頂點</p><button style="width:100%;height:30px;border:0;border-radius:7px;background:#f0ecff;color:#7557cc;font-size:9.5px;font-weight:700;cursor:pointer;font-family:inherit">進入面內工作區</button></div>
            </div>
          </sc-for>
        </div>
      </section>

      <aside style="min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border-left:1px solid #dfe4eb;overflow-y:auto">
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:12px;font-weight:700">空間 1<span style="padding:1px 7px;border-radius:9px;background:#f7f8fa;color:#6b7485;font-size:9px;font-weight:650">open</span></div>
          <div style="display:flex;justify-content:space-between;margin:4px 0;font-size:10.5px"><span style="color:#6b7485">id</span><b style="font-weight:600">1</b></div>
          <div style="display:flex;justify-content:space-between;margin:4px 0;font-size:10.5px"><span style="color:#6b7485">狀態</span><b style="font-weight:600">open（未閉合）</b></div>
          <div style="display:flex;justify-content:space-between;margin:4px 0;font-size:10.5px"><span style="color:#6b7485">成員</span><b style="font-weight:600">5 面</b></div>
        </div>
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="margin-bottom:9px;font-size:12px;font-weight:700">方向槽位（±X/±Y/±Z）</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
            <sc-for list="{{ slots }}" as="s" hint-placeholder-count="6"><div style="padding:7px 8px;border:1px solid {{ s.bd }};border-radius:7px;background:{{ s.bg }};text-align:center;font-size:9.5px;line-height:1.4"><span style="display:block;color:#6b7485;font-weight:750">{{ s.k }}</span><b style="display:block;margin-top:2px;color:{{ s.fg }};font-weight:600">{{ s.v }}</b></div></sc-for>
          </div>
        </div>
        <div style="padding:12px 14px;border-bottom:1px solid #dfe4eb">
          <div style="margin-bottom:9px;font-size:12px;font-weight:700">操作</div>
          <div style="display:grid;gap:6px">
            <button style="min-height:32px;padding:0 10px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;color:#172033;font-size:11px;font-weight:650;cursor:pointer;font-family:inherit">編輯成員</button>
            <button style="min-height:32px;padding:0 10px;border:1px solid #dfe4eb;border-radius:8px;background:#fff;color:#172033;font-size:11px;font-weight:650;cursor:pointer;font-family:inherit">重新整理三視圖</button>
          </div>
        </div>
      </aside>
    </div>
  </main>
  <footer style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 11px;border-top:1px solid #dfe4eb;background:#fbfcfd;color:#6b7485;font-size:9.5px">
    <div style="min-width:0;display:flex;align-items:center;gap:8px"><span>工具：選取</span><span style="width:1px;height:12px;background:#dfe4eb"></span><span></span></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const W = 4000, D = 3000, H = 2500;
    const face = (id, w, h) => ({ id, bbox: `0, 0, ${w}, ${h}`, dims: `0 × 0 × ${w} × ${h}`, vb: `-60 -60 ${w + 120} ${h + 120}`, points: `0,0 ${w},0 ${w},${h} 0,${h}` });
    const members = [face(4, D, H), face(5, W, H), face(10, H, D), face(11, W, 500), face(12, W, D)];
    const rc = [
      { icon: "▮", name: "柱 1", dims: "600×600 h2500" },
      { icon: "═", name: "樑 1", dims: "4000×350 頂2500" },
      { icon: "═", name: "樑 2", dims: "350×3000 頂2500" }];
    const views = [
      { title: "FRONT", tf: "translate(300,300)", w: W, h: H, rects: [{ x: 0, y: 0, w: W, h: H }], rc: [{ x: 0, y: 0, w: 600, h: H }, { x: 0, y: 0, w: W, h: 600 }], guides: [{ x1: 1500, y1: 0, x2: 1500, y2: H }], lx: "2.5%", ly: "4%" },
      { title: "SIDE", tf: "translate(4900,300)", w: D, h: H, rects: [{ x: 0, y: 0, w: D, h: H }], rc: [{ x: 0, y: 0, w: 600, h: H }], guides: [], lx: "41%", ly: "4%" },
      { title: "BOTTOM", tf: "translate(8400,300)", w: W, h: D, rects: [{ x: 0, y: 0, w: W, h: D }, { x: 2400, y: 400, w: 500, h: 500 }], rc: [{ x: 0, y: 0, w: 600, h: 600 }, { x: 0, y: 1325, w: W, h: 350 }, { x: 1825, y: 0, w: 350, h: D }], guides: [{ x1: 1500, y1: 0, x2: 1500, y2: D }], lx: "70%", ly: "4%" }];
    const on = { "+X": 1, "-X": 0, "+Y": 1, "-Y": 1, "+Z": 0, "-Z": 1 };
    const slots = Object.keys(on).map(k => ({ k, v: on[k] ? "佔用" : "空", bd: on[k] ? "#7557cc" : "#dfe4eb", bg: on[k] ? "#f0ecff" : "#fff", fg: on[k] ? "#7557cc" : "#98a1b2" }));
    return { members, rc, views, slots };
  }
}
</script>
</body>
</html>
