<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角材三視圖 · Web 介面</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="topbar">
  <button id="btnOpen">開啟場景檔…</button>
  <input id="file" type="file" accept=".scene" hidden>
  <select id="sceneList"></select>
  <button id="btnScene">載入所選</button>
  <button id="btnZoom">縮放重置</button>
  <button id="btnObj">▦ 物件畫布</button>
  <select id="tool">
    <option value="view">檢視／選取</option>
    <option value="rect">▭ 拉矩形建面</option>
    <option value="poly">⬠ 畫多邊形建面</option>
    <option value="hole">▨ 挖矩形孔</option>
    <option value="edit">✥ 編輯邊界</option>
  </select>
  <select id="workSurf"></select>
  <input id="newZ" type="number" value="0" step="100"
         style="width:76px" title="新平面高度 z（mm）" hidden>
  <button id="btnExport">匯出 .scene</button>
  <span id="objtools" hidden>
    <button id="btnNewRect">＋面·矩形</button>
    <button id="btnNewPoly">＋面·多邊形</button>
    <button id="btnNewSpace">＋空間</button>
    <button id="btnHole2" hidden>▨ 挖孔</button>
    <button id="btnBack" hidden>← 返回</button>
    <span id="crumb"></span>
  </span>
  <span class="sp"></span>
  <span class="hint">左鍵點選／拖參考線 · 中鍵平移 · 滾輪縮放 — 幾何由 web_bridge.exe（C）計算</span>
</div>
<svg id="cv"><g id="world"></g><g id="overlay"></g></svg>
<svg id="ocv" hidden><g id="oroot"></g></svg>
<div id="bar">
  <div class="row"><span id="status"></span><span id="hovertxt"></span></div>
  <div class="row">
    <input id="cmd" placeholder="指令：boundary｜placement｜surface(合體)｜space｜guide｜timber｜place on 面id at u v｜at-guides 線1 線2｜move 線id offset｜reset" autocomplete="off">
    <button id="btnEx">載入範例</button>
    <button id="btnClear">清空</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
