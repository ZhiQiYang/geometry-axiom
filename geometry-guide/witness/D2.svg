<!-- 牆的 frame U=+x V=+z:局部 (u,v) 在前視圖直接落到房間 (x,z);兩支立料貼 e3/e1、橫料停在它們的側面。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 -80 4500 5100" data-full="0 -80 4500 5100">
<style>
  polygon, line, rect { vector-effect: non-scaling-stroke; }
  .frame { fill: #ffffff; stroke: #bbbbbb; stroke-width: 1px; }
  .title { font: bold 150px sans-serif; fill: #222222; }
  .label { font: 110px sans-serif; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
  .guide-label { text-anchor: start; fill: #b03030; }
  .timber-label { fill: #7a4a00; font-weight: bold; }
  .guide-label, .timber-label { paint-order: stroke; stroke: #ffffff; stroke-width: 30px; stroke-linejoin: round; }
  .surface { fill: #dbe9ff; fill-opacity: 0.6; stroke: #3366cc; stroke-width: 1.5px; }
  .hole { fill: #ffffff; stroke: #3366cc; stroke-width: 1.5px; }
  .edge { stroke: #3366cc; stroke-width: 1.5px; }
  .edge-free { stroke: #e08020; stroke-width: 1.5px; stroke-dasharray: 30 15; }
  .guide { stroke: #cc3333; stroke-width: 1px; stroke-dasharray: 60 30; }
  .timber-face { fill: #ffd27f; fill-opacity: 0.5; stroke: #a06000; stroke-width: 1.5px; }
  .timber-face-near { fill-opacity: 0.85; }
</style>
<style id="witness">.role-boundary{fill:#e2a24a;stroke:#e2a24a}.role-primary{fill:#63b3ed;stroke:#63b3ed}.role-secondary{fill:#9ae6b4;stroke:#9ae6b4}.role-custom{fill:#d6bcfa;stroke:#d6bcfa}.stop{stroke:none}.stop-label{font:bold 110px sans-serif;dominant-baseline:middle;paint-order:stroke;stroke:#ffffff;stroke-width:30px;stroke-linejoin:round}.tile-frame{fill:#ffffff;stroke:#888888;stroke-width:1px}.tile-title{font:bold 72px sans-serif;fill:#222222}.tile line.edge,.tile line.guide,.tile line.edge-free{stroke-width:2px}.legend-title{font:bold 110px sans-serif;fill:#222222}.legend-text{font:95px sans-serif;fill:#333333;dominant-baseline:middle}.legend-box{fill:#ffffff;stroke:#bbbbbb;stroke-width:1px}.section-title{font:bold 120px sans-serif;fill:#222222}</style>
